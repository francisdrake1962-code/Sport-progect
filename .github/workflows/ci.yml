name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (server, src, tests — must pass, no continue-on-error)
        run: npm run lint

      - name: Test (full suite, randomized order — must pass)
        run: npm run test:ci
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-key-for-github-actions

      - name: Build (must pass)
        run: npm run build
