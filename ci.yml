name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint server/ --max-warnings 100
        continue-on-error: true

      - name: Run tests
        run: npx jest --forceExit --detectOpenHandles
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-key-for-github-actions

      - name: Build
        run: npm run build
        continue-on-error: true
