  # === FEEDBACK (Tickets) ===
  /feedback:
    get:
      tags: [Feedback]
      summary: List tickets (subscriber: own, admin: all)
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Tickets list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTickets'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Feedback]
      summary: Create support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, subject, message]
              properties:
                category:
                  type: string
                  enum: [trainer, technical, admin]
                subject:
                  type: string
                message:
                  type: string
      responses:
        '200':
          description: Ticket created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  ticketId:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'

  /feedback/{id}:
    get:
      tags: [Feedback]
      summary: Get ticket with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ticket with messages
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Feedback]
      summary: Delete ticket (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /feedback/{id}/messages:
    post:
      tags: [Feedback]
      summary: Add message to ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
      responses:
        '200':
          description: Message added
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/feedback/{id}/status:
    put:
      tags: [Admin]
      summary: Update ticket status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [open, in_progress, resolved]
      responses:
        '200':
          description: Status updated
        '403':
          $ref: '#/components/responses/Forbidden'

responses:
  BadRequest:
    description: Bad request
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Error'
  Unauthorized:
    description: Not authenticated
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Error'
  Forbidden:
    description: Insufficient permissions
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Error'
  NotFound:
    description: Resource not found
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Error'
