<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Комплексы — Админ-панель</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
</head>
<body>
    <div class="admin-layout" id="app"></div>
    <div class="modal-overlay" id="modal-item" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal">
            <div class="modal__header"><h2 class="modal__title" id="modal-title">Новый комплекс</h2><button class="modal__close" aria-label="Закрыть">&times;</button></div>
            <div class="modal__body">
                <input type="hidden" id="edit-id">
                <div class="form-group"><label for="f-name">Название</label><input type="text" class="form-control" id="f-name"></div>
                <div class="form-group"><label for="f-desc">Описание</label><textarea class="form-control" id="f-desc"></textarea></div>
                <div class="form-group"><label for="f-status">Статус</label><select class="form-control" id="f-status"><option value="active">Активен</option><option value="draft">Черновик</option></select></div>
            </div>
            <div class="modal__footer"><button class="btn btn--secondary" data-modal-close>Отмена</button><button class="btn btn--primary" id="btn-save">Сохранить</button></div>
        </div>
    </div>
    <script src="js/sidebar.js"></script><script src="js/api.js"></script><script src="js/admin.js"></script>
    <script>
    async function load() {
        if (!localStorage.getItem('admin_token')) { window.location.href = 'login.html'; return; }
        document.getElementById('app').innerHTML = getSidebar('complexes.html') + `<div class="main-content">${getTopbar('Комплексы')}<div class="page-content"><div class="card"><div class="card__header"><h2 class="card__title">Комплексы</h2><button class="btn btn--primary" data-modal-open="modal-item" onclick="openCreate()">+ Новый</button></div><div class="table-wrapper"><table><caption>Список комплексов</caption><thead><tr><th>ID</th><th>Название</th><th>Описание</th><th>Статус</th><th>Действия</th></tr></thead><tbody id="tbody"></tbody></table></div></div></div></div>`;
        try {
            const items = await window.api.get('/api/complexes');
            if (!items) return;
            document.getElementById('tbody').innerHTML = items.map(i => `<tr><td>${esc(i.id)}</td><td>${esc(i.name)}</td><td>${esc(i.description||'—')}</td><td>${statusBadge(i.status)}</td><td><button class="btn btn--secondary btn--sm" data-edit='${esc(JSON.stringify(i))}' onclick="openEdit(this)">Редактировать</button> <button class="btn btn--danger btn--sm" onclick="del(${parseInt(i.id)})">Удалить</button></td></tr>`).join('');
        } catch (err) {
            document.getElementById('app').innerHTML += `<p style="color:var(--admin-danger);padding:1rem;">Ошибка: ${esc(err.message)}</p>`;
        }
    }
    function openCreate() { document.getElementById('modal-title').textContent='Новый комплекс'; document.getElementById('edit-id').value=''; document.getElementById('f-name').value=''; document.getElementById('f-desc').value=''; document.getElementById('f-status').value='active'; document.getElementById('modal-item').classList.add('is-open'); }
    function openEdit(btn) { const i = JSON.parse(btn.getAttribute('data-edit')); document.getElementById('modal-title').textContent='Редактировать'; document.getElementById('edit-id').value=i.id; document.getElementById('f-name').value=i.name; document.getElementById('f-desc').value=i.description||''; document.getElementById('f-status').value=i.status; document.getElementById('modal-item').classList.add('is-open'); }
    document.getElementById('btn-save').addEventListener('click', async () => {
        const id = document.getElementById('edit-id').value;
        const data = { name: document.getElementById('f-name').value, description: document.getElementById('f-desc').value, status: document.getElementById('f-status').value };
        try { if (id) await window.api.put(`/api/complexes/${id}`, data); else await window.api.post('/api/complexes', data); document.querySelector('.modal-overlay.is-open')?.classList.remove('is-open'); load(); } catch(e) { alert('Ошибка: '+e.message); }
    });
    async function del(id) { if (!confirm('Удалить?')) return; try { await window.api.del(`/api/complexes/${id}`); load(); } catch(e) { alert('Ошибка: '+e.message); } }
    load();
    </script>
</body>
</html>
