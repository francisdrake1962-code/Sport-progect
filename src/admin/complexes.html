<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, nofollow">
    <title>Комплексы — Админ-панель</title>
    <link rel="stylesheet" href="css/admin.css?v=<%= assetVersion %>">
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
</head>
<body>
    <noscript><div style="padding:2rem;text-align:center;font-family:sans-serif;background:#111;color:#eee;min-height:100vh;"><h1>Админ-панель требует JavaScript</h1><p>Включите JavaScript, чтобы пользоваться панелью.</p></div></noscript>
    <div class="admin-layout" id="app"></div>
    <div class="modal-overlay" id="modal-item" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal">
            <div class="modal__header"><h2 class="modal__title" id="modal-title">Новый комплекс</h2><button class="modal__close" aria-label="Закрыть">&times;</button></div>
            <div class="modal__body">
                <input type="hidden" id="edit-id">
                <div class="form-group"><label for="f-name">Название</label><input type="text" class="form-control" id="f-name"></div>
                <div class="form-group"><label for="f-desc">Описание</label><textarea class="form-control" id="f-desc"></textarea></div>
                <div class="form-group">
                    <label>Картинка</label>
                    <div style="display:flex;align-items:center;gap:0.5rem;margin-top:0.25rem;">
                        <input type="file" id="f-image" accept=".jpg,.jpeg,.png,.webp" style="font-size:0.85rem;">
                        <img id="f-image-preview" src="" alt="" style="display:none;max-height:60px;border-radius:4px;">
                    </div>
                </div>
                <div class="form-group"><label for="f-status">Статус</label><select class="form-control" id="f-status"><option value="active">Активен</option><option value="draft">Черновик</option></select></div>
            </div>
            <div class="modal__footer"><button class="btn btn--secondary" data-modal-close>Отмена</button><button class="btn btn--primary" id="btn-save">Сохранить</button></div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-picker" role="dialog" aria-modal="true" aria-labelledby="picker-title">
        <div class="modal" style="max-width:900px;">
            <div class="modal__header"><h2 class="modal__title" id="picker-title">Подбор занятий</h2><button class="modal__close" aria-label="Закрыть">&times;</button></div>
            <div class="modal__body">
                <input type="hidden" id="picker-complex-id">
                <div style="display:flex;gap:0.5rem;margin-bottom:0.75rem;flex-wrap:wrap;">
                    <input type="text" class="form-control" id="picker-search" placeholder="Поиск по названию..." style="flex:1;min-width:200px;">
                    <select class="form-control" id="picker-direction" style="width:180px;">
                        <option value="">Все направления</option>
                        <option value="суставная_разминка">Суставная разминка</option>
                        <option value="занятие_в_потоке">Занятие в потоке</option>
                    </select>
                    <select class="form-control" id="picker-zone" style="width:180px;">
                        <option value="">Все зоны</option>
                        <option value="шея">Шея</option>
                        <option value="плечи_руки">Плечи/руки</option>
                        <option value="грудной_отдел">Грудной отдел</option>
                        <option value="поясница">Поясница</option>
                        <option value="спина_осанка">Спина/осанка</option>
                        <option value="колени">Колени</option>
                        <option value="ноги_таз">Ноги/таз</option>
                        <option value="баланс_общее">Баланс</option>
                    </select>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                    <div>
                        <h3 style="margin:0 0 0.5rem;font-size:0.95rem;color:#666;">Доступные занятия</h3>
                        <div id="picker-available" style="max-height:400px;overflow-y:auto;border:1px solid #e0e0e0;border-radius:6px;padding:0.5rem;"></div>
                    </div>
                    <div>
                        <h3 style="margin:0 0 0.5rem;font-size:0.95rem;color:#666;">В комплексе <span id="picker-count"></span></h3>
                        <div id="picker-selected" style="max-height:400px;overflow-y:auto;border:1px solid #4caf50;border-radius:6px;padding:0.5rem;background:#f8fff8;"></div>
                    </div>
                </div>
            </div>
            <div class="modal__footer"><button class="btn btn--secondary" data-modal-close>Отмена</button><button class="btn btn--primary" id="btn-save-picker">Сохранить порядок</button></div>
        </div>
    </div>

    <script src="js/sidebar.js?v=<%= assetVersion %>"></script><script src="js/api.js?v=<%= assetVersion %>"></script><script src="js/admin.js?v=<%= assetVersion %>"></script>
    <script>
    let allLessons = [];
    let pickerLessons = [];
    let pickerZones = {};

    async function load() {
        if (!localStorage.getItem('admin_token')) { window.location.href = 'login.html'; return; }
        document.getElementById('app').innerHTML = getSidebar('complexes.html') + `<div class="main-content">${getTopbar('Комплексы (программы)')}<div class="page-content"><div class="card"><div class="card__header"><h2 class="card__title">Комплексы</h2><button class="btn btn--primary" data-modal-open="modal-item" onclick="openCreate()">+ Новый</button></div><div class="table-wrapper"><table><caption>Список комплексов</caption><thead><tr><th>ID</th><th>Название</th><th>Описание</th><th>Занятий</th><th>Статус</th><th>Действия</th></tr></thead><tbody id="tbody"></tbody></table></div></div></div></div>`;
        try {
            const [items, lessons] = await Promise.all([
                window.api.get('/api/complexes'),
                window.api.get('/api/lessons'),
            ]);
            if (!items) return;
            allLessons = lessons || [];

            document.getElementById('tbody').innerHTML = items.map(i => `<tr>
                <td>${esc(i.id)}</td>
                <td>${esc(i.name)}</td>
                <td>${esc(i.description||'—')}</td>
                <td>${i.lesson_count || 0}</td>
                <td>${statusBadge(i.status)}</td>
                <td>
                    <button class="btn btn--secondary btn--sm" onclick="openPicker(${parseInt(i.id)})">Подбор занятий</button>
                    <button class="btn btn--secondary btn--sm" data-edit='${esc(JSON.stringify(i))}' onclick="openEdit(this)">Редактировать</button>
                    <button class="btn btn--danger btn--sm" onclick="del(${parseInt(i.id)})">Удалить</button>
                </td>
            </tr>`).join('');
        } catch (err) {
            document.getElementById('app').innerHTML += `<p style="color:var(--admin-danger);padding:1rem;">Ошибка: ${esc(err.message)}</p>`;
        }
    }

    function openCreate() {
        document.getElementById('modal-title').textContent = 'Новый комплекс';
        document.getElementById('edit-id').value = '';
        document.getElementById('f-name').value = '';
        document.getElementById('f-desc').value = '';
        document.getElementById('f-status').value = 'active';
        document.getElementById('f-image').value = '';
        document.getElementById('f-image-preview').style.display = 'none';
        document.getElementById('modal-item').classList.add('is-open');
    }

    function openEdit(btn) {
        const i = JSON.parse(btn.getAttribute('data-edit'));
        document.getElementById('modal-title').textContent = 'Редактировать';
        document.getElementById('edit-id').value = i.id;
        document.getElementById('f-name').value = i.name;
        document.getElementById('f-desc').value = i.description || '';
        document.getElementById('f-status').value = i.status;
        const preview = document.getElementById('f-image-preview');
        if (i.image_url) { preview.src = i.image_url; preview.style.display = 'block'; }
        else { preview.style.display = 'none'; }
        document.getElementById('modal-item').classList.add('is-open');
    }

    document.getElementById('btn-save').addEventListener('click', async () => {
        const id = document.getElementById('edit-id').value;
        const data = { name: document.getElementById('f-name').value, description: document.getElementById('f-desc').value, status: document.getElementById('f-status').value };

        const imageFile = document.getElementById('f-image').files[0];
        if (imageFile) {
            const fd = new FormData();
            fd.append('file', imageFile);
            try {
                const token = localStorage.getItem('admin_token');
                const uploadRes = await fetch('/api/upload?type=complexes', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: fd });
                const uploadData = await uploadRes.json();
                if (uploadData.url) data.image_url = uploadData.url;
            } catch (_) {}
        }

        try {
            if (id) await window.api.put(`/api/complexes/${id}`, data);
            else await window.api.post('/api/complexes', data);
            document.querySelector('.modal-overlay.is-open')?.classList.remove('is-open');
            load();
        } catch(e) { alert('Ошибка: '+e.message); }
    });

    async function del(id) { if (!confirm('Удалить комплекс?')) return; try { await window.api.del(`/api/complexes/${id}`); load(); } catch(e) { alert('Ошибка: '+e.message); } }

    async function openPicker(complexId) {
        document.getElementById('picker-complex-id').value = complexId;
        document.getElementById('picker-search').value = '';
        document.getElementById('picker-direction').value = '';
        document.getElementById('picker-zone').value = '';

        try {
            const existing = await window.api.get('/api/complex-lessons');
            pickerLessons = existing.filter(cl => cl.complex_id === complexId).sort((a, b) => a.position - b.position).map(cl => cl.lesson_id);
        } catch (_) { pickerLessons = []; }

        pickerZones = {};
        for (const l of allLessons) {
            try {
                const zones = await window.api.get('/api/lesson-zones/' + l.id);
                pickerZones[l.id] = Array.isArray(zones) ? zones : [];
            } catch (_) { pickerZones[l.id] = []; }
        }

        renderPicker();
        document.getElementById('modal-picker').classList.add('is-open');
    }

    function renderPicker() {
        const search = document.getElementById('picker-search').value.toLowerCase();
        const dirFilter = document.getElementById('picker-direction').value;
        const zoneFilter = document.getElementById('picker-zone').value;

        const filtered = allLessons.filter(l => {
            if (l.status !== 'active') return false;
            if (search && !l.title.toLowerCase().includes(search)) return false;
            if (dirFilter && l.direction !== dirFilter) return false;
            if (zoneFilter && !pickerZones[l.id]?.includes(zoneFilter)) return false;
            return true;
        });

        document.getElementById('picker-count').textContent = `(${pickerLessons.length})`;

        const selected = pickerLessons.map(id => allLessons.find(l => l.id === id)).filter(Boolean);
        const available = filtered.filter(l => !pickerLessons.includes(l.id));

        document.getElementById('picker-available').innerHTML = available.length ? available.map(l => {
            const dirBadge = l.direction === 'суставная_разминка' ? 'info' : l.direction === 'занятие_в_потоке' ? 'warning' : 'secondary';
            const dirLabel = l.direction === 'суставная_разминка' ? 'Разм.' : l.direction === 'занятие_в_потоке' ? 'Поток' : '—';
            const zones = (pickerZones[l.id] || []).join(', ') || '—';
            return `<div style="display:flex;align-items:center;justify-content:space-between;padding:0.4rem 0.5rem;border-bottom:1px solid #f0f0f0;">
                <div style="flex:1;min-width:0;">
                    <div style="font-size:0.85rem;font-weight:500;">${esc(l.title)} <span class="badge badge--${dirBadge}" style="font-size:0.7rem;">${dirLabel}</span> <span style="color:#999;font-size:0.75rem;">${l.duration} мин</span></div>
                    <div style="font-size:0.75rem;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(zones)}</div>
                </div>
                <button class="btn btn--secondary btn--sm" onclick="addToPicker(${l.id})" style="margin-left:0.5rem;white-space:nowrap;">+ Добавить</button>
            </div>`;
        }).join('') : '<p style="color:#999;padding:0.5rem;font-size:0.85rem;">Нет занятий</p>';

        document.getElementById('picker-selected').innerHTML = selected.length ? selected.map((l, idx) => {
            const dirBadge = l.direction === 'суставная_разминка' ? 'info' : l.direction === 'занятие_в_потоке' ? 'warning' : 'secondary';
            const dirLabel = l.direction === 'суставная_разминка' ? 'Разм.' : l.direction === 'занятие_в_потоке' ? 'Поток' : '—';
            return `<div style="display:flex;align-items:center;justify-content:space-between;padding:0.4rem 0.5rem;border-bottom:1px solid #e0f0e0;" data-lesson-id="${l.id}">
                <div style="display:flex;align-items:center;gap:0.4rem;flex:1;min-width:0;">
                    <span style="color:#999;font-size:0.8rem;width:20px;text-align:right;">${idx + 1}</span>
                    <span style="font-size:0.85rem;font-weight:500;">${esc(l.title)}</span>
                    <span class="badge badge--${dirBadge}" style="font-size:0.7rem;">${dirLabel}</span>
                </div>
                <div style="display:flex;gap:0.2rem;">
                    ${idx > 0 ? `<button class="btn btn--secondary btn--sm" onclick="movePicker(${l.id},-1)" style="padding:0.1rem 0.3rem;font-size:0.75rem;">▲</button>` : ''}
                    ${idx < selected.length - 1 ? `<button class="btn btn--secondary btn--sm" onclick="movePicker(${l.id},1)" style="padding:0.1rem 0.3rem;font-size:0.75rem;">▼</button>` : ''}
                    <button class="btn btn--danger btn--sm" onclick="removeFromPicker(${l.id})" style="padding:0.1rem 0.3rem;font-size:0.75rem;">×</button>
                </div>
            </div>`;
        }).join('') : '<p style="color:#999;padding:0.5rem;font-size:0.85rem;">Добавьте занятия из списка слева</p>';
    }

    function addToPicker(lessonId) {
        if (!pickerLessons.includes(lessonId)) {
            pickerLessons.push(lessonId);
            renderPicker();
        }
    }

    function removeFromPicker(lessonId) {
        pickerLessons = pickerLessons.filter(id => id !== lessonId);
        renderPicker();
    }

    function movePicker(lessonId, dir) {
        const idx = pickerLessons.indexOf(lessonId);
        if (idx < 0) return;
        const newIdx = idx + dir;
        if (newIdx < 0 || newIdx >= pickerLessons.length) return;
        [pickerLessons[idx], pickerLessons[newIdx]] = [pickerLessons[newIdx], pickerLessons[idx]];
        renderPicker();
    }

    document.getElementById('picker-search').addEventListener('input', renderPicker);
    document.getElementById('picker-direction').addEventListener('change', renderPicker);
    document.getElementById('picker-zone').addEventListener('change', renderPicker);

    document.getElementById('btn-save-picker').addEventListener('click', async () => {
        const complexId = parseInt(document.getElementById('picker-complex-id').value);
        try {
            const existing = await window.api.get('/api/complex-lessons');
            const toRemove = existing.filter(cl => cl.complex_id === complexId && !pickerLessons.includes(cl.lesson_id));
            for (const cl of toRemove) {
                await window.api.del(`/api/complex-lessons/${cl.complex_id}_${cl.lesson_id}`);
            }
            for (let i = 0; i < pickerLessons.length; i++) {
                const existingEntry = existing.find(cl => cl.complex_id === complexId && cl.lesson_id === pickerLessons[i]);
                if (existingEntry) {
                    await window.api.put(`/api/complex-lessons/${complexId}_${pickerLessons[i]}`, { position: i + 1 });
                } else {
                    await window.api.post('/api/complex-lessons', { complex_id: complexId, lesson_id: pickerLessons[i], position: i + 1 });
                }
            }
            document.querySelector('.modal-overlay.is-open')?.classList.remove('is-open');
            load();
        } catch (e) { alert('Ошибка: ' + e.message); }
    });

    load();
    </script>
</body>
</html>
