<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Контент страниц — Админ-панель</title>
    <link rel="stylesheet" href="css/admin.css?v=<%= assetVersion %>">
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
</head>
<body>
    <noscript><div style="padding:2rem;text-align:center;font-family:sans-serif;background:#111;color:#eee;min-height:100vh;"><h1>Админ-панель требует JavaScript</h1><p>Включите JavaScript, чтобы пользоваться панелью.</p></div></noscript>
    <div class="admin-layout" id="app"></div>
    <div class="modal-overlay" id="modal-item" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal">
            <div class="modal__header"><h2 class="modal__title" id="modal-title">Редактировать страницу</h2><button class="modal__close" aria-label="Закрыть">&times;</button></div>
            <div class="modal__body">
                <input type="hidden" id="edit-id">
                <div class="form-group"><label for="f-slug">Слаг (URL)</label><input type="text" class="form-control" id="f-slug" readonly></div>
                <div class="form-group"><label for="f-title">Заголовок (H1)</label><input type="text" class="form-control" id="f-title"></div>
                <div class="form-group"><label for="f-meta-title">Meta title</label><input type="text" class="form-control" id="f-meta-title"></div>
                <div class="form-group"><label for="f-meta-description">Meta description</label><input type="text" class="form-control" id="f-meta-description"></div>
                <div class="form-group"><label for="f-content">Содержимое (HTML)</label><textarea class="form-control" id="f-content" rows="14"></textarea>
                    <div class="form-group--row"><input type="file" id="f-content-file" accept=".html,.txt,text/html,text/plain" style="display:none"><button type="button" class="btn btn--secondary btn--sm" id="btn-load-file">Загрузить из файла</button> <span id="f-file-name" class="form-hint"></span></div>
                </div>
                <p class="form-hint">Контент показывается на странице <code>/<span id="f-slug-preview">slug</span></code>. Если поле пустое — используется статичный текст страницы. Загруженный файл появится в поле и его можно отредактировать перед сохранением.</p>
            </div>
            <div class="modal__footer"><button class="btn btn--secondary" data-modal-close>Отмена</button><button class="btn btn--primary" id="btn-save">Сохранить</button></div>
        </div>
    </div>
    <script src="js/sidebar.js?v=<%= assetVersion %>"></script><script src="js/api.js?v=<%= assetVersion %>"></script><script src="js/admin.js?v=<%= assetVersion %>"></script>
    <script>
    async function load() {
        if (!localStorage.getItem('admin_token')) { window.location.href = 'login.html'; return; }
        try {
            const items = await window.api.get('/api/content');
            if (!items) return;
            document.getElementById('app').innerHTML = getSidebar('content.html') + `<div class="main-content">${getTopbar('Контент страниц')}<div class="page-content"><div class="card"><div class="card__header"><h2 class="card__title">Страницы сайта</h2></div>
            <div class="table-wrapper"><table><caption>Список редактируемых страниц</caption><thead><tr><th>ID</th><th>Слаг</th><th>Заголовок</th><th>Действия</th></tr></thead>
            <tbody>${items.map(i => `<tr><td>${esc(i.id)}</td><td>${esc(i.slug)}</td><td>${esc(i.title || '')}</td><td><button class="btn btn--secondary btn--sm" data-edit='${esc(JSON.stringify(i))}' onclick="openEdit(this)">Редактировать</button> <a class="btn btn--secondary btn--sm" href="../${esc(i.slug)}" target="_blank" rel="noopener">Открыть</a></td></tr>`).join('')}</tbody></table></div></div></div></div>`;
        } catch (err) {
            document.getElementById('app').innerHTML += `<p style="color:var(--admin-danger);padding:1rem;">Ошибка: ${esc(err.message)}</p>`;
        }
    }
    function openEdit(btn) {
        const i = JSON.parse(btn.getAttribute('data-edit'));
        document.getElementById('modal-title').textContent = 'Редактировать: ' + i.slug;
        document.getElementById('edit-id').value = i.id;
        document.getElementById('f-slug').value = i.slug;
        document.getElementById('f-slug-preview').textContent = i.slug;
        document.getElementById('f-title').value = i.title || '';
        document.getElementById('f-meta-title').value = i.meta_title || '';
        document.getElementById('f-meta-description').value = i.meta_description || '';
        document.getElementById('f-content').value = i.content || '';
        document.getElementById('modal-item').classList.add('is-open');
    }
    document.getElementById('btn-load-file').addEventListener('click', () => { document.getElementById('f-content-file').click(); });
    document.getElementById('f-content-file').addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            document.getElementById('f-content').value = reader.result;
            document.getElementById('f-file-name').textContent = file.name + ' — загружен';
        };
        reader.onerror = () => { alert('Не удалось прочитать файл'); };
        reader.readAsText(file, 'utf-8');
    });
    document.getElementById('btn-save').addEventListener('click', async () => {
        const id = document.getElementById('edit-id').value;
        const data = {
            title: document.getElementById('f-title').value,
            meta_title: document.getElementById('f-meta-title').value,
            meta_description: document.getElementById('f-meta-description').value,
            content: document.getElementById('f-content').value
        };
        try { await window.api.put(`/api/content/${id}`, data); document.querySelector('.modal-overlay.is-open')?.classList.remove('is-open'); load(); } catch(e) { alert('Ошибка: '+e.message); }
    });
    load();
    </script>
</body>
</html>
