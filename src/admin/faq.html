<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>FAQ — Админ-панель</title>
    <link rel="stylesheet" href="css/admin.css?v=<%= assetVersion %>">
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
</head>
<body>
    <noscript><div style="padding:2rem;text-align:center;font-family:sans-serif;background:#111;color:#eee;min-height:100vh;"><h1>Админ-панель требует JavaScript</h1><p>Включите JavaScript, чтобы пользоваться панелью.</p></div></noscript>
    <div class="admin-layout" id="app"></div>
    <div class="modal-overlay" id="modal-item" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal">
            <div class="modal__header"><h2 class="modal__title" id="modal-title">Новый вопрос</h2><button class="modal__close" aria-label="Закрыть">&times;</button></div>
            <div class="modal__body">
                <input type="hidden" id="edit-id">
                <div class="form-group"><label for="f-question">Вопрос</label><input type="text" class="form-control" id="f-question"></div>
                <div class="form-group"><label for="f-answer">Ответ</label><textarea class="form-control" id="f-answer"></textarea></div>
                <div class="form-group"><label for="f-order">Порядок</label><input type="number" class="form-control" id="f-order" value="0"></div>
            </div>
            <div class="modal__footer"><button class="btn btn--secondary" data-modal-close>Отмена</button><button class="btn btn--primary" id="btn-save">Сохранить</button></div>
        </div>
    </div>
    <script src="js/sidebar.js?v=<%= assetVersion %>"></script><script src="js/api.js?v=<%= assetVersion %>"></script><script src="js/admin.js?v=<%= assetVersion %>"></script>
    <script>
    async function load() {
        if (!localStorage.getItem('admin_token')) { window.location.href = 'login.html'; return; }
        try {
            const items = await window.api.get('/api/faq');
            if (!items) return;
            document.getElementById('app').innerHTML = getSidebar('faq.html') + `<div class="main-content">${getTopbar('FAQ')}<div class="page-content"><div class="card"><div class="card__header"><h2 class="card__title">Часто задаваемые вопросы</h2><button class="btn btn--primary" data-modal-open="modal-item" onclick="openCreate()">+ Новый</button></div>
            <div class="table-wrapper"><table><caption>Список вопросов</caption><thead><tr><th>ID</th><th>Вопрос</th><th>Ответ</th><th>Порядок</th><th>Действия</th></tr></thead>
            <tbody>${items.map(i => `<tr><td>${esc(i.id)}</td><td>${esc(i.question)}</td><td>${esc((i.answer||'').substring(0,50))}</td><td>${esc(i.sort_order)}</td><td><button class="btn btn--secondary btn--sm" data-edit='${esc(JSON.stringify(i))}' onclick="openEdit(this)">Редактировать</button> <button class="btn btn--danger btn--sm" onclick="del(${parseInt(i.id)})">Удалить</button></td></tr>`).join('')}</tbody></table></div></div></div></div>`;
        } catch (err) {
            document.getElementById('app').innerHTML += `<p style="color:var(--admin-danger);padding:1rem;">Ошибка: ${esc(err.message)}</p>`;
        }
    }
    function openCreate() { document.getElementById('modal-title').textContent='Новый вопрос'; document.getElementById('edit-id').value=''; document.getElementById('f-question').value=''; document.getElementById('f-answer').value=''; document.getElementById('f-order').value=0; document.getElementById('modal-item').classList.add('is-open'); }
    function openEdit(btn) { const i = JSON.parse(btn.getAttribute('data-edit')); document.getElementById('modal-title').textContent='Редактировать'; document.getElementById('edit-id').value=i.id; document.getElementById('f-question').value=i.question; document.getElementById('f-answer').value=i.answer; document.getElementById('f-order').value=i.sort_order; document.getElementById('modal-item').classList.add('is-open'); }
    document.getElementById('btn-save').addEventListener('click', async () => {
        const id = document.getElementById('edit-id').value;
        const data = { question: document.getElementById('f-question').value, answer: document.getElementById('f-answer').value, sort_order: parseInt(document.getElementById('f-order').value) };
        try { if (id) await window.api.put(`/api/faq/${id}`, data); else await window.api.post('/api/faq', data); document.querySelector('.modal-overlay.is-open')?.classList.remove('is-open'); load(); } catch(e) { alert('Ошибка: '+e.message); }
    });
    async function del(id) { if (!confirm('Удалить?')) return; try { await window.api.del(`/api/faq/${id}`); load(); } catch(e) { alert('Ошибка: '+e.message); } }
    load();
    </script>
</body>
</html>
