<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Обратная связь — Админ-панель</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
    <style>
        .ticket-list { max-height: 60vh; overflow-y: auto; }
        .ticket-item { padding: 0.75rem 1rem; border-bottom: 1px solid var(--admin-border); cursor: pointer; transition: background 0.15s; }
        .ticket-item:hover { background: var(--admin-bg-hover); }
        .ticket-item.active { background: var(--admin-primary-bg); border-left: 3px solid var(--admin-primary); }
        .ticket-item__header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem; }
        .ticket-item__subject { font-weight: 600; }
        .ticket-item__meta { font-size: 0.75rem; color: var(--admin-text-secondary); display: flex; gap: 0.75rem; }
        .ticket-item__preview { font-size: 0.8rem; color: var(--admin-text-secondary); margin-top: 0.25rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .category-badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.7rem; font-weight: 600; }
        .category-badge--trainer { background: #e8f5e9; color: #2e7d32; }
        .category-badge--technical { background: #e3f2fd; color: #1565c0; }
        .category-badge--admin { background: #fff3e0; color: #e65100; }
        .status-badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.7rem; font-weight: 600; }
        .status-badge--open { background: #fce4ec; color: #c62828; }
        .status-badge--in_progress { background: #fff8e1; color: #f57f17; }
        .status-badge--resolved { background: #e8f5e9; color: #2e7d32; }
        .chat-window { display: flex; flex-direction: column; height: 60vh; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 1rem; }
        .chat-input { display: flex; gap: 0.5rem; padding: 0.75rem; border-top: 1px solid var(--admin-border); }
        .chat-input textarea { flex: 1; resize: none; min-height: 60px; padding: 0.5rem; border: 1px solid var(--admin-border); border-radius: 4px; font-family: inherit; }
        .message { margin-bottom: 0.75rem; padding: 0.75rem; border-radius: 8px; max-width: 80%; }
        .message--subscriber { background: #e3f2fd; margin-right: auto; }
        .message--admin { background: #e8f5e9; margin-left: auto; }
        .message--trainer { background: #f3e5f5; margin-left: auto; }
        .message__sender { font-size: 0.75rem; font-weight: 600; margin-bottom: 0.25rem; }
        .message__text { white-space: pre-wrap; }
        .message__time { font-size: 0.65rem; color: var(--admin-text-secondary); margin-top: 0.25rem; }
        .empty-state { padding: 3rem; text-align: center; color: var(--admin-text-secondary); }
        .filters { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .two-col { display: grid; grid-template-columns: 350px 1fr; gap: 0; height: calc(100vh - 200px); min-height: 400px; }
        .ticket-detail { border-left: 1px solid var(--admin-border); display: flex; flex-direction: column; }
        .ticket-header { padding: 1rem; border-bottom: 1px solid var(--admin-border); }
        .ticket-header h3 { margin: 0 0 0.5rem; }
        .ticket-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
        @media (max-width: 768px) { .two-col { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="admin-layout" id="app"></div>
    <script src="js/sidebar.js"></script><script src="js/api.js"></script><script src="js/admin.js"></script>
    <script>
    const CATEGORY_LABELS = { trainer: 'Тренеру', technical: 'Техподдержка', admin: 'Администрация' };
    const STATUS_LABELS = { open: 'Открыт', in_progress: 'В работе', resolved: 'Решён' };
    let allTickets = [];
    let selectedTicket = null;

    async function load() {
        if (!localStorage.getItem('admin_token')) { window.location.href = 'login.html'; return; }
        try {
            allTickets = await window.api.get('/api/admin/feedback');
            if (!allTickets) allTickets = [];
            render();
        } catch (err) {
            document.getElementById('app').innerHTML = `<p style="color:var(--admin-danger);padding:1rem;">Ошибка: ${esc(err.message)}</p>`;
        }
    }

    function render() {
        const open = allTickets.filter(t => t.status === 'open').length;
        const inProgress = allTickets.filter(t => t.status === 'in_progress').length;
        const resolved = allTickets.filter(t => t.status === 'resolved').length;

        document.getElementById('app').innerHTML = getSidebar('feedback.html') + `<div class="main-content">${getTopbar('Обратная связь')}<div class="page-content">
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-card__label">Всего</div><div class="stat-card__value">${esc(allTickets.length)}</div></div>
                <div class="stat-card"><div class="stat-card__label">Открытых</div><div class="stat-card__value">${esc(open)}</div></div>
                <div class="stat-card"><div class="stat-card__label">В работе</div><div class="stat-card__value">${esc(inProgress)}</div></div>
                <div class="stat-card"><div class="stat-card__label">Решено</div><div class="stat-card__value">${esc(resolved)}</div></div>
            </div>
            <div class="card">
                <div class="card__header"><h2 class="card__title">Тикеты</h2></div>
                <div class="filters" style="padding:0 1rem;">
                    <select id="filter-cat" onchange="applyFilters()" style="padding:0.4rem;border:1px solid var(--admin-border);border-radius:4px;">
                        <option value="">Все категории</option>
                        <option value="trainer">Тренеру</option>
                        <option value="technical">Техподдержка</option>
                        <option value="admin">Администрация</option>
                    </select>
                    <select id="filter-status" onchange="applyFilters()" style="padding:0.4rem;border:1px solid var(--admin-border);border-radius:4px;">
                        <option value="">Все статусы</option>
                        <option value="open">Открыт</option>
                        <option value="in_progress">В работе</option>
                        <option value="resolved">Решён</option>
                    </select>
                </div>
                <div class="two-col">
                    <div class="ticket-list" id="ticket-list">
                        ${allTickets.length === 0 ? '<div class="empty-state">Нет тикетов</div>' : allTickets.map(t => `
                            <div class="ticket-item" data-id="${t.id}" onclick="selectTicket(${t.id})">
                                <div class="ticket-item__header">
                                    <span class="ticket-item__subject">${esc(t.subject)}</span>
                                    <span class="category-badge category-badge--${esc(t.category)}">${esc(CATEGORY_LABELS[t.category] || t.category)}</span>
                                </div>
                                <div class="ticket-item__meta">
                                    <span>${esc(t.subscriber_name || 'Неизвестно')}</span>
                                    <span class="status-badge status-badge--${esc(t.status)}">${esc(STATUS_LABELS[t.status] || t.status)}</span>
                                    <span>${formatDate(t.created_at)}</span>
                                </div>
                                <div class="ticket-item__preview">${esc((t.last_message || '').substring(0, 80))}</div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="ticket-detail" id="ticket-detail">
                        <div class="empty-state">Выберите тикет</div>
                    </div>
                </div>
            </div>
        </div></div>`;
    }

    function applyFilters() {
        const cat = document.getElementById('filter-cat').value;
        const status = document.getElementById('filter-status').value;
        document.querySelectorAll('.ticket-item').forEach(el => {
            const id = parseInt(el.dataset.id);
            const t = allTickets.find(x => x.id === id);
            let show = true;
            if (cat && t.category !== cat) show = false;
            if (status && t.status !== status) show = false;
            el.style.display = show ? '' : 'none';
        });
    }

    async function selectTicket(id) {
        document.querySelectorAll('.ticket-item').forEach(el => el.classList.toggle('active', parseInt(el.dataset.id) === id));
        try {
            selectedTicket = await window.api.get(`/api/admin/feedback/${id}`);
            if (!selectedTicket) return;
            const detail = document.getElementById('ticket-detail');
            detail.innerHTML = `
                <div class="ticket-header">
                    <h3>${esc(selectedTicket.subject)}</h3>
                    <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
                        <span class="category-badge category-badge--${esc(selectedTicket.category)}">${esc(CATEGORY_LABELS[selectedTicket.category] || selectedTicket.category)}</span>
                        <span class="status-badge status-badge--${esc(selectedTicket.status)}">${esc(STATUS_LABELS[selectedTicket.status] || selectedTicket.status)}</span>
                        <span style="font-size:0.8rem;color:var(--admin-text-secondary);">от ${esc(selectedTicket.subscriber_name || 'Неизвестно')} (${esc(selectedTicket.subscriber_email || '')})</span>
                    </div>
                    <div class="ticket-actions">
                        <select id="action-status" style="padding:0.3rem;border:1px solid var(--admin-border);border-radius:4px;">
                            <option value="open" ${selectedTicket.status === 'open' ? 'selected' : ''}>Открыт</option>
                            <option value="in_progress" ${selectedTicket.status === 'in_progress' ? 'selected' : ''}>В работе</option>
                            <option value="resolved" ${selectedTicket.status === 'resolved' ? 'selected' : ''}>Решён</option>
                        </select>
                        <button class="btn btn--primary btn--sm" onclick="updateStatus(${selectedTicket.id})">Обновить статус</button>
                    </div>
                </div>
                <div class="chat-messages" id="chat-messages">
                    ${(selectedTicket.messages || []).map(m => `
                        <div class="message message--${m.sender_type}">
                            <div class="message__sender">${m.sender_type === 'subscriber' ? esc(selectedTicket.subscriber_name || 'Подписчик') : m.sender_type === 'admin' ? 'Администратор' : 'Тренер'}</div>
                            <div class="message__text">${esc(m.message)}</div>
                            <div class="message__time">${formatDate(m.created_at)}</div>
                        </div>
                    `).join('')}
                </div>
                <div class="chat-input">
                    <textarea id="reply-text" placeholder="Введите ответ..."></textarea>
                    <button class="btn btn--primary" onclick="sendReply(${selectedTicket.id})">Отправить</button>
                </div>`;
            const chatBox = document.getElementById('chat-messages');
            chatBox.scrollTop = chatBox.scrollHeight;
        } catch (err) {
            alert('Ошибка: ' + err.message);
        }
    }

    async function updateStatus(id) {
        const status = document.getElementById('action-status').value;
        try {
            await window.api.put(`/api/admin/feedback/${id}`, { status });
            const t = allTickets.find(x => x.id === id);
            if (t) t.status = status;
            render();
            selectTicket(id);
        } catch (err) { alert('Ошибка: ' + err.message); }
    }

    async function sendReply(id) {
        const textarea = document.getElementById('reply-text');
        const message = textarea.value.trim();
        if (!message) return;
        try {
            await window.api.post(`/api/admin/feedback/${id}/reply`, { message });
            selectTicket(id);
        } catch (err) { alert('Ошибка: ' + err.message); }
    }

    load();
    </script>
</body>
</html>
