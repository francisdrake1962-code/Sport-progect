<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Финансы — Админ-панель</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
</head>
<body>
    <div class="admin-layout" id="app"></div>
    <script src="js/sidebar.js"></script><script src="js/api.js"></script><script src="js/admin.js"></script>
    <script>
    async function load() {
        if (!localStorage.getItem('admin_token')) { window.location.href = 'login.html'; return; }
        try {
            const [items, dashboard] = await Promise.all([
                window.api.get('/api/transactions'),
                window.api.get('/api/dashboard'),
            ]);
            if (!items) return;
            const subs = items.filter(t => t.type === 'subscription').length;
            document.getElementById('app').innerHTML = getSidebar('finance.html') + `<div class="main-content">${getTopbar('Финансы')}<div class="page-content">
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-card__label">Доход за месяц</div><div class="stat-card__value">$${esc(dashboard?.monthlyRevenue || 0)}</div></div>
                    <div class="stat-card"><div class="stat-card__label">Всего транзакций</div><div class="stat-card__value">${esc(items.length)}</div></div>
                    <div class="stat-card"><div class="stat-card__label">Подписок</div><div class="stat-card__value">${esc(subs)}</div></div>
                    <div class="stat-card"><div class="stat-card__label">Конверсия</div><div class="stat-card__value">${esc(dashboard?.conversionRate || 0)}%</div></div>
                </div>
                <div class="card"><div class="card__header"><h2 class="card__title">Транзакции</h2></div>
                <div class="table-wrapper"><table><caption>Транзакции</caption><thead><tr><th>ID</th><th>Подписчик</th><th>Сумма</th><th>Тип</th><th>Статус</th><th>Дата</th></tr></thead>
                <tbody>${items.map(i => `<tr><td>${esc(i.id)}</td><td>${esc(i.subscriber_id||'—')}</td><td>$${esc(i.amount)}</td><td>${i.type==='subscription'?'Подписка':i.type==='one-time'?'Разовая':i.type==='refund'?'Возврат':'Продление'}</td><td>${statusBadge(i.status)}</td><td>${formatDate(i.date)}</td></tr>`).join('')}</tbody></table></div></div>
            </div></div>`;
        } catch (err) {
            document.getElementById('app').innerHTML = `<p style="color:var(--admin-danger);padding:1rem;">Ошибка: ${esc(err.message)}</p>`;
        }
    }
    load();
    </script>
</body>
</html>
