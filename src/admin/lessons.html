<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, nofollow">
    <title>Уроки — Админ-панель</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
</head>
<body>
    <div class="admin-layout" id="app"></div>
    <div class="modal-overlay" id="modal-lesson" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal">
            <div class="modal__header">
                <h2 class="modal__title" id="modal-title">Новый урок</h2>
                <button class="modal__close" aria-label="Закрыть">&times;</button>
            </div>
            <div class="modal__body">
                <input type="hidden" id="edit-id">
                <div class="form-group"><label for="f-title">Название</label><input type="text" class="form-control" id="f-title"></div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                    <div class="form-group"><label for="f-duration">Длительность (мин)</label><input type="number" class="form-control" id="f-duration" value="27"></div>
                    <div class="form-group"><label for="f-status">Статус</label><select class="form-control" id="f-status"><option value="active">Активен</option><option value="draft">Черновик</option></select></div>
                </div>
                <div class="form-group">
                    <label>Направление</label>
                    <div style="display:flex;gap:1rem;margin-top:0.25rem;">
                        <label style="display:flex;align-items:center;gap:0.3rem;cursor:pointer;"><input type="radio" name="f-direction" value="суставная_разминка"> Суставная разминка</label>
                        <label style="display:flex;align-items:center;gap:0.3rem;cursor:pointer;"><input type="radio" name="f-direction" value="занятие_в_потоке"> Занятие в потоке</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Зоны тела</label>
                    <div id="f-zones" style="display:grid;grid-template-columns:repeat(4,1fr);gap:0.3rem;margin-top:0.25rem;font-size:0.85rem;">
                        <label style="display:flex;align-items:center;gap:0.3rem;cursor:pointer;"><input type="checkbox" value="шея"> Шея</label>
                        <label style="display:flex;align-items:center;gap:0.3rem;cursor:pointer;"><input type="checkbox" value="плечи_руки"> Плечи/руки</label>
                        <label style="display:flex;align-items:center;gap:0.3rem;cursor:pointer;"><input type="checkbox" value="грудной_отдел"> Грудной отдел</label>
                        <label style="display:flex;align-items:center;gap:0.3rem;cursor:pointer;"><input type="checkbox" value="поясница"> Поясница</label>
                        <label style="display:flex;align-items:center;gap:0.3rem;cursor:pointer;"><input type="checkbox" value="спина_осанка"> Спина/осанка</label>
                        <label style="display:flex;align-items:center;gap:0.3rem;cursor:pointer;"><input type="checkbox" value="колени"> Колени</label>
                        <label style="display:flex;align-items:center;gap:0.3rem;cursor:pointer;"><input type="checkbox" value="ноги_таз"> Ноги/таз</label>
                        <label style="display:flex;align-items:center;gap:0.3rem;cursor:pointer;"><input type="checkbox" value="баланс_общее"> Баланс</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="f-effect">Описание эффекта</label>
                    <div id="f-draft-badge" style="display:none;background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:0.3rem 0.6rem;margin-bottom:0.4rem;font-size:0.8rem;color:#856404;">Черновик — проверьте формулировку</div>
                    <textarea class="form-control" id="f-effect" rows="3" placeholder="Описание пользы/воздействия занятия"></textarea>
                    <input type="hidden" id="f-effect-is-draft">
                </div>
                <div class="form-group"><label for="f-description">Описание</label><textarea class="form-control" id="f-description"></textarea></div>
                <div class="form-group"><label for="f-video-url">URL видео</label><input type="text" class="form-control" id="f-video-url" placeholder="/videos/filename.mp4"></div>
                <div class="form-group"><label for="f-cf-uid">Cloudflare Stream UID</label><input type="text" class="form-control" id="f-cf-uid" placeholder="cf-video-uid (опционально)"></div>
                <div class="form-group">
                    <label>Картинка</label>
                    <div style="display:flex;align-items:center;gap:0.5rem;margin-top:0.25rem;">
                        <input type="file" id="f-image" accept=".jpg,.jpeg,.png,.webp" style="font-size:0.85rem;">
                        <img id="f-image-preview" src="" alt="" style="display:none;max-height:60px;border-radius:4px;">
                    </div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                    <div class="form-group"><label for="f-is-free">Бесплатный</label><select class="form-control" id="f-is-free"><option value="0">Нет</option><option value="1">Да (Module 0)</option></select></div>
                    <div class="form-group"><label for="f-free-order">Порядок бесплатного</label><input type="number" class="form-control" id="f-free-order" placeholder="1-7" min="1" max="7"></div>
                </div>
            </div>
            <div class="modal__footer">
                <button class="btn btn--secondary" data-modal-close>Отмена</button>
                <button class="btn btn--primary" id="btn-save">Сохранить</button>
            </div>
        </div>
    </div>
    <script src="js/sidebar.js"></script>
    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
    <script>
    async function loadLessons() {
        if (!localStorage.getItem('admin_token')) { window.location.href = 'login.html'; return; }
        document.getElementById('app').innerHTML = getSidebar('lessons.html') + `
            <div class="main-content">
                ${getTopbar('Уроки (справочник)')}
                <div class="page-content"><div class="card">
                    <div class="card__header"><h2 class="card__title">Все занятия</h2><button class="btn btn--primary" data-modal-open="modal-lesson" onclick="openCreate()">+ Новый урок</button></div>
                    <div class="table-wrapper"><table><caption>Справочник занятий</caption><thead><tr><th>ID</th><th>Название</th><th>Направление</th><th>Длительность</th><th>Зоны</th><th>Статус</th><th>Дата</th><th>Действия</th></tr></thead>
                    <tbody id="lessons-tbody"></tbody></table></div>
                </div></div>
            </div>`;

        try {
            const lessons = await window.api.get('/api/lessons');
            if (!lessons) return;

            const tbody = document.getElementById('lessons-tbody');
            tbody.innerHTML = lessons.map(l => {
                const dirLabel = l.direction === 'суставная_разминка' ? 'Разминка' : l.direction === 'занятие_в_потоке' ? 'Поток' : '—';
                const dirBadge = l.direction === 'суставная_разминка' ? 'info' : l.direction === 'занятие_в_потоке' ? 'warning' : 'secondary';
                return `<tr>
                    <td>${esc(l.id)}</td><td>${esc(l.title)}</td><td><span class="badge badge--${dirBadge}">${dirLabel}</span></td>
                    <td>${esc(l.duration)} мин</td><td>—</td><td>${statusBadge(l.status)}</td><td>${formatDate(l.date)}</td>
                    <td>
                        <button class="btn btn--secondary btn--sm" data-edit='${esc(JSON.stringify(l))}' onclick="openEdit(this)" aria-label="Редактировать ${esc(l.title)}">Редактировать</button>
                        <button class="btn btn--danger btn--sm" onclick="deleteLesson(${parseInt(l.id)})" aria-label="Удалить ${esc(l.title)}">Удалить</button>
                    </td>
                </tr>`;
            }).join('');
        } catch (err) {
            document.getElementById('app').innerHTML += `<p style="color:var(--admin-danger);padding:1rem;">Ошибка: ${esc(err.message)}</p>`;
        }
    }

    function openCreate() {
        document.getElementById('modal-title').textContent = 'Новый урок';
        document.getElementById('edit-id').value = '';
        document.getElementById('f-title').value = '';
        document.getElementById('f-duration').value = 27;
        document.getElementById('f-status').value = 'active';
        document.getElementById('f-description').value = '';
        document.getElementById('f-video-url').value = '';
        document.getElementById('f-cf-uid').value = '';
        document.getElementById('f-is-free').value = '0';
        document.getElementById('f-free-order').value = '';
        document.getElementById('f-effect').value = '';
        document.getElementById('f-effect-is-draft').value = '0';
        document.getElementById('f-draft-badge').style.display = 'none';
        document.getElementById('f-image').value = '';
        document.getElementById('f-image-preview').style.display = 'none';
        document.querySelectorAll('input[name="f-direction"]').forEach(r => r.checked = false);
        document.querySelectorAll('#f-zones input[type="checkbox"]').forEach(c => c.checked = false);
        document.getElementById('modal-lesson').classList.add('is-open');
    }

    async function openEdit(btn) {
        const lesson = JSON.parse(btn.getAttribute('data-edit'));
        document.getElementById('modal-title').textContent = 'Редактировать урок';
        document.getElementById('edit-id').value = lesson.id;
        document.getElementById('f-title').value = lesson.title;
        document.getElementById('f-duration').value = lesson.duration;
        document.getElementById('f-status').value = lesson.status;
        document.getElementById('f-description').value = lesson.description || '';
        document.getElementById('f-video-url').value = lesson.video_url || '';
        document.getElementById('f-cf-uid').value = lesson.cf_video_uid || '';
        document.getElementById('f-is-free').value = String(lesson.is_free || 0);
        document.getElementById('f-free-order').value = lesson.free_order || '';
        document.getElementById('f-effect').value = lesson.effect_description || '';
        document.getElementById('f-effect-is-draft').value = String(lesson.effect_is_draft || 0);
        document.getElementById('f-draft-badge').style.display = lesson.effect_is_draft ? 'block' : 'none';

        const preview = document.getElementById('f-image-preview');
        if (lesson.image_url) { preview.src = lesson.image_url; preview.style.display = 'block'; }
        else { preview.style.display = 'none'; }

        document.querySelectorAll('input[name="f-direction"]').forEach(r => {
            r.checked = r.value === lesson.direction;
        });

        document.querySelectorAll('#f-zones input[type="checkbox"]').forEach(c => c.checked = false);
        try {
            const zones = await window.api.get('/api/lesson-zones/' + lesson.id);
            if (zones && Array.isArray(zones)) {
                zones.forEach(z => {
                    const cb = document.querySelector(`#f-zones input[value="${z}"]`);
                    if (cb) cb.checked = true;
                });
            }
        } catch (_) {}

        document.getElementById('modal-lesson').classList.add('is-open');
    }

    document.getElementById('btn-save').addEventListener('click', async () => {
        const id = document.getElementById('edit-id').value;
        const directionEl = document.querySelector('input[name="f-direction"]:checked');
        const data = {
            title: document.getElementById('f-title').value,
            duration: parseInt(document.getElementById('f-duration').value),
            status: document.getElementById('f-status').value,
            description: document.getElementById('f-description').value,
            video_url: document.getElementById('f-video-url').value || null,
            cf_video_uid: document.getElementById('f-cf-uid').value || null,
            is_free: parseInt(document.getElementById('f-is-free').value) || 0,
            free_order: parseInt(document.getElementById('f-free-order').value) || null,
            direction: directionEl ? directionEl.value : null,
            direction_source: 'заголовок',
            effect_description: document.getElementById('f-effect').value || null,
            effect_is_draft: parseInt(document.getElementById('f-effect-is-draft').value) || 0,
        };
        const selectedZones = Array.from(document.querySelectorAll('#f-zones input[type="checkbox"]:checked')).map(c => c.value);

        const imageFile = document.getElementById('f-image').files[0];
        if (imageFile) {
            const fd = new FormData();
            fd.append('file', imageFile);
            try {
                const token = localStorage.getItem('admin_token');
                const uploadRes = await fetch('/api/upload?type=lessons', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: fd });
                const uploadData = await uploadRes.json();
                if (uploadData.url) data.image_url = uploadData.url;
            } catch (_) {}
        }

        if (!id) {
            const d = new Date();
            data.date = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }
        try {
            let savedId = id;
            if (id) {
                await window.api.put(`/api/lessons/${id}`, data);
            } else {
                const res = await window.api.post('/api/lessons', data);
                savedId = res && res.id ? res.id : null;
            }
            if (savedId) {
                await window.api.put(`/api/lessons/${savedId}/zones`, { zones: selectedZones });
            }
            document.querySelector('.modal-overlay.is-open')?.classList.remove('is-open');
            loadLessons();
        } catch (err) {
            alert('Ошибка сохранения: ' + err.message);
        }
    });

    async function deleteLesson(id) {
        if (!confirm('Удалить урок?')) return;
        try {
            await window.api.del(`/api/lessons/${id}`);
            loadLessons();
        } catch (err) {
            alert('Ошибка удаления: ' + err.message);
        }
    }

    loadLessons();
    </script>
</body>
</html>
