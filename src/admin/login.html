<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Админ-панель</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
</head>
<body class="login-page">
    <div class="login-card">
        <h1>Админ-панель</h1>
        <p>Цигун и суставная разминка</p>
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-control" placeholder="admin@qigong.com" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
            <div id="error" style="color:var(--admin-danger);margin-bottom:1rem;display:none;"></div>
            <button type="submit" class="btn btn--primary" style="width:100%;justify-content:center;">Войти</button>
        </form>
    </div>
    <script src="js/api.js"></script>
    <script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorEl = document.getElementById('error');
        errorEl.style.display = 'none';
        try {
            await window.api.login(email, password);
            window.location.href = 'index.html';
        } catch (err) {
            errorEl.textContent = err.message || 'Ошибка входа. Попробуйте снова.';
            errorEl.style.display = 'block';
        }
    });
    if (localStorage.getItem('admin_token')) {
        window.location.href = 'index.html';
    }
    </script>
</body>
</html>
