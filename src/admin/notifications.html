<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Уведомления — Админ-панель</title>
    <link rel="stylesheet" href="css/admin.css?v=<%= assetVersion %>">
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
</head>
<body>
    <noscript><div style="padding:2rem;text-align:center;font-family:sans-serif;background:#111;color:#eee;min-height:100vh;"><h1>Админ-панель требует JavaScript</h1><p>Включите JavaScript, чтобы пользоваться панелью.</p></div></noscript>
    <div class="admin-layout" id="app"></div>
    <div class="modal-overlay" id="modal-item" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal">
            <div class="modal__header"><h2 class="modal__title" id="modal-title">Новое уведомление</h2><button class="modal__close" aria-label="Закрыть">&times;</button></div>
            <div class="modal__body">
                <div class="form-group"><label for="f-title">Заголовок</label><input type="text" class="form-control" id="f-title"></div>
                <div class="form-group"><label for="f-text">Текст</label><textarea class="form-control" id="f-text"></textarea></div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                    <div class="form-group"><label for="f-type">Тип</label><select class="form-control" id="f-type"><option>info</option><option>warning</option><option>promo</option><option>system</option></select></div>
                    <div class="form-group"><label for="f-recipients">Целевая группа</label><select class="form-control" id="f-recipients"><option>all</option><option>active</option><option>trial</option><option>expired</option></select></div>
                </div>
            </div>
            <div class="modal__footer"><button class="btn btn--secondary" data-modal-close>Отмена</button><button class="btn btn--primary" id="btn-save">Отправить</button></div>
        </div>
    </div>
    <script src="js/sidebar.js?v=<%= assetVersion %>"></script><script src="js/api.js?v=<%= assetVersion %>"></script><script src="js/admin.js?v=<%= assetVersion %>"></script>
    <script>
    async function load() {
        if (!localStorage.getItem('admin_token')) { window.location.href = 'login.html'; return; }
        try {
            const items = await window.api.get('/api/notifications');
            if (!items) return;
            document.getElementById('app').innerHTML = getSidebar('notifications.html') + `<div class="main-content">${getTopbar('Уведомления')}<div class="page-content"><div class="card"><div class="card__header"><h2 class="card__title">Уведомления</h2><button class="btn btn--primary" data-modal-open="modal-item">+ Новое</button></div>
            <div class="table-wrapper"><table><caption>Список уведомлений</caption><thead><tr><th>ID</th><th>Заголовок</th><th>Текст</th><th>Тип</th><th>Группа</th><th>Дата</th><th>Действия</th></tr></thead>
            <tbody>${items.map(i => {
                const typeBadge = i.type === 'info' ? 'primary' : i.type === 'warning' ? 'warning' : 'success';
                return `<tr><td>${esc(i.id)}</td><td>${esc(i.title)}</td><td>${esc((i.text||'').substring(0,40))}</td><td><span class="badge badge--${typeBadge}">${esc(i.type)}</span></td><td>${esc(i.recipients)}</td><td>${formatDate(i.sent_at)}</td><td><button class="btn btn--danger btn--sm" onclick="del(${parseInt(i.id)})">Удалить</button></td></tr>`;
            }).join('')}</tbody></table></div></div></div></div>`;
        } catch (err) {
            document.getElementById('app').innerHTML += `<p style="color:var(--admin-danger);padding:1rem;">Ошибка: ${esc(err.message)}</p>`;
        }
    }
    document.getElementById('btn-save').addEventListener('click', async () => {
        const data = { title: document.getElementById('f-title').value, text: document.getElementById('f-text').value, type: document.getElementById('f-type').value, recipients: document.getElementById('f-recipients').value, sent_at: new Date().toISOString() };
        try { await window.api.post('/api/notifications', data); document.querySelector('.modal-overlay.is-open')?.classList.remove('is-open'); load(); } catch(e) { alert('Ошибка: '+e.message); }
    });
    async function del(id) { if (!confirm('Удалить?')) return; try { await window.api.del(`/api/notifications/${id}`); load(); } catch(e) { alert('Ошибка: '+e.message); } }
    load();
    </script>
</body>
</html>
