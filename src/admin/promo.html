<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Промокоды — Админ-панель</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
</head>
<body>
    <div class="admin-layout" id="app"></div>
    <div class="modal-overlay" id="modal-item" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal">
            <div class="modal__header"><h2 class="modal__title" id="modal-title">Новый промокод</h2><button class="modal__close" aria-label="Закрыть">&times;</button></div>
            <div class="modal__body">
                <input type="hidden" id="edit-id">
                <div class="form-group"><label for="f-code">Код</label><input type="text" class="form-control" id="f-code" placeholder="СКИДКА20"></div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                    <div class="form-group"><label for="f-discount">Скидка</label><input type="text" class="form-control" id="f-discount" placeholder="20%"></div>
                    <div class="form-group"><label for="f-max">Макс. использований</label><input type="number" class="form-control" id="f-max" value="100"></div>
                </div>
                <div class="form-group"><label for="f-active">Активен</label><select class="form-control" id="f-active"><option value="1">Да</option><option value="0">Нет</option></select></div>
            </div>
            <div class="modal__footer"><button class="btn btn--secondary" data-modal-close>Отмена</button><button class="btn btn--primary" id="btn-save">Сохранить</button></div>
        </div>
    </div>
    <script src="js/sidebar.js"></script><script src="js/api.js"></script><script src="js/admin.js"></script>
    <script>
    async function load() {
        if (!localStorage.getItem('admin_token')) { window.location.href = 'login.html'; return; }
        try {
            const items = await window.api.get('/api/promo-codes');
            if (!items) return;
            document.getElementById('app').innerHTML = getSidebar('promo.html') + `<div class="main-content">${getTopbar('Промокоды')}<div class="page-content"><div class="card"><div class="card__header"><h2 class="card__title">Промокоды</h2><button class="btn btn--primary" data-modal-open="modal-item" onclick="openCreate()">+ Новый</button></div>
            <div class="table-wrapper"><table><caption>Список промокодов</caption><thead><tr><th>ID</th><th>Код</th><th>Скидка</th><th>Использований</th><th>Активен</th><th>Действия</th></tr></thead>
            <tbody>${items.map(i => `<tr><td>${esc(i.id)}</td><td><code>${esc(i.code)}</code></td><td>${esc(i.discount)}</td><td>${esc(i.current_uses)} / ${esc(i.max_uses)}</td><td>${i.active ? '<span class="badge badge--success">Да</span>' : '<span class="badge badge--danger">Нет</span>'}</td><td><button class="btn btn--secondary btn--sm" data-edit='${esc(JSON.stringify(i))}' onclick="openEdit(this)">Редактировать</button> <button class="btn btn--danger btn--sm" onclick="del(${parseInt(i.id)})">Удалить</button></td></tr>`).join('')}</tbody></table></div></div></div></div>`;
        } catch (err) {
            document.getElementById('app').innerHTML += `<p style="color:var(--admin-danger);padding:1rem;">Ошибка: ${esc(err.message)}</p>`;
        }
    }
    function openCreate() { document.getElementById('modal-title').textContent='Новый промокод'; document.getElementById('edit-id').value=''; document.getElementById('f-code').value=''; document.getElementById('f-discount').value='20%'; document.getElementById('f-max').value=100; document.getElementById('f-active').value='1'; document.getElementById('modal-item').classList.add('is-open'); }
    function openEdit(btn) { const i = JSON.parse(btn.getAttribute('data-edit')); document.getElementById('modal-title').textContent='Редактировать'; document.getElementById('edit-id').value=i.id; document.getElementById('f-code').value=i.code; document.getElementById('f-discount').value=i.discount; document.getElementById('f-max').value=i.max_uses; document.getElementById('f-active').value=i.active?'1':'0'; document.getElementById('modal-item').classList.add('is-open'); }
    document.getElementById('btn-save').addEventListener('click', async () => {
        const id = document.getElementById('edit-id').value;
        const data = { code: document.getElementById('f-code').value, discount: document.getElementById('f-discount').value, max_uses: parseInt(document.getElementById('f-max').value), active: parseInt(document.getElementById('f-active').value) };
        try { if (id) await window.api.put(`/api/promo-codes/${id}`, data); else await window.api.post('/api/promo-codes', data); document.querySelector('.modal-overlay.is-open')?.classList.remove('is-open'); load(); } catch(e) { alert('Ошибка: '+e.message); }
    });
    async function del(id) { if (!confirm('Удалить?')) return; try { await window.api.del(`/api/promo-codes/${id}`); load(); } catch(e) { alert('Ошибка: '+e.message); } }
    load();
    </script>
</body>
</html>
