<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Отзывы — Админ-панель</title>
    <link rel="stylesheet" href="css/admin.css?v=<%= assetVersion %>">
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
</head>
<body>
    <noscript><div style="padding:2rem;text-align:center;font-family:sans-serif;background:#111;color:#eee;min-height:100vh;"><h1>Админ-панель требует JavaScript</h1><p>Включите JavaScript, чтобы пользоваться панелью.</p></div></noscript>
    <div class="admin-layout" id="app"></div>
    <script src="js/sidebar.js?v=<%= assetVersion %>"></script><script src="js/api.js?v=<%= assetVersion %>"></script><script src="js/admin.js?v=<%= assetVersion %>"></script>
    <script>
    async function load() {
        if (!localStorage.getItem('admin_token')) { window.location.href = 'login.html'; return; }
        try {
            const items = await window.api.get('/api/reviews');
            if (!items) return;
            const approved = items.filter(i => i.status === 'approved').length;
            const pending = items.filter(i => i.status === 'pending').length;
            document.getElementById('app').innerHTML = getSidebar('reviews.html') + `<div class="main-content">${getTopbar('Отзывы')}<div class="page-content">
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-card__label">Всего</div><div class="stat-card__value">${esc(items.length)}</div></div>
                    <div class="stat-card"><div class="stat-card__label">Одобрено</div><div class="stat-card__value">${esc(approved)}</div></div>
                    <div class="stat-card"><div class="stat-card__label">Ожидает</div><div class="stat-card__value">${esc(pending)}</div></div>
                </div>
                <div class="card"><div class="card__header"><h2 class="card__title">Отзывы</h2></div>
                <div class="table-wrapper"><table><caption>Список отзывов</caption><thead><tr><th>ID</th><th>Автор</th><th>Текст</th><th>Рейтинг</th><th>Статус</th><th>Дата</th><th>Действия</th></tr></thead>
                <tbody>${items.map(i => {
                    const stars = '★'.repeat(i.rating);
                    const actions = i.status === 'pending'
                        ? `<button class="btn btn--primary btn--sm" onclick="approve(${parseInt(i.id)})">Одобрить</button> <button class="btn btn--danger btn--sm" onclick="del(${parseInt(i.id)})">Удалить</button>`
                        : `<button class="btn btn--danger btn--sm" onclick="del(${parseInt(i.id)})">Удалить</button>`;
                    return `<tr><td>${esc(i.id)}</td><td>${esc(i.author)}</td><td>${esc((i.text||'').substring(0,40))}</td><td>${stars}</td><td>${statusBadge(i.status)}</td><td>${formatDate(i.date)}</td><td>${actions}</td></tr>`;
                }).join('')}</tbody></table></div></div>
            </div></div>`;
        } catch (err) {
            document.getElementById('app').innerHTML = `<p style="color:var(--admin-danger);padding:1rem;">Ошибка: ${esc(err.message)}</p>`;
        }
    }
    async function approve(id) { try { await window.api.put(`/api/reviews/${id}`, { status: 'approved' }); load(); } catch(e) { alert('Ошибка: '+e.message); } }
    async function del(id) { if (!confirm('Удалить?')) return; try { await window.api.del(`/api/reviews/${id}`); load(); } catch(e) { alert('Ошибка: '+e.message); } }
    load();
    </script>
</body>
</html>
