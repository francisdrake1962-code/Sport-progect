<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Расписание — Админ-панель</title>
    <link rel="stylesheet" href="css/admin.css?v=<%= assetVersion %>">
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
</head>
<body>
    <noscript><div style="padding:2rem;text-align:center;font-family:sans-serif;background:#111;color:#eee;min-height:100vh;"><h1>Админ-панель требует JavaScript</h1><p>Включите JavaScript, чтобы пользоваться панелью.</p></div></noscript>
    <div class="admin-layout" id="app"></div>
    <div class="modal-overlay" id="modal-item" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal">
            <div class="modal__header"><h2 class="modal__title" id="modal-title">Новое расписание</h2><button class="modal__close" aria-label="Закрыть">&times;</button></div>
            <div class="modal__body">
                <input type="hidden" id="edit-id">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                    <div class="form-group"><label for="f-date">Дата</label><input type="date" class="form-control" id="f-date"></div>
                    <div class="form-group"><label for="f-day-display">День недели</label><input type="text" class="form-control" id="f-day-display" readonly placeholder="автоматически"></div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                    <div class="form-group"><label for="f-theme">Тема</label><input type="text" class="form-control" id="f-theme" placeholder="Шея и плечи"></div>
                    <div class="form-group"><label for="f-complex">Комплекс</label><select class="form-control" id="f-complex"><option value="">— Не выбран —</option></select></div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                    <div class="form-group"><label for="f-lesson">Урок</label><select class="form-control" id="f-lesson"><option value="">— Не выбран —</option></select></div>
                    <div></div>
                </div>
            </div>
            <div class="modal__footer"><button class="btn btn--secondary" data-modal-close>Отмена</button><button class="btn btn--primary" id="btn-save">Сохранить</button></div>
        </div>
    </div>
    <script src="js/sidebar.js?v=<%= assetVersion %>"></script><script src="js/api.js?v=<%= assetVersion %>"></script><script src="js/admin.js?v=<%= assetVersion %>"></script>
    <script>
    let allLessons = [], allComplexes = [];

    function intensityBadge(v) {
        if (!v) return '<span style="color:var(--admin-text-muted);">—</span>';
        const map = { low: ['success', 'Щадящая'], medium: ['warning', 'Средняя'], high: ['danger', 'Интенсивная'] };
        const m = map[v] || ['secondary', v];
        return '<span class="badge badge--' + m[0] + '">' + m[1] + '</span>';
    }

    async function load() {
        if (!localStorage.getItem('admin_token')) { window.location.href = 'login.html'; return; }
        document.getElementById('app').innerHTML = getSidebar('schedule.html') + `<div class="main-content">${getTopbar('Расписание')}<div class="page-content"><div class="card"><div class="card__header"><h2 class="card__title">Расписание занятий</h2><button class="btn btn--primary" data-modal-open="modal-item" onclick="openCreate()">+ Новое</button></div><div class="table-wrapper"><table><caption>Расписание занятий</caption><thead><tr><th>Дата</th><th>Тема</th><th>Комплекс</th><th>Урок</th><th>Нагрузка</th><th>Действия</th></tr></thead><tbody id="tbody"></tbody></table></div></div></div></div>`;
        try {
            const [items, lessons, complexes] = await Promise.all([
                window.api.get('/api/schedule'),
                window.api.get('/api/lessons'),
                window.api.get('/api/complexes'),
            ]);
            if (!items) return;
            allLessons = lessons || [];
            allComplexes = complexes || [];
            const lessonMap = {}, complexMap = {}, intensityMap = {};
            allLessons.forEach(l => { lessonMap[l.id] = l.title; intensityMap[l.id] = l.intensity; });
            allComplexes.forEach(c => { complexMap[c.id] = c.name; });

            const tbody = document.getElementById('tbody');
            const DAYS_RU = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
            tbody.innerHTML = items.map(i => {
                let dateDisplay = esc(i.date||'—');
                if (i.date) {
                    const d = new Date(i.date + 'T00:00:00');
                    if (!isNaN(d.getTime())) dateDisplay = `${DAYS_RU[d.getDay()]}, ${esc(i.date)}`;
                }
                return `<tr>
                    <td>${dateDisplay}</td><td>${esc(i.theme||'—')}</td><td>${esc(complexMap[i.complex_id]||'—')}</td><td>${esc(lessonMap[i.lesson_id]||'—')}</td><td>${intensityBadge(intensityMap[i.lesson_id])}</td>
                    <td><button class="btn btn--secondary btn--sm" data-edit='${esc(JSON.stringify(i))}' onclick="openEdit(this)">Редактировать</button> <button class="btn btn--danger btn--sm" onclick="del(${parseInt(i.id)})">Удалить</button></td>
                </tr>`;
            }).join('');

            const complexSelect = document.getElementById('f-complex');
            complexSelect.innerHTML = '<option value="">— Не выбран —</option>' + allComplexes.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
            const lessonSelect = document.getElementById('f-lesson');
            lessonSelect.innerHTML = '<option value="">— Не выбран —</option>' + allLessons.map(l => {
                const intLabel = { low: '· Щадящая', medium: '· Средняя', high: '· Интенсивная' }[l.intensity];
                return `<option value="${esc(l.id)}">${esc(l.title)}${intLabel ? ' ' + intLabel : ''}</option>`;
            }).join('');
        } catch (err) {
            document.getElementById('app').innerHTML += `<p style="color:var(--admin-danger);padding:1rem;">Ошибка: ${esc(err.message)}</p>`;
        }
    }

    const DAYS_RU = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
    function updateDayDisplay() {
        const dateVal = document.getElementById('f-date').value;
        const display = document.getElementById('f-day-display');
        if (!dateVal) { display.value = ''; return; }
        const d = new Date(dateVal + 'T00:00:00');
        if (!isNaN(d.getTime())) display.value = DAYS_RU[d.getDay()];
    }
    document.getElementById('f-date').addEventListener('change', updateDayDisplay);

    function openCreate() { document.getElementById('modal-title').textContent='Новое расписание'; document.getElementById('edit-id').value=''; document.getElementById('f-date').value=''; document.getElementById('f-day-display').value=''; document.getElementById('f-theme').value=''; document.getElementById('f-complex').value=''; document.getElementById('f-lesson').value=''; document.getElementById('modal-item').classList.add('is-open'); }
    function openEdit(btn) { const i = JSON.parse(btn.getAttribute('data-edit')); document.getElementById('modal-title').textContent='Редактировать'; document.getElementById('edit-id').value=i.id; document.getElementById('f-date').value=i.date||''; updateDayDisplay(); document.getElementById('f-theme').value=i.theme||''; document.getElementById('f-complex').value=i.complex_id||''; document.getElementById('f-lesson').value=i.lesson_id||''; document.getElementById('modal-item').classList.add('is-open'); }

    document.getElementById('btn-save').addEventListener('click', async () => {
        const id = document.getElementById('edit-id').value;
        const data = {
            date: document.getElementById('f-date').value,
            theme: document.getElementById('f-theme').value,
            complex_id: document.getElementById('f-complex').value ? parseInt(document.getElementById('f-complex').value) : null,
            lesson_id: document.getElementById('f-lesson').value ? parseInt(document.getElementById('f-lesson').value) : null,
        };
        try {
            if (id) await window.api.put(`/api/schedule/${id}`, data);
            else await window.api.post('/api/schedule', data);
            document.querySelector('.modal-overlay.is-open')?.classList.remove('is-open'); load();
        } catch(e) { alert('Ошибка: '+e.message); }
    });

    async function del(id) { if (!confirm('Удалить?')) return; try { await window.api.del(`/api/schedule/${id}`); load(); } catch(e) { alert('Ошибка: '+e.message); } }
    load();
    </script>
</body>
</html>
