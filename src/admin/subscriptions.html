<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Подписки — Админ-панель</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
</head>
<body>
    <div class="admin-layout" id="app"></div>
    <script src="js/sidebar.js"></script><script src="js/api.js"></script><script src="js/admin.js"></script>
    <script>
    async function load() {
        if (!localStorage.getItem('admin_token')) { window.location.href = 'login.html'; return; }
        try {
            const [subscribers, transactions, settings] = await Promise.all([
                window.api.get('/api/subscribers'),
                window.api.get('/api/transactions'),
                window.api.get('/api/settings'),
            ]);
            if (!subscribers) return;
            const active = subscribers.filter(s => s.status === 'active').length;
            const trial = subscribers.filter(s => s.status === 'trial').length;
            const totalRevenue = (transactions || []).reduce((sum, t) => sum + (t.amount || 0), 0);
            const subPrice = settings?.subscription_price || '9.99';

            document.getElementById('app').innerHTML = getSidebar('subscriptions.html') + `<div class="main-content">${getTopbar('Подписки')}<div class="page-content">
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-card__label">Всего подписчиков</div><div class="stat-card__value">${esc(subscribers.length)}</div></div>
                    <div class="stat-card"><div class="stat-card__label">Активных</div><div class="stat-card__value">${esc(active)}</div></div>
                    <div class="stat-card"><div class="stat-card__label">На пробном</div><div class="stat-card__value">${esc(trial)}</div></div>
                    <div class="stat-card"><div class="stat-card__label">Общий доход</div><div class="stat-card__value">$${esc(totalRevenue)}</div></div>
                </div>
                <div class="card"><div class="card__header"><h2 class="card__title">Подписки</h2></div>
                <div class="table-wrapper"><table><caption>Список подписок</caption><thead><tr><th>ID</th><th>Имя</th><th>Email</th><th>План</th><th>Статус</th><th>Дата</th></tr></thead>
                <tbody>${subscribers.map(s => `<tr><td>${esc(s.id)}</td><td>${esc(s.name)}</td><td>${esc(s.email)}</td><td>${esc(s.plan)}</td><td>${statusBadge(s.status)}</td><td>${formatDate(s.joined_at)}</td></tr>`).join('')}</tbody></table></div></div>
            </div></div>`;
        } catch (err) {
            document.getElementById('app').innerHTML = `<p style="color:var(--admin-danger);padding:1rem;">Ошибка: ${esc(err.message)}</p>`;
        }
    }
    load();
    </script>
</body>
</html>
