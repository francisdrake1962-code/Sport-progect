<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <title>Календарь — Цигун и суставная разминка</title>
    <link rel="stylesheet" href="styles/main.css">
    <style>
        .cal-page{min-height:100vh;background:#0a0f0c;color:#e0e0e0}
        .cal-header{background:#111a14;padding:.75rem 1.5rem;display:flex;align-items:center;gap:1rem;border-bottom:1px solid #2a3a2e;position:sticky;top:0;z-index:10}
        .cal-header__back{color:#9fc5a8;text-decoration:none;font-size:.95rem}
        .cal-header__back:hover{color:#fff}
        .cal-header__title{color:#fff;font-size:1.1rem;font-weight:600}
        .cal-stats{max-width:960px;margin:1rem auto;padding:0 1rem;display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem}
        .cal-stat{background:#111a14;border:1px solid #1e2e22;border-radius:8px;padding:.75rem;text-align:center}
        .cal-stat__value{color:#7acc8a;font-size:1.3rem;font-weight:700}
        .cal-stat__label{color:#5a7a60;font-size:.75rem;margin-top:.2rem}
        .cal-progress{max-width:960px;margin:0 auto 1rem;padding:0 1rem}
        .cal-progress__bar{background:#1a2a1e;border-radius:8px;height:8px;overflow:hidden}
        .cal-progress__fill{height:100%;background:linear-gradient(90deg,#1a5e2a,#2ecc71);border-radius:8px;transition:width .3s}
        .cal-progress__text{color:#7a9a80;font-size:.8rem;margin-top:.3rem;text-align:center}
        .cal-tabs{max-width:960px;margin:0 auto;padding:0 1rem;display:flex;gap:0;background:#111a14;border-radius:8px;overflow:hidden;margin-bottom:1rem}
        .cal-tab{flex:1;padding:.6rem;text-align:center;cursor:pointer;color:#7a9a80;font-size:.85rem;font-weight:500;border:none;background:none;transition:all .15s}
        .cal-tab.active{background:#1a5e2a;color:#fff}
        .cal-nav{max-width:960px;margin:0 auto;padding:0 1rem;display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem}
        .cal-nav__title{color:#fff;font-size:1rem;font-weight:600}
        .cal-nav__btn{background:#1a2a1e;color:#9fc5a8;border:none;padding:.4rem .8rem;border-radius:6px;cursor:pointer;font-size:.85rem}
        .cal-nav__btn:hover{background:#2a3a2e;color:#fff}
        .cal-grid{max-width:960px;margin:0 auto;padding:0 1rem 3rem}
        .cal-grid--year{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
        .cal-grid--month{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
        .cal-grid--week{display:grid;grid-template-columns:repeat(7,1fr);gap:.5rem}
        .cal-month{background:#111a14;border:1px solid #1e2e22;border-radius:8px;overflow:hidden}
        .cal-month__title{background:#1a2a1e;color:#7acc8a;font-size:.75rem;font-weight:600;padding:.4rem;text-align:center}
        .cal-month__days{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;padding:2px}
        .cal-day-header{color:#5a7a60;font-size:.6rem;text-align:center;padding:.2rem 0}
        .cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:.65rem;cursor:pointer;transition:all .1s;position:relative}
        .cal-day:hover{background:#2a3a2e}
        .cal-day--empty{cursor:default}
        .cal-day--today{background:#1a5e2a;color:#fff;font-weight:700}
        .cal-day--completed{background:#0d3a15;color:#7acc8a}
        .cal-day--rest{color:#3a4a3e}
        .cal-day--future{color:#5a7a60}
        .cal-day--has-lesson::after{content:'';position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:#1a5e2a}
        .cal-day--completed::after{background:#2ecc71}
        .cal-week-card{background:#111a14;border:1px solid #1e2e22;border-radius:10px;padding:1rem;cursor:pointer;transition:all .15s}
        .cal-week-card:hover{border-color:#2a5a30;transform:translateY(-1px)}
        .cal-week-card.today{border-color:#1a5e2a;background:#0d1a10}
        .cal-week-card__day{color:#5a7a60;font-size:.75rem;margin-bottom:.2rem}
        .cal-week-card__theme{color:#fff;font-size:.95rem;font-weight:600;margin-bottom:.2rem}
        .cal-week-card__meta{color:#7a9a80;font-size:.8rem;display:flex;gap:.5rem;align-items:center}
        .cal-week-card__status{margin-left:auto}
        .cal-empty{text-align:center;padding:3rem 1rem;color:#5a7a60}
        .cal-empty__icon{font-size:2rem;margin-bottom:.5rem}
        @media(max-width:768px){.cal-stats{grid-template-columns:repeat(2,1fr)}.cal-grid--year{grid-template-columns:repeat(3,1fr)}}
        @media(max-width:480px){.cal-stats{grid-template-columns:1fr 1fr}.cal-grid--year{grid-template-columns:repeat(2,1fr)}}
    </style>
</head>
<body>
    <noscript><div style="padding:2rem;text-align:center;color:#e0e0e0;background:#0a0f0c;min-height:100vh;font-family:sans-serif;"><h1>Цигун</h1><p>Для работы календаря необходим JavaScript.</p><a href="/" style="color:#7acc8a;">На главную</a></div></noscript>
<div class="cal-page" id="cal-root"></div>
<script>
(function(){
const root=document.getElementById('cal-root');
function esc(s){if(s==null)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function localDateStr(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day;}
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_SHORT=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const DAYS_SHORT=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

let currentView='month';
let viewDate=new Date();
let calendarData=null;

async function api(path){
const token=localStorage.getItem('user_token');
if(!token){
  root.innerHTML='<div class="cal-empty"><div class="cal-empty__icon">🔒</div><div class="cal-empty__title" style="color:#fff;margin-bottom:0.5rem;">Войдите, чтобы видеть календарь</div><p style="color:#7a9a80;margin-bottom:1rem;">Бесплатно — 7 занятий без карты</p><a href="login.html" style="display:inline-block;padding:0.7rem 1.5rem;background:#1a5e2a;color:#fff;border-radius:8px;text-decoration:none;font-weight:600;">Войти</a></div>';
  return null;
}
const res=await fetch(path,{headers:{'Authorization':'Bearer '+token}});
if(res.status===401){localStorage.removeItem('user_token');localStorage.removeItem('user_data');window.location.href='login.html';return null;}
if(!res.ok)throw new Error('API error');
return res.json();
}

async function load(){
try{
calendarData=await api('/api/user/calendar');
if(!calendarData)return;
render();
}catch(err){
root.innerHTML='<div class="cal-empty"><div class="cal-empty__icon">⚠️</div><p>'+esc(err.message)+'</p><a href="lessons.html" style="color:#7acc8a">К занятиям</a></div>';
}
}

function render(){
const s=calendarData.schedule||[];
const u=calendarData.user||{};
const total=calendarData.totalDays||0;
const completed=calendarData.completedDays||0;
const pct=total?Math.round(completed/total*100):0;

let html='<div class="cal-header"><a href="lessons.html" class="cal-header__back">← Занятия</a><div class="cal-header__title">Календарь</div></div>';

html+='<div class="cal-stats">';
html+='<div class="cal-stat"><div class="cal-stat__value">'+esc(completed)+'</div><div class="cal-stat__label">Пройдено</div></div>';
html+='<div class="cal-stat"><div class="cal-stat__value">'+esc(total-completed)+'</div><div class="cal-stat__label">Осталось</div></div>';
html+='<div class="cal-stat"><div class="cal-stat__value">'+esc(total)+'</div><div class="cal-stat__label">Всего в году</div></div>';
html+='<div class="cal-stat"><div class="cal-stat__value">'+(u.subscription_started_at?esc(u.subscription_started_at.split(' ')[0]):'—')+'</div><div class="cal-stat__label">Подписка с</div></div>';
html+='</div>';

html+='<div class="cal-progress"><div class="cal-progress__bar"><div class="cal-progress__fill" style="width:'+pct+'%"></div></div>';
html+='<div class="cal-progress__text">Пройдено '+completed+' из '+total+' занятий года ('+pct+'%)</div></div>';

html+='<div class="cal-tabs">';
['year','month','week'].forEach(v=>{
html+='<button class="cal-tab'+(currentView===v?' active':'')+'" data-view="'+v+'">'+(v==='year'?'Год':v==='month'?'Месяц':'Неделя')+'</button>';
});
html+='</div>';

if(currentView==='year')html+=renderYear(s);
else if(currentView==='month')html+=renderMonth(s);
else html+=renderWeek(s);

html+='</div>';
root.innerHTML=html;
bindEvents(s);
}

function renderYear(s){
let html='<div class="cal-nav"><button class="cal-nav__btn" id="prev-year">←</button>';
html+='<div class="cal-nav__title">'+viewDate.getFullYear()+'</div>';
html+='<button class="cal-nav__btn" id="next-year">→</button></div>';
html+='<div class="cal-grid cal-grid--year">';
for(let m=0;m<12;m++){
html+='<div class="cal-month"><div class="cal-month__title">'+MONTHS[m]+'</div><div class="cal-month__days">';
DAYS_SHORT.forEach(d=>{html+='<div class="cal-day-header">'+d+'</div>';});
const first=new Date(viewDate.getFullYear(),m,1);
const daysInMonth=new Date(viewDate.getFullYear(),m+1,0).getDate();
const startDay=(first.getDay()+6)%7;
for(let i=0;i<startDay;i++)html+='<div class="cal-day cal-day--empty"></div>';
for(let d=1;d<=daysInMonth;d++){
const dateStr=viewDate.getFullYear()+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const item=s.find(x=>x.date===dateStr);
const today=new Date();const todayStr=localDateStr(today);
let cls='cal-day';
if(dateStr===todayStr)cls+=' cal-day--today';
else if(item&&item.watched&&item.watched.completed)cls+=' cal-day--completed';
else if(item&&item.lesson_id&&!item.watched)cls+=' cal-day--future';
else if(!item||!item.lesson_id)cls+=' cal-day--rest';
if(item&&item.lesson_id)cls+=' cal-day--has-lesson';
html+='<div class="'+cls+'" data-date="'+dateStr+'" title="'+(item?esc(item.theme||''):('Нет занятия'))+'">'+d+'</div>';
}
html+='</div></div>';
}
html+='</div>';
return html;
}

function renderMonth(s){
const year=viewDate.getFullYear();const month=viewDate.getMonth();
let html='<div class="cal-nav"><button class="cal-nav__btn" id="prev-month">←</button>';
html+='<div class="cal-nav__title">'+MONTHS[month]+' '+year+'</div>';
html+='<button class="cal-nav__btn" id="next-month">→</button></div>';
html+='<div class="cal-grid cal-grid--month">';
DAYS_SHORT.forEach(d=>{html+='<div class="cal-day-header">'+d+'</div>';});
const first=new Date(year,month,1);const daysInMonth=new Date(year,month+1,0).getDate();
const startDay=(first.getDay()+6)%7;
for(let i=0;i<startDay;i++)html+='<div class="cal-day cal-day--empty"></div>';
for(let d=1;d<=daysInMonth;d++){
const dateStr=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const item=s.find(x=>x.date===dateStr);
const today=new Date();const todayStr=localDateStr(today);
let cls='cal-day';
if(dateStr===todayStr)cls+=' cal-day--today';
else if(item&&item.watched&&item.watched.completed)cls+=' cal-day--completed';
else if(item&&item.lesson_id)cls+=' cal-day--future';
else cls+=' cal-day--rest';
if(item&&item.lesson_id)cls+=' cal-day--has-lesson';
html+='<div class="'+cls+'" data-date="'+dateStr+'" title="'+(item?esc(item.theme||''):('Нет занятия'))+'">'+d+'</div>';
}
html+='</div>';
return html;
}

function renderWeek(s){
const today=new Date();const dayOfWeek=(today.getDay()+6)%7;
const weekStart=new Date(today);weekStart.setDate(today.getDate()-dayOfWeek);
let html='<div class="cal-nav"><div class="cal-nav__title">Эта неделя</div></div>';
html+='<div class="cal-grid cal-grid--week">';
for(let i=0;i<7;i++){
const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);
const dateStr=localDateStr(d);
const item=s.find(x=>x.date===dateStr);
const todayStr=localDateStr(today);
const isToday=dateStr===todayStr;
let cls='cal-week-card';
if(isToday)cls+=' today';
html+='<div class="'+cls+'" data-date="'+dateStr+'">';
html+='<div class="cal-week-card__day">'+DAYS_SHORT[i]+' '+d.getDate()+' '+(MONTHS_SHORT[d.getMonth()])+'</div>';
if(item&&item.theme){
html+='<div class="cal-week-card__theme">'+esc(item.theme)+'</div>';
html+='<div class="cal-week-card__meta">';
if(item.duration)html+='<span>⏱ '+esc(item.duration)+' мин</span>';
if(item.title)html+='<span>'+esc(item.title)+'</span>';
html+='<span class="cal-week-card__status">';
if(item.watched&&item.watched.completed)html+='<span style="color:#2ecc71">✓ Пройдено</span>';
else if(isToday)html+='<span style="color:#1a5e2a">● Сегодня</span>';
else html+='<span style="color:#5a7a60">○ Предстоит</span>';
html+='</span></div>';
}else{
html+='<div class="cal-week-card__theme" style="color:#5a7a60">День отдыха</div>';
}
html+='</div>';
}
html+='</div>';
return html;
}

function bindEvents(s){
document.querySelectorAll('[data-view]').forEach(el=>{
el.addEventListener('click',function(){currentView=this.dataset.view;render();});
});
document.getElementById('prev-year')?.addEventListener('click',()=>{viewDate.setFullYear(viewDate.getFullYear()-1);render();});
document.getElementById('next-year')?.addEventListener('click',()=>{viewDate.setFullYear(viewDate.getFullYear()+1);render();});
document.getElementById('prev-month')?.addEventListener('click',()=>{viewDate.setMonth(viewDate.getMonth()-1);render();});
document.getElementById('next-month')?.addEventListener('click',()=>{viewDate.setMonth(viewDate.getMonth()+1);render();});
document.querySelectorAll('[data-date]').forEach(el=>{
el.addEventListener('click',function(){
const dateStr=this.dataset.date;
const item=s.find(x=>x.date===dateStr);
if(item&&item.lesson_id){window.location.href='player.html?id='+item.lesson_id;}
});
});
}

load();
})();
</script>
</body>
</html>
