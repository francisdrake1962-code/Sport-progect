<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <title>Календарь — Цигун и суставная разминка</title>
    
    <style>
        .cal-page{min-height:100vh;background:#faf7f2;color:#2b2721}
        .cal-header{background:#ffffff;padding:.75rem 1.5rem;display:flex;align-items:center;gap:1rem;border-bottom:1px solid #e3d8c3;position:sticky;top:0;z-index:10}
        .cal-header__back{color:#8a6f52;text-decoration:none;font-size:.95rem}
        .cal-header__back:hover{color:#2b2721}
        .cal-header__title{color:#2b2721;font-size:1.1rem;font-weight:600}
        .cal-stats{max-width:960px;margin:1rem auto;padding:0 1rem;display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem}
        .cal-stat{background:#ffffff;border:1px solid #e8dcc4;border-radius:8px;padding:.75rem;text-align:center}
        .cal-stat__value{color:#8a6f52;font-size:1.3rem;font-weight:700}
        .cal-stat__label{color:#7c6f5d;font-size:.75rem;margin-top:.2rem}
        .cal-progress{max-width:960px;margin:0 auto 1rem;padding:0 1rem}
        .cal-progress__bar{background:#f1ece2;border-radius:8px;height:8px;overflow:hidden}
        .cal-progress__fill{height:100%;background:linear-gradient(90deg,#8a6f52,#b99a74);border-radius:8px;transition:width .3s}
        .cal-progress__text{color:#8f8578;font-size:.8rem;margin-top:.3rem;text-align:center}
        .cal-tabs{max-width:960px;margin:0 auto;padding:0 1rem;display:flex;gap:0;background:#ffffff;border-radius:8px;overflow:hidden;margin-bottom:1rem}
        .cal-tab{flex:1;padding:.6rem;text-align:center;cursor:pointer;color:#8f8578;font-size:.85rem;font-weight:500;border:none;background:none;transition:all .15s}
        .cal-tab.active{background:#8a6f52;color:#f5efe4}
        .cal-nav{max-width:960px;margin:0 auto;padding:0 1rem;display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem}
        .cal-nav__center{display:flex;align-items:center;gap:.75rem}
        .cal-nav__title{color:#2b2721;font-size:1.15rem;font-weight:600}
        .cal-nav__btn{background:#ffffff;color:#8a6f52;border:1px solid #e3d8c3;padding:.45rem .9rem;border-radius:6px;cursor:pointer;font-size:.85rem;transition:all .15s}
        .cal-nav__btn:hover{background:#f1ece2;color:#2b2721;border-color:#d8cbb2}
        .cal-nav__today{background:#8a6f52;color:#f5efe4;border:1px solid #8a6f52;font-weight:600}
        .cal-nav__today:hover{background:#a07f58;border-color:#a07f58;color:#2b2721}
        .cal-grid{max-width:960px;margin:0 auto;padding:0 1rem 3rem}
        .cal-grid--year{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
        .cal-grid--month{background:#ffffff;border:1px solid #e8dcc4;border-radius:12px;overflow:hidden}
        .cal-grid--week{display:grid;grid-template-columns:repeat(7,1fr);gap:.5rem}
        .cal-day-header{color:#8a6f52;font-size:.8rem;font-weight:600;text-align:center;padding:.7rem .2rem;border-bottom:1px solid #e8dcc4;text-transform:uppercase;letter-spacing:.05em}
        .cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:.9rem;cursor:pointer;transition:all .15s;position:relative;border:1px solid transparent}
        .cal-day:hover{background:#f1ece2;border-color:#e3d8c3}
        .cal-day--empty{cursor:default;border-color:transparent}
        .cal-day--today{background:rgba(138,111,82,0.25);color:#8a6f52;font-weight:700;border:2px solid #8a6f52;border-radius:50%}
        .cal-day--completed{background:#f1ece2;color:#8a6f52}
        .cal-day--completed:hover{background:#f1ece2}
        .cal-day--rest{color:#8f8578}
        .cal-day--future{color:#8f8578}
        .cal-day--has-lesson::after{content:'';position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:#b99a74}
        .cal-day--completed::after{background:#b99a74}
        .cal-day--future::after{background:#8a6f52}
        .cal-month{background:#ffffff;border:1px solid #e8dcc4;border-radius:8px;overflow:hidden}
        .cal-month__title{background:#f1ece2;color:#8a6f52;font-size:.75rem;font-weight:600;padding:.4rem;text-align:center}
        .cal-month__days{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;padding:2px}
        .cal-month .cal-day-header{font-size:.55rem;padding:.2rem 0;border-bottom:none}
        .cal-month .cal-day{font-size:.65rem;border-radius:4px}
        .cal-week-card{background:#ffffff;border:1px solid #e8dcc4;border-radius:10px;padding:1rem;cursor:pointer;transition:all .15s}
        .cal-week-card:hover{border-color:#d8cbb2;transform:translateY(-1px)}
        .cal-week-card.today{border-color:#8a6f52;background:#f1ece2}
        .cal-week-card--missed{border-color:#c96a54;background:#f1ece2}
        .cal-week-card__day{color:#7c6f5d;font-size:.75rem;margin-bottom:.2rem}
        .cal-week-card__theme{color:#2b2721;font-size:.95rem;font-weight:600;margin-bottom:.2rem}
        .cal-week-card__meta{color:#8f8578;font-size:.8rem;display:flex;gap:.5rem;align-items:center}
        .cal-week-card__status{margin-left:auto}
        .cal-empty{text-align:center;padding:3rem 1rem;color:#7c6f5d}
        .cal-empty__icon{font-size:2rem;margin-bottom:.5rem}
        @media(max-width:768px){.cal-stats{grid-template-columns:repeat(2,1fr)}.cal-grid--year{grid-template-columns:repeat(3,1fr)}}
        @media(max-width:480px){.cal-stats{grid-template-columns:1fr 1fr}.cal-grid--year{grid-template-columns:repeat(2,1fr)}}
    </style>
</head>
<body>
    <noscript><div style="padding:2rem;text-align:center;color:#2b2721;background:#faf7f2;min-height:100vh;font-family:sans-serif;"><h1>Цигун</h1><p>Для работы календаря необходим JavaScript.</p><a href="/" style="color:#8a6f52;">На главную</a></div></noscript>
<div class="cal-page" id="cal-root"></div>
<script>
(function(){
const root=document.getElementById('cal-root');
function esc(s){if(s==null)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function localDateStr(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day;}
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_SHORT=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const DAYS_SHORT=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

let currentView='month';
let viewDate=new Date();
let calendarData=null;

async function api(path){
const token=localStorage.getItem('user_token');
if(!token){
  root.innerHTML='<div class="cal-empty"><div class="cal-empty__icon">🔒</div><div class="cal-empty__title" style="color:#2b2721;margin-bottom:0.5rem;">Войдите, чтобы видеть календарь</div><p style="color:#8f8578;margin-bottom:1rem;">Бесплатно — 7 занятий без карты</p><a href="login.html" style="display:inline-block;padding:0.7rem 1.5rem;background:#8a6f52;color:#f5efe4;border-radius:8px;text-decoration:none;font-weight:600;">Войти</a></div>';
  return null;
}
const res=await fetch(path,{headers:{'Authorization':'Bearer '+token}});
if(res.status===401){localStorage.removeItem('user_token');localStorage.removeItem('user_data');window.location.href='login.html';return null;}
if(!res.ok)throw new Error('API error');
return res.json();
}

async function load(){
try{
calendarData=await api('/api/user/calendar');
if(!calendarData)return;
render();
}catch(err){
root.innerHTML='<div class="cal-empty"><div class="cal-empty__icon">⚠️</div><p>'+esc(err.message)+'</p><a href="lessons.html" style="color:#8a6f52">К занятиям</a></div>';
}
}

function render(){
const s=calendarData.schedule||[];
const u=calendarData.user||{};
const total=calendarData.totalDays||0;
const completed=calendarData.completedDays||0;
const pct=total?Math.round(completed/total*100):0;

let html='<div class="cal-header"><a href="lessons.html" class="cal-header__back">← Занятия</a><div class="cal-header__title">Календарь</div></div>';

html+='<div class="cal-stats">';
html+='<div class="cal-stat"><div class="cal-stat__value">'+esc(completed)+'</div><div class="cal-stat__label">Пройдено</div></div>';
html+='<div class="cal-stat"><div class="cal-stat__value">'+esc(total-completed)+'</div><div class="cal-stat__label">Осталось</div></div>';
html+='<div class="cal-stat"><div class="cal-stat__value">'+esc(total)+'</div><div class="cal-stat__label">Всего в курсе</div></div>';
html+='<div class="cal-stat"><div class="cal-stat__value">'+(u.subscription_started_at?esc(u.subscription_started_at.split(' ')[0]):'—')+'</div><div class="cal-stat__label">Начало занятий</div></div>';
html+='</div>';

html+='<div class="cal-progress"><div class="cal-progress__bar"><div class="cal-progress__fill" style="width:'+pct+'%"></div></div>';
html+='<div class="cal-progress__text">Пройдено '+completed+' из '+total+' занятий ('+pct+'%)</div></div>';

html+='<div class="cal-tabs">';
['year','month','week'].forEach(v=>{
html+='<button class="cal-tab'+(currentView===v?' active':'')+'" data-view="'+v+'">'+(v==='year'?'Год':v==='month'?'Месяц':'Неделя')+'</button>';
});
html+='</div>';

if(currentView==='year')html+=renderYear(s);
else if(currentView==='month')html+=renderMonth(s);
else html+=renderWeek(s);

html+='</div>';
root.innerHTML=html;
bindEvents(s);
}

function renderYear(s){
let html='<div class="cal-nav"><button class="cal-nav__btn" id="prev-year">←</button>';
html+='<div class="cal-nav__center">';
html+='<div class="cal-nav__title">'+viewDate.getFullYear()+'</div>';
html+='<button class="cal-nav__btn cal-nav__today" id="btn-today-year">Сегодня</button>';
html+='</div>';
html+='<button class="cal-nav__btn" id="next-year">→</button></div>';
html+='<div class="cal-grid cal-grid--year">';
for(let m=0;m<12;m++){
html+='<div class="cal-month"><div class="cal-month__title">'+MONTHS[m]+'</div><div class="cal-month__days">';
DAYS_SHORT.forEach(d=>{html+='<div class="cal-day-header">'+d+'</div>';});
const first=new Date(viewDate.getFullYear(),m,1);
const daysInMonth=new Date(viewDate.getFullYear(),m+1,0).getDate();
const startDay=(first.getDay()+6)%7;
for(let i=0;i<startDay;i++)html+='<div class="cal-day cal-day--empty"></div>';
for(let d=1;d<=daysInMonth;d++){
const dateStr=viewDate.getFullYear()+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const item=s.find(x=>x.date===dateStr);
const today=new Date();const todayStr=localDateStr(today);
let cls='cal-day';
if(dateStr===todayStr)cls+=' cal-day--today';
else if(item&&item.watched&&item.watched.completed)cls+=' cal-day--completed';
else if(item&&item.is_future)cls+=' cal-day--future';
else if(item&&item.is_past&&!item.watched)cls+=' cal-day--rest';
else if(!item)cls+=' cal-day--rest';
if(item&&item.lesson_id)cls+=' cal-day--has-lesson';
const label=item?(item.day_number?item.day_number:d):d;
html+='<div class="'+cls+'" data-date="'+dateStr+'" title="'+(item?('День '+item.day_number+': '+esc(item.theme||item.title||'')):'Нет занятия')+'">'+label+'</div>';
}
html+='</div></div>';
}
html+='</div>';
return html;
}

function renderMonth(s){
const year=viewDate.getFullYear();const month=viewDate.getMonth();
const today=new Date();const todayStr=localDateStr(today);
let html='<div class="cal-nav"><button class="cal-nav__btn" id="prev-month">←</button>';
html+='<div class="cal-nav__center">';
html+='<div class="cal-nav__title">'+MONTHS[month]+' '+year+'</div>';
html+='<button class="cal-nav__btn cal-nav__today" id="btn-today">Сегодня</button>';
html+='</div>';
html+='<button class="cal-nav__btn" id="next-month">→</button></div>';
html+='<div class="cal-grid cal-grid--month">';
DAYS_SHORT.forEach(d=>{html+='<div class="cal-day-header">'+d+'</div>';});
const first=new Date(year,month,1);const daysInMonth=new Date(year,month+1,0).getDate();
const startDay=(first.getDay()+6)%7;
for(let i=0;i<startDay;i++)html+='<div class="cal-day cal-day--empty"></div>';
for(let d=1;d<=daysInMonth;d++){
const dateStr=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const item=s.find(x=>x.date===dateStr);
let cls='cal-day';
if(dateStr===todayStr)cls+=' cal-day--today';
else if(item&&item.watched&&item.watched.completed)cls+=' cal-day--completed';
else if(item&&item.is_future)cls+=' cal-day--future';
else if(item&&item.is_past&&!item.watched)cls+=' cal-day--rest';
else if(!item)cls+=' cal-day--rest';
if(item&&item.lesson_id)cls+=' cal-day--has-lesson';
const label=item?(item.day_number?item.day_number:d):d;
html+='<div class="'+cls+'" data-date="'+dateStr+'" title="'+(item?('День '+item.day_number+': '+esc(item.theme||item.title||'')):'Нет занятия')+'">'+label+'</div>';
}
html+='</div>';
return html;
}

function renderWeek(s){
const today=new Date();const dayOfWeek=(today.getDay()+6)%7;
const weekStart=new Date(today);weekStart.setDate(today.getDate()-dayOfWeek);
let html='<div class="cal-nav"><div class="cal-nav__title">Эта неделя</div></div>';
html+='<div class="cal-grid cal-grid--week">';
for(let i=0;i<7;i++){
const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);
const dateStr=localDateStr(d);
const item=s.find(x=>x.date===dateStr);
const todayStr=localDateStr(today);
const isToday=dateStr===todayStr;
let cls='cal-week-card';
if(isToday)cls+=' today';
if(item&&item.is_past&&!item.watched)cls+=' cal-week-card--missed';
html+='<div class="'+cls+'" data-date="'+dateStr+'">';
html+='<div class="cal-week-card__day">'+DAYS_SHORT[i]+' '+d.getDate()+' '+(MONTHS_SHORT[d.getMonth()])+'</div>';
if(item&&item.theme){
html+='<div class="cal-week-card__theme">'+esc(item.theme)+'</div>';
html+='<div class="cal-week-card__meta">';
html+='<span style="color:#8a6f52;font-weight:600">День '+esc(item.day_number)+'</span>';
            if(item.duration)html+='<span>⏱ '+esc(item.duration)+' мин</span>';
            if(item.intensity)html+='<span>'+({low:'Щадящая',medium:'Средняя',high:'Интенсивная'}[item.intensity]||esc(item.intensity))+'</span>';
            if(item.title)html+='<span>'+esc(item.title)+'</span>';
html+='<span class="cal-week-card__status">';
if(item.watched&&item.watched.completed)html+='<span style="color:#b99a74">✓ Пройдено</span>';
else if(isToday)html+='<span style="color:#8a6f52">● Сегодня</span>';
else if(item.is_future)html+='<span style="color:#7c6f5d">○ Предстоит</span>';
else html+='<span style="color:#c9a45c">○ Пропущено</span>';
html+='</span></div>';
}else{
html+='<div class="cal-week-card__theme" style="color:#7c6f5d">Нет занятия</div>';
}
html+='</div>';
}
html+='</div>';
return html;
}

function bindEvents(s){
document.querySelectorAll('[data-view]').forEach(el=>{
el.addEventListener('click',function(){currentView=this.dataset.view;render();});
});
document.getElementById('prev-year')?.addEventListener('click',()=>{viewDate.setFullYear(viewDate.getFullYear()-1);render();});
document.getElementById('next-year')?.addEventListener('click',()=>{viewDate.setFullYear(viewDate.getFullYear()+1);render();});
document.getElementById('prev-month')?.addEventListener('click',()=>{viewDate.setMonth(viewDate.getMonth()-1);render();});
document.getElementById('next-month')?.addEventListener('click',()=>{viewDate.setMonth(viewDate.getMonth()+1);render();});
document.getElementById('btn-today')?.addEventListener('click',()=>{viewDate=new Date();currentView='month';render();});
document.getElementById('btn-today-year')?.addEventListener('click',()=>{viewDate=new Date();currentView='year';render();});
document.querySelectorAll('[data-date]').forEach(el=>{
el.addEventListener('click',function(){
const dateStr=this.dataset.date;
const item=s.find(x=>x.date===dateStr);
if(item&&item.lesson_id){window.location.href='player.html?id='+item.lesson_id;}
});
});
}

load();
})();
</script>
</body>
</html>
