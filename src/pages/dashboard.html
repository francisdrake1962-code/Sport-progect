<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <title>Главная — Цигун и суставная разминка</title>
    
    <style>
        .dash{min-height:100vh;background:#faf7f2;color:#2b2721}
        .dash-header{background:#ffffff;padding:.75rem 1.5rem;display:flex;align-items:center;gap:1rem;border-bottom:1px solid #e3d8c3;position:sticky;top:0;z-index:10}
        .dash-header__logo{color:#8a6f52;font-weight:700;font-size:1.05rem;text-decoration:none;white-space:nowrap}
        .dash-header__nav{display:flex;gap:1rem;margin-left:auto;align-items:center}
        .dash-header__nav a{color:#8f8578;text-decoration:none;font-size:.85rem;white-space:nowrap}
        .dash-header__nav a:hover,.dash-header__nav a.active{color:#2b2721}
        .dash-greeting{padding:2rem 1.5rem 1.5rem;max-width:960px;margin:0 auto}
        .dash-greeting__hi{font-size:1.6rem;font-weight:700;color:#2b2721;margin-bottom:.25rem}
        .dash-greeting__sub{color:#8a6f52;font-size:.95rem}
        .dash-stats{display:flex;gap:.75rem;margin-top:1rem;flex-wrap:wrap}
        .dash-stat{background:#ffffff;border:1px solid #e8dcc4;border-radius:10px;padding:.7rem 1rem;min-width:100px;text-align:center}
        .dash-stat__num{font-size:1.3rem;font-weight:700;color:#8a6f52}
        .dash-stat__label{font-size:.7rem;color:#7c6f5d;text-transform:uppercase;letter-spacing:.03em;margin-top:.15rem}
        .dash-section{max-width:960px;margin:0 auto;padding:0 1rem 1.5rem}
        .dash-section__title{color:#8a6f52;font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.75rem;padding-left:.25rem}
        .dash-continue{display:flex;align-items:center;gap:1rem;background:linear-gradient(135deg,#f1ece2 0%,#ffffff 100%);border:1px solid #d8cbb2;border-radius:12px;padding:1rem 1.25rem;cursor:pointer;transition:transform .15s,box-shadow .15s;text-decoration:none;color:#2b2721}
        .dash-continue:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(138,111,82,.2)}
        .dash-continue__icon{width:50px;height:50px;background:#8a6f52;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .dash-continue__icon svg{fill:#f5efe4;width:20px;height:20px;margin-left:2px}
        .dash-continue__info{flex:1;min-width:0}
        .dash-continue__label{color:#93a077;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
        .dash-continue__name{color:#2b2721;font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .dash-continue__meta{color:#8f8578;font-size:.8rem}
        .dash-continue__progress{height:3px;background:#e8dcc4;border-radius:2px;margin-top:.4rem;overflow:hidden}
        .dash-continue__progress-fill{height:100%;background:#8a6f52;border-radius:2px}
        .dash-today{background:#ffffff;border:1px solid #e8dcc4;border-radius:12px;padding:1.25rem}
        .dash-today__label{color:#93a077;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-bottom:.5rem}
        .dash-today__name{color:#2b2721;font-size:1.1rem;font-weight:600;margin-bottom:.3rem}
        .dash-today__meta{color:#8f8578;font-size:.85rem;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
        .dash-today__btn{display:inline-flex;align-items:center;gap:.4rem;background:#8a6f52;color:#f5efe4;border:none;padding:.5rem 1rem;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:background .15s;margin-top:.75rem;text-decoration:none}
        .dash-today__btn:hover{background:#a07f58}
        .dash-today__btn svg{fill:#f5efe4;width:14px;height:14px}
        .dash-zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.6rem}
        .dash-zone{background:#ffffff;border:1px solid #e8dcc4;border-radius:10px;padding:1rem .75rem;text-align:center;cursor:pointer;transition:all .15s;text-decoration:none;color:#2b2721}
        .dash-zone:hover{border-color:#d8cbb2;background:#f1ece2}
        .dash-zone__icon{font-size:1.5rem;margin-bottom:.3rem}
        .dash-zone__name{color:#2b2721;font-size:.85rem;font-weight:600}
        .dash-zone__count{color:#7c6f5d;font-size:.7rem;margin-top:.15rem}
        .dash-schedule{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.5rem;scroll-snap-type:x mandatory}
        .dash-schedule::-webkit-scrollbar{height:4px}
        .dash-schedule::-webkit-scrollbar-thumb{background:#e3d8c3;border-radius:2px}
        .dash-day{min-width:110px;flex-shrink:0;background:#ffffff;border:1px solid #e8dcc4;border-radius:10px;padding:.75rem;text-align:center;scroll-snap-align:start;text-decoration:none;color:#2b2721;transition:all .15s}
        .dash-day:hover{border-color:#d8cbb2}
        .dash-day.today{border-color:#8a6f52;background:#f1ece2}
        .dash-day__date{color:#8f8578;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
        .dash-day__day{color:#2b2721;font-size:.9rem;font-weight:600;margin:.2rem 0}
        .dash-day__lesson{color:#8a6f52;font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .dash-day__empty{color:#8f8578;font-size:.7rem}
        .dash-bottom{max-width:960px;margin:0 auto;padding:0 1rem 3rem;display:flex;gap:.75rem;flex-wrap:wrap}
        .dash-link{flex:1;min-width:140px;background:#ffffff;border:1px solid #e8dcc4;border-radius:10px;padding:1rem;text-align:center;text-decoration:none;color:#2b2721;transition:all .15s}
        .dash-link:hover{border-color:#d8cbb2;background:#f1ece2}
        .dash-link__icon{font-size:1.3rem;margin-bottom:.3rem}
        .dash-link__text{color:#2b2721;font-size:.85rem;font-weight:600}
        .dash-empty{text-align:center;padding:3rem 1rem;color:#7c6f5d}
        .dash-empty__icon{font-size:2rem;margin-bottom:.5rem}
        .dash-programs{display:flex;gap:.6rem;overflow-x:auto;padding-bottom:.5rem;scroll-snap-type:x mandatory}
        .dash-programs::-webkit-scrollbar{height:4px}
        .dash-programs::-webkit-scrollbar-thumb{background:#e3d8c3;border-radius:2px}
        .dash-program{min-width:140px;flex-shrink:0;background:#ffffff;border:1px solid #e8dcc4;border-radius:10px;padding:1rem;text-align:center;cursor:pointer;transition:all .15s;text-decoration:none;color:#2b2721;scroll-snap-align:start}
        .dash-program:hover{border-color:#d8cbb2;background:#f1ece2}
        .dash-program__icon{font-size:1.5rem;margin-bottom:.3rem}
        .dash-program__name{color:#2b2721;font-size:.85rem;font-weight:600;margin-bottom:.15rem}
        .dash-program__count{color:#7c6f5d;font-size:.7rem}
        @media(max-width:600px){
            .dash-greeting{padding:1.5rem 1rem 1rem}
            .dash-greeting__hi{font-size:1.3rem}
            .dash-header{padding:.75rem 1rem}
            .dash-zones{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Перейти к содержимому</a>
    <noscript><div style="padding:2rem;text-align:center;color:#2b2721;background:#faf7f2;min-height:100vh;font-family:sans-serif;"><h1>Цигун</h1><p>Для работы приложения необходим JavaScript.</p><a href="/" style="color:#8a6f52;">На главную</a></div></noscript>
    <div id="main-content"></div>
    <script>
    (function(){
        var root=document.getElementById('main-content');
        function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
        function localDateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
        function api(path,hdr){
            var token=localStorage.getItem('user_token');
            var headers={'Content-Type':'application/json'};
            if(token)headers['Authorization']='Bearer '+token;
            return fetch(path,{headers:headers}).then(function(r){if(!r.ok)throw new Error('API '+r.status);return r.json();});
        }
        var zoneIcons={шея:'💆',плечи_руки:'💪',грудной_отдел:'🫁',поясница:'🧘',спина_осанка:'🧍',колени:'🦵',ноги_таз:'🚶',баланс_общее:'⚖️'};

        if(!localStorage.getItem('user_token')){
            root.innerHTML='<div class="dash-empty"><div class="dash-empty__icon">🧘</div><p>Войдите, чтобы начать</p><a href="login.html" style="color:#8a6f52;margin-top:.5rem;display:inline-block">Войти</a></div>';
            return;
        }

        load();

        function load(){
            api('/api/user/dashboard').then(function(d){
                render(d);
            }).catch(function(e){
                root.innerHTML='<div class="dash-empty"><div class="dash-empty__icon">⚠️</div><p>Ошибка загрузки: '+esc(e.message)+'</p><a href="/" style="color:#8a6f52;">На главную</a></div>';
            });
        }

        function render(d){
            var userName='';
            try{var ud=JSON.parse(localStorage.getItem('user_data'));userName=(ud&&ud.name)?ud.name.split(' ')[0]:'';}catch(e){}
            var greeting=['Доброе утро','Добрый день','Добрый вечер'][new Date().getHours()<12?0:new Date().getHours()<18?1:2];
            var html=renderHeader();

            html+='<div class="dash-greeting">';
            html+='<div class="dash-greeting__hi">'+greeting+(userName?', '+esc(userName):'')+' 👋</div>';
            html+='<div class="dash-greeting__sub">'+d.lessonCount+' занятий · '+d.zoneCount+' зон тела</div>';
            html+='<div class="dash-stats">';
            html+='<div class="dash-stat"><div class="dash-stat__num">'+d.completedCount+'</div><div class="dash-stat__label">Пройдено</div></div>';
            if(d.user){
                var freeLeft=d.user.plan==='trial'?Math.max(0,7-(d.user.free_sessions_used||0)):0;
                if(d.user.plan==='trial'){
                    html+='<div class="dash-stat"><div class="dash-stat__num">'+freeLeft+'</div><div class="dash-stat__label">Осталось бесплатно</div></div>';
                }else{
                    html+='<div class="dash-stat"><div class="dash-stat__num">∞</div><div class="dash-stat__label">'+esc(d.user.plan)+'</div></div>';
                }
            }
            html+='</div></div>';

            if(d.lastWatched){
                var pct=d.lastWatched.duration?Math.min(100,Math.round(d.lastWatched.position_seconds/(d.lastWatched.duration*60)*100)):0;
                html+='<div class="dash-section">';
                html+='<div class="dash-section__title">Продолжить</div>';
                html+='<a href="player.html?id='+d.lastWatched.lesson_id+'" class="dash-continue">';
                html+='<div class="dash-continue__icon"><svg viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19"/></svg></div>';
                html+='<div class="dash-continue__info">';
                html+='<div class="dash-continue__label">Продолжить просмотр</div>';
                html+='<div class="dash-continue__name">'+esc(d.lastWatched.title)+'</div>';
                html+='<div class="dash-continue__meta">'+(d.lastWatched.duration?d.lastWatched.duration+' мин · ':'')+Math.round(d.lastWatched.position_seconds/60)+' мин просмотрено</div>';
                html+='<div class="dash-continue__progress"><div class="dash-continue__progress-fill" style="width:'+pct+'%"></div></div>';
                html+='</div></a></div>';
            }

            if(d.todaySchedule&&d.todaySchedule.lesson_id){
                html+='<div class="dash-section">';
                html+='<div class="dash-section__title">Сегодня по расписанию</div>';
                html+='<div class="dash-today">';
                html+='<div class="dash-today__label">Сегодня</div>';
                html+='<div class="dash-today__name">'+esc(d.todaySchedule.title||d.todaySchedule.theme||'Занятие')+'</div>';
                html+='<div class="dash-today__meta">';
                if(d.todaySchedule.duration)html+='<span>⏱ '+esc(d.todaySchedule.duration)+' мин</span>';
                html+='<span>📅 По расписанию</span></div>';
                html+='<a href="player.html?id='+d.todaySchedule.lesson_id+'" class="dash-today__btn"><svg viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19"/></svg> Начать</a>';
                html+='</div></div>';
            }

            html+='<div class="dash-section">';
            html+='<div class="dash-section__title">Зоны тела</div>';
            html+='<div class="dash-zones" id="dash-zones"></div></div>';

            if(d.schedule&&d.schedule.length){
                html+='<div class="dash-section">';
                html+='<div class="dash-section__title">Расписание на неделю</div>';
                html+='<div class="dash-schedule">';
                var todayStr=localDateStr(new Date());
                var dayNames=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
                var monthNames=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
                for(var i=0;i<d.schedule.length&&i<7;i++){
                    var s=d.schedule[i];
                    var dt=new Date(s.date+'T00:00:00');
                    var isToday=s.date===todayStr;
                    html+='<a href="'+(s.lesson_id?'player.html?id='+s.lesson_id:'#')+'" class="dash-day'+(isToday?' today':'')+'">';
                    html+='<div class="dash-day__date">'+dayNames[dt.getDay()]+' '+dt.getDate()+' '+monthNames[dt.getMonth()]+'</div>';
                    if(s.lesson_id){
                        html+='<div class="dash-day__day">▶</div>';
                        html+='<div class="dash-day__lesson">'+esc(s.title||s.theme||'')+'</div>';
                    }else{
                        html+='<div class="dash-day__day">—</div>';
                        html+='<div class="dash-day__empty">Выходной</div>';
                    }
                    html+='</a>';
                }
                html+='</div></div>';
            }

            if(d.programs&&d.programs.length){
                html+='<div class="dash-section">';
                html+='<div class="dash-section__title">Программы</div>';
                html+='<div class="dash-programs">';
                var programIcons=['🧘','🏯','🌀','🔄','🌿','💪','🌅','🌙'];
                d.programs.forEach(function(p,i){
                    html+='<a href="lessons.html?complex='+p.id+'" class="dash-program">';
                    html+='<div class="dash-program__icon">'+(programIcons[i%programIcons.length])+'</div>';
                    html+='<div class="dash-program__name">'+esc(p.name)+'</div>';
                    html+='<div class="dash-program__count">'+p.lesson_count+' занятий</div>';
                    html+='</a>';
                });
                html+='</div></div>';
            }

            html+='<div class="dash-section"><div class="dash-section__title">Все занятия</div></div>';
            html+='<div class="dash-bottom">';
            html+='<a href="lessons.html" class="dash-link"><div class="dash-link__icon">📚</div><div class="dash-link__text">Все занятия</div></a>';
            html+='<a href="calendar.html" class="dash-link"><div class="dash-link__icon">📅</div><div class="dash-link__text">Календарь</div></a>';
            html+='<a href="picker.html" class="dash-link"><div class="dash-link__icon">🔍</div><div class="dash-link__text">Подобрать</div></a>';
            html+='<a href="profile.html" class="dash-link"><div class="dash-link__icon">👤</div><div class="dash-link__text">Профиль</div></a>';
            html+='</div>';

            root.innerHTML=html;
            loadZones();
        }

        function renderHeader(){
            var profileLink='';
            try{
                var ud=JSON.parse(localStorage.getItem('user_data'));
                var uname=ud&&ud.name?ud.name.split(' ')[0]:'Профиль';
                profileLink='<a href="profile.html" style="color:#8a6f52;text-decoration:none;display:flex;align-items:center;gap:.35rem"><span style="font-size:1.5rem;line-height:1">👤</span><span style="font-size:.8rem;font-weight:600">'+esc(uname)+'</span></a>';
            }catch(e){
                profileLink='<a href="profile.html" style="color:#8a6f52;text-decoration:none;font-size:1.2rem">👤</a>';
            }
            return '<div class="dash-header"><a href="/" class="dash-header__logo">🧘 Цигун</a><div class="dash-header__nav"><a href="lessons.html">Занятия</a><a href="calendar.html">Календарь</a><a href="picker.html">Подобрать</a>'+profileLink+'</div></div>';
        }

        function loadZones(){
            var container=document.getElementById('dash-zones');
            if(!container)return;
            api('/api/user/categories').then(function(d){
                if(!d.zones||!d.zones.length){container.innerHTML='<p style="color:#7c6f5d">Зоны пока не добавлены</p>';return;}
                var html='';
                d.zones.forEach(function(z){
                    html+='<a href="picker.html?zone='+encodeURIComponent(z.zone)+'" class="dash-zone">';
                    html+='<div class="dash-zone__icon">'+(zoneIcons[z.zone]||'🧘')+'</div>';
                    html+='<div class="dash-zone__name">'+esc(z.label)+'</div>';
                    html+='<div class="dash-zone__count">'+z.count+' занятий</div>';
                    html+='</a>';
                });
                container.innerHTML=html;
            }).catch(function(){
                container.innerHTML='<p style="color:#7c6f5d">Не удалось загрузить</p>';
            });
        }
    })();
    </script>
</body>
</html>
