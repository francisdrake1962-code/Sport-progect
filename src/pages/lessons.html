<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <title>Занятия — Цигун и суставная разминка</title>
    
    <link rel="manifest" href="manifest.json">
    <style>
        .lessons-page { min-height:100vh; background:#faf7f2; color:#2b2721; }
        .lessons-header { background:#ffffff; padding:1rem 1.5rem; display:flex; align-items:center; gap:1rem; border-bottom:1px solid #e3d8c3; position:sticky; top:0; z-index:10; }
        .lessons-header__back { color:#8a6f52; text-decoration:none; font-size:0.95rem; }
        .lessons-header__back:hover { color:#2b2721; }
        .lessons-header__title { color:#2b2721; font-size:1.1rem; font-weight:600; }
        .lessons-hero { background:linear-gradient(135deg,#f1ece2 0%,#f1ece2 100%); padding:2rem 1.5rem; text-align:center; }
        .lessons-hero__icon { font-size:2.5rem; margin-bottom:0.5rem; }
        .lessons-hero__title { font-size:1.5rem; font-weight:700; color:#2b2721; margin-bottom:0.4rem; }
        .lessons-hero__sub { color:#8a6f52; font-size:0.95rem; }
        .lessons-today { max-width:800px; margin:1.5rem auto; padding:0 1rem; }
        .lessons-today__card { background:linear-gradient(135deg,#f1ece2 0%,#ffffff 100%); border:1px solid #d8cbb2; border-radius:12px; padding:1.5rem; cursor:pointer; transition:transform .15s, box-shadow .15s; }
        .lessons-today__card:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(138,111,82,0.2); }
        .lessons-today__label { color:#93a077; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:0.5rem; font-weight:600; }
        .lessons-today__name { color:#2b2721; font-size:1.2rem; font-weight:700; margin-bottom:0.3rem; }
        .lessons-today__meta { color:#8f8578; font-size:0.85rem; display:flex; gap:0.75rem; align-items:center; }
        .lessons-today__play { display:inline-flex; align-items:center; gap:0.4rem; background:#8a6f52;color:#f5efe4; border:none; padding:0.5rem 1rem; border-radius:8px; font-size:0.9rem; font-weight:600; margin-top:1rem; cursor:pointer; transition:background .15s; }
        .lessons-today__play:hover { background:#a07f58; }
        .lessons-today__play svg { fill:#f5efe4; width:16px; height:16px; }
        .lessons-section { max-width:800px; margin:1.5rem auto; padding:0 1rem; }
        .lessons-section__title { color:#8a6f52; font-size:0.9rem; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:1rem; padding-left:0.25rem; }
        .complex-card { background:#ffffff; border:1px solid #e8dcc4; border-radius:10px; margin-bottom:1rem; overflow:hidden; }
        .complex-card__header { padding:1rem 1.2rem; cursor:pointer; display:flex; align-items:center; gap:0.75rem; }
        .complex-card__header:hover { background:#f1ece2; }
        .complex-card__icon { font-size:1.5rem; }
        .complex-card__info { flex:1; }
        .complex-card__name { color:#2b2721; font-weight:600; font-size:1rem; }
        .complex-card__count { color:#7c6f5d; font-size:0.8rem; }
        .complex-card__arrow { color:#7c6f5d; transition:transform .2s; font-size:0.8rem; }
        .complex-card.open .complex-card__arrow { transform:rotate(90deg); }
        .complex-card__lessons { display:none; border-top:1px solid #e8dcc4; }
        .complex-card.open .complex-card__lessons { display:block; }
        .complex-lesson { display:flex; align-items:center; gap:0.75rem; padding:0.75rem 1.2rem; border-bottom:1px solid #ece4d4; text-decoration:none; color:#6f675c; transition:background .1s; }
        .complex-lesson:last-child { border-bottom:none; }
        .complex-lesson:hover { background:#f1ece2; }
        .complex-lesson__num { color:#7c6f5d; font-weight:600; font-size:0.85rem; min-width:1.5rem; }
        .complex-lesson__duration { color:#7c6f5d; font-size:0.8rem; }
        .complex-lesson__play { color:#8a6f52; font-size:1.1rem; }
        .lesson-cols { flex:1; display:grid; grid-template-columns:1.3fr 1.2fr 1.5fr 1.3fr; gap:1rem; min-width:0; }
        .lesson-col { min-width:0; font-size:0.85rem; color:#6f675c; line-height:1.35; }
        .lesson-col__title { color:#2b2721; font-weight:600; font-size:0.95rem; }
        .lesson-col__theme { color:#8a6f52; font-size:0.78rem; margin-top:0.15rem; }
        .lesson-col__label { font-size:0.68rem; text-transform:uppercase; letter-spacing:0.04em; color:#b09a7d; margin-bottom:0.2rem; }
        .all-lessons { max-width:800px; margin:1.5rem auto; padding:0 1rem 3rem; }
        .all-lessons__title { color:#8a6f52; font-size:0.9rem; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:1rem; padding-left:0.25rem; }
        .lesson-row { display:flex; align-items:center; gap:0.75rem; padding:0.75rem 1rem; background:#ffffff; border:1px solid #e8dcc4; border-radius:8px; margin-bottom:0.5rem; text-decoration:none; color:#6f675c; transition:all .1s; }
        .lesson-row:hover { background:#f1ece2; border-color:#d8cbb2; }
        .lesson-row__num { color:#7c6f5d; font-weight:600; min-width:1.8rem; text-align:center; }
        .lesson-row__info { flex:1; }
        .lesson-row__name { color:#2b2721; font-size:0.95rem; }
        .lesson-row__meta { color:#7c6f5d; font-size:0.8rem; }
        .lesson-row__play { color:#8a6f52; font-size:1.1rem; }
        .selection-bar{position:fixed;bottom:0;left:0;right:0;background:#ffffff;border-top:2px solid #8a6f52;padding:1rem 1.5rem;display:none;z-index:20;box-shadow:0 -4px 24px rgba(90,74,56,0.18)}
        .selection-bar.show{display:flex;align-items:center;justify-content:space-between;gap:1rem}
        .selection-bar__info{color:#8a6f52;font-size:0.9rem;font-weight:600}
        .selection-bar__btn{background:#8a6f52;color:#f5efe4;border:none;padding:0.6rem 1.5rem;border-radius:8px;font-size:0.95rem;font-weight:600;cursor:pointer;transition:background .15s}
        .selection-bar__btn:hover{background:#a07f58}
        .selection-bar__btn:disabled{background:#e3d8c3;color:#7c6f5d;cursor:not-allowed}
        .lesson-select{width:22px;height:22px;border:2px solid #7c6f5d;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;background:transparent}
        .lesson-select:hover{border-color:#8a6f52}
        .lesson-select.checked{background:#8a6f52;border-color:#8a6f52}
        .lesson-select.checked::after{content:'✓';color:#2b2721;font-size:0.8rem;font-weight:700}
        .lesson-row.selected{border-color:#8a6f52;background:#f1ece2}
        .lessons-empty { text-align:center; padding:3rem 1rem; color:#7c6f5d; }
        .lessons-empty__icon { font-size:2rem; margin-bottom:0.5rem; }
        @media (max-width:768px) {
            .lessons-hero { padding:1.5rem 1rem; }
            .lessons-hero__title { font-size:1.2rem; }
            .lesson-cols { grid-template-columns:1fr; gap:0.35rem; }
        }
    </style>
</head>
<body>
    <noscript><div style="padding:2rem;text-align:center;color:#2b2721;background:#faf7f2;min-height:100vh;font-family:sans-serif;"><h1>Цигун</h1><p>Для работы приложения необходим JavaScript.</p><a href="/" style="color:#8a6f52;">На главную</a></div></noscript>
    <div class="lessons-page" id="lessons-root"></div>
    <script>
    (function() {
        const root = document.getElementById('lessons-root');
        function esc(s) { if (s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
        function localDateStr(d) { const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return y+'-'+m+'-'+day; }

        async function api(path) {
            const token = localStorage.getItem('user_token');
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = 'Bearer ' + token;
            const res = await fetch(path, { headers });
            if (!res.ok) throw new Error('API error ' + res.status);
            const json = await res.json();
            if (json && Array.isArray(json.data) && json.pagination) return json.data;
            return json;
        }

        const complexIcons = { 'Основной комплекс': '🧘', 'Утренняя разминка': '🌅', 'Здоровая шея': '💆', 'Крепкая спина': '🦴', 'Суставы и гибкость': '🤸' };
        function intensityPill(l) {
            const map = { low: ['#e6f4ea', '#2e7d32'], medium: ['#fff4d6', '#b26a00'], high: ['#fdecea', '#c62828'] };
            const m = map[l.intensity];
            if (!m) return '';
            return '<span style="display:inline-block;margin-top:0.25rem;padding:0.05rem 0.5rem;border-radius:10px;font-size:0.72rem;color:' + m[1] + ';background:' + m[0] + ';">' + ({ low: 'Щадящая', medium: 'Средняя', high: 'Интенсивная' }[l.intensity]) + '</span>';
        }
        function lessonCols(l) {
            const effect = (l.effect_description && !l.effect_is_draft) ? '<div class="lesson-col__label">Эффект</div><div>' + esc(l.effect_description) + '</div>' : '';
            return '<div class="lesson-cols">' +
                '<div class="lesson-col"><div class="lesson-col__title">' + esc(l.title) + '</div>' +
                (l.theme ? '<div class="lesson-col__theme">' + esc(l.theme) + '</div>' : '') +
                intensityPill(l) + '</div>' +
                '<div class="lesson-col">' + (l.goals ? '<div class="lesson-col__label">Цель</div><div>' + esc(l.goals) + '</div>' : '<div class="lesson-col__label" style="opacity:0.45;">Цель —</div>') + '</div>' +
                '<div class="lesson-col">' + (effect || '<div class="lesson-col__label" style="opacity:0.45;">Эффект —</div>') + '</div>' +
                '<div class="lesson-col">' + (l.audience ? '<div class="lesson-col__label">Кому подойдёт</div><div>' + esc(l.audience) + '</div>' : '<div class="lesson-col__label" style="opacity:0.45;">Кому подойдёт —</div>') + '</div>' +
                '</div>';
        }
        let isTrialUser = false;
        let selectedIds = new Set();
        const FREE_LIMIT = 7;

        async function load() {
            const token = localStorage.getItem('user_token');
            if (!token) {
                root.innerHTML = renderHeader() + '<div class="lessons-empty"><div class="lessons-empty__icon">🧘</div><p>Войдите, чтобы начать занятия</p><p style="color:#7c6f5d;margin:0.3rem 0 1rem;">Бесплатно — 7 занятий без карты</p><a href="login.html" class="btn btn--primary" style="margin-top:0.5rem;display:inline-block;">Войти</a></div>';
                return;
            }
            try {
                const meRes = await fetch('/api/user/me', { headers: { 'Authorization': 'Bearer ' + token } });
                if (meRes.ok) {
                    const me = await meRes.json();
                    isTrialUser = me.plan === 'trial';
                    if (isTrialUser && (me.free_sessions_used || 0) >= FREE_LIMIT) {
                        root.innerHTML = renderHeader() + '<div class="lessons-empty"><div class="lessons-empty__icon">⏰</div><p>Пробный период завершён</p><p style="color:#7c6f5d;margin:0.5rem 0 1rem;">Вы просмотрели все 7 бесплатных занятий</p><a href="plans.html" class="btn btn--primary" style="margin-top:0.5rem;display:inline-block;">Выбрать план</a></div>';
                        return;
                    }
                }
            } catch(e) {}

            if (isTrialUser) {
                try {
                    const selRes = await fetch('/api/user/free-selections', { headers: { 'Authorization': 'Bearer ' + token } });
                    if (selRes.ok) {
                        const selData = await selRes.json();
                        selData.selections.forEach(s => selectedIds.add(s.lesson_id));
                    }
                } catch(e) {}
            }

            try {
                const [lessons, complexes, schedule] = await Promise.all([
                    api('/api/lessons'),
                    api('/api/complexes'),
                    api('/api/schedule'),
                ]);

                const today = new Date();
                const todayStr = localDateStr(today);
                let todayLesson = null;
                let todaySchedule = schedule.find(s => s.date === todayStr);
                if (todaySchedule && todaySchedule.lesson_id) {
                    todayLesson = lessons.find(l => l.id == todaySchedule.lesson_id);
                }
                if (!todayLesson && lessons.length) todayLesson = lessons[0];

                const groupedLessons = {};
                complexes.forEach(c => { groupedLessons[c.id] = { complex: c, lessons: [] }; });
                const complexIdsSet = new Set();
                for (const c of complexes) {
                    const cdata = await api('/api/complexes/' + c.id);
                    if (cdata && cdata.lessons) {
                        cdata.lessons.forEach(cl => {
                            const lesson = lessons.find(l => l.id === cl.id);
                            if (lesson && groupedLessons[c.id]) {
                                groupedLessons[c.id].lessons.push(lesson);
                                complexIdsSet.add(lesson.id);
                            }
                        });
                    }
                }
                const orphans = lessons.filter(l => !complexIdsSet.has(l.id));

                let html = renderHeader();
                html += renderHero();
                if (todayLesson) html += renderToday(todayLesson);
                html += renderComplexes(groupedLessons);
                if (orphans.length) html += renderOrphans(orphans, complexes);
                html += renderAllLessons(lessons, complexes);

                root.innerHTML = html;
                bindEvents();
                updateSelectionBar();
            } catch(err) {
                root.innerHTML = renderHeader() + '<div class="lessons-empty"><div class="lessons-empty__icon">⚠️</div><p>Ошибка загрузки: ' + esc(err.message) + '</p><a href="/" style="color:#8a6f52;">На главную</a></div>';
            }
        }

        function renderHeader() {
            var token = localStorage.getItem('user_token');
            var profileLink = '';
            if (token) {
                try {
                    var ud = JSON.parse(localStorage.getItem('user_data'));
                    var uname = ud && ud.name ? ud.name.split(' ')[0] : 'Профиль';
                    profileLink = '<a href="profile.html" style="color:#8a6f52;text-decoration:none;display:flex;align-items:center;gap:0.35rem;margin-left:0.75rem"><span style="font-size:1.5rem;line-height:1;">👤</span><span style="font-size:0.8rem;font-weight:600;">' + esc(uname) + '</span></a>';
                } catch(e) {
                    profileLink = '<a href="profile.html" style="color:#8a6f52;text-decoration:none;font-size:1.2rem;margin-left:0.75rem">👤</a>';
                }
            }
            return '<div class="lessons-header">' +
                '<a href="dashboard.html" class="lessons-header__back">← Моя главная</a>' +
                '<div class="lessons-header__title">Занятия</div>' +
                '<a href="calendar.html" style="color:#8a6f52;text-decoration:none;font-size:.85rem;margin-left:auto">📅 Календарь</a>' +
                '<a href="picker.html" style="color:#8a6f52;text-decoration:none;font-size:.85rem;margin-left:0.75rem">🔍 Подобрать занятие</a>' +
                profileLink +
                '</div>';
        }

        function renderHero() {
            return '<div class="lessons-hero">' +
                '<div class="lessons-hero__icon">🧘</div>' +
                '<div class="lessons-hero__title">Все занятия</div>' +
                '<div class="lessons-hero__sub">Выберите занятие или начните сегодняшнее</div>' +
                '</div>';
        }

        function renderToday(lesson) {
            const today = new Date();
            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            const dayName = today.toLocaleDateString('ru-RU', options);
            return '<div class="lessons-today">' +
                '<div class="lessons-today__card">' +
                '<div class="lessons-today__label">Сегодня — ' + esc(dayName) + '</div>' +
                '<div class="lessons-today__name">' + esc(lesson.title) + '</div>' +
                (lesson.theme ? '<div class="lesson-col__theme" style="margin:0.2rem 0;">' + esc(lesson.theme) + '</div>' : '') +
                (lesson.goals ? '<div style="color:#6f675c;font-size:0.85rem;margin-top:0.4rem;">🎯 ' + esc(lesson.goals) + '</div>' : '') +
                (lesson.effect_description && !lesson.effect_is_draft ? '<div style="color:#6f675c;font-size:0.85rem;margin-top:0.4rem;">✨ ' + esc(lesson.effect_description) + '</div>' : '') +
                (lesson.audience ? '<div style="color:#6f675c;font-size:0.85rem;margin-top:0.4rem;">👥 ' + esc(lesson.audience) + '</div>' : '') +
                '<div class="lessons-today__meta">' +
                (lesson.duration ? '<span>⏱ ' + esc(lesson.duration) + ' мин</span>' : '') +
                (lesson.intensity ? '<span>' + ({ low: 'Щадящая', medium: 'Средняя', high: 'Интенсивная' }[lesson.intensity]) + '</span>' : '') +
                '<span>📅 По расписанию</span>' +
                '</div>' +
                '<button class="lessons-today__play" onclick="window.location.href=\'player.html?id=' + lesson.id + '\'"><svg viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg> Начать занятие</button>' +
                '</div></div>';
        }

        function renderComplexes(grouped) {
            let html = '<div class="lessons-section"><div class="lessons-section__title">Комплексы</div>';
            let hasComplexes = false;
            Object.values(grouped).forEach(g => {
                if (!g.lessons.length) return;
                hasComplexes = true;
                const icon = complexIcons[g.complex.name] || '🏋️';
                html += '<div class="complex-card" data-complex>' +
                    '<div class="complex-card__header" data-complex-toggle>' +
                    '<div class="complex-card__icon">' + icon + '</div>' +
                    '<div class="complex-card__info"><div class="complex-card__name">' + esc(g.complex.name) + '</div>' +
                    '<div class="complex-card__count">' + g.lessons.length + ' занятий</div></div>' +
                    '<div class="complex-card__arrow">▶</div>' +
                    '</div><div class="complex-card__lessons">';
                g.lessons.forEach((l, i) => {
                    const checked = selectedIds.has(l.id);
                    const checkHtml = isTrialUser ? '<div class="lesson-select' + (checked ? ' checked' : '') + '" data-select="' + l.id + '"></div>' : '';
                    html += '<a href="player.html?id=' + l.id + '" class="complex-lesson" data-lesson-row="' + l.id + '"' + (checked ? ' style="border-color:#8a6f52;background:#f1ece2"' : '') + '>' +
                        '<span class="complex-lesson__num">' + (i+1) + '</span>' +
                        checkHtml +
                        lessonCols(l) +
                        (l.duration ? '<span class="complex-lesson__duration">' + esc(l.duration) + ' мин</span>' : '') +
                        '<span class="complex-lesson__play">▶</span>' +
                        '</a>';
                });
                html += '</div></div>';
            });
            if (!hasComplexes) html += '<p style="color:#7c6f5d;padding:0.5rem;">Комплексы пока не созданы</p>';
            html += '</div>';
            return html;
        }

        function renderOrphans(orphans, complexes) {
            let html = '<div class="all-lessons"><div class="all-lessons__title">Другие занятия</div>';
            orphans.forEach((l, i) => {
                html += '<a href="player.html?id=' + l.id + '" class="lesson-row">' +
                    '<span class="lesson-row__num">' + (i+1) + '</span>' +
                    lessonCols(l) +
                    (l.duration ? '<span class="lesson-row__meta">' + esc(l.duration) + ' мин</span>' : '') +
                    '<span class="lesson-row__play">▶</span></a>';
            });
            html += '</div>';
            return html;
        }

        function renderAllLessons(lessons, complexes) {
            let html = '<div class="all-lessons"><div class="all-lessons__title">Все занятия (' + lessons.length + ')</div>';
            lessons.forEach((l, i) => {
                const checked = selectedIds.has(l.id);
                const checkHtml = isTrialUser ? '<div class="lesson-select' + (checked ? ' checked' : '') + '" data-select="' + l.id + '"></div>' : '';
                html += '<a href="player.html?id=' + l.id + '" class="lesson-row" data-lesson-row="' + l.id + '"' + (checked ? ' style="border-color:#8a6f52;background:#f1ece2"' : '') + '>' +
                    '<span class="lesson-row__num">' + (i+1) + '</span>' +
                    checkHtml +
                    lessonCols(l) +
                    (l.duration ? '<span class="lesson-row__meta">' + esc(l.duration) + ' мин</span>' : '') +
                    '<span class="lesson-row__play">▶</span></a>';
            });
            html += '</div>';
            if (isTrialUser) {
                html += '<div class="selection-bar" id="selection-bar">' +
                    '<div class="selection-bar__info" id="selection-info">Выбрано: 0 / ' + FREE_LIMIT + '</div>' +
                    '<button class="selection-bar__btn" id="save-selections" disabled>Сохранить выбор</button>' +
                    '</div>';
            }
            return html;
        }

        function updateSelectionBar() {
            const bar = document.getElementById('selection-bar');
            const info = document.getElementById('selection-info');
            const btn = document.getElementById('save-selections');
            if (!bar || !info || !btn) return;
            info.textContent = 'Выбрано: ' + selectedIds.size + ' / ' + FREE_LIMIT;
            btn.disabled = selectedIds.size === 0;
            document.querySelectorAll('[data-select]').forEach(el => {
                const id = Number(el.dataset.select);
                if (selectedIds.has(id)) el.classList.add('checked');
                else el.classList.remove('checked');
            });
            document.querySelectorAll('[data-lesson-row]').forEach(el => {
                const id = Number(el.dataset.lessonRow);
                if (selectedIds.has(id)) el.style.borderColor = '#8a6f52';
                else el.style.borderColor = '';
            });
        }

        function bindEvents() {
            document.querySelectorAll('[data-complex-toggle]').forEach(el => {
                el.addEventListener('click', function() {
                    this.closest('[data-complex]').classList.toggle('open');
                });
            });
            document.querySelectorAll('[data-select]').forEach(el => {
                el.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const id = Number(this.dataset.select);
                    if (selectedIds.has(id)) {
                        selectedIds.delete(id);
                    } else {
                        if (selectedIds.size >= FREE_LIMIT) return;
                        selectedIds.add(id);
                    }
                    updateSelectionBar();
                });
            });
            const saveBtn = document.getElementById('save-selections');
            if (saveBtn) {
                saveBtn.addEventListener('click', async function() {
                    const token = localStorage.getItem('user_token');
                    if (!token) return;
                    try {
                        const res = await fetch('/api/user/free-selections', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                            body: JSON.stringify({ lesson_ids: Array.from(selectedIds) })
                        });
                        if (res.ok) {
                            saveBtn.textContent = '✓ Сохранено';
                            saveBtn.style.background = '#a07f58';
                            setTimeout(() => { saveBtn.textContent = 'Сохранить выбор'; saveBtn.style.background = ''; }, 2000);
                        }
                    } catch(e) {}
                });
            }
        }

        load();
    })();
    </script>
</body>
</html>
