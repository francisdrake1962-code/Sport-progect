<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <title>Занятия — Цигун и суставная разминка</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="manifest" href="manifest.json">
    <style>
        .lessons-page { min-height:100vh; background:#0a0f0c; color:#e0e0e0; }
        .lessons-header { background:#111a14; padding:1rem 1.5rem; display:flex; align-items:center; gap:1rem; border-bottom:1px solid #2a3a2e; position:sticky; top:0; z-index:10; }
        .lessons-header__back { color:#9fc5a8; text-decoration:none; font-size:0.95rem; }
        .lessons-header__back:hover { color:#fff; }
        .lessons-header__title { color:#fff; font-size:1.1rem; font-weight:600; }
        .lessons-hero { background:linear-gradient(135deg,#0d1a10 0%,#1a3a20 100%); padding:2rem 1.5rem; text-align:center; }
        .lessons-hero__icon { font-size:2.5rem; margin-bottom:0.5rem; }
        .lessons-hero__title { font-size:1.5rem; font-weight:700; color:#fff; margin-bottom:0.4rem; }
        .lessons-hero__sub { color:#7acc8a; font-size:0.95rem; }
        .lessons-today { max-width:800px; margin:1.5rem auto; padding:0 1rem; }
        .lessons-today__card { background:linear-gradient(135deg,#1a3a20 0%,#111a14 100%); border:1px solid #2a5a30; border-radius:12px; padding:1.5rem; cursor:pointer; transition:transform .15s, box-shadow .15s; }
        .lessons-today__card:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(26,94,42,0.2); }
        .lessons-today__label { color:#5a9a60; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:0.5rem; font-weight:600; }
        .lessons-today__name { color:#fff; font-size:1.2rem; font-weight:700; margin-bottom:0.3rem; }
        .lessons-today__meta { color:#7a9a80; font-size:0.85rem; display:flex; gap:0.75rem; align-items:center; }
        .lessons-today__play { display:inline-flex; align-items:center; gap:0.4rem; background:#1a5e2a; color:#fff; border:none; padding:0.5rem 1rem; border-radius:8px; font-size:0.9rem; font-weight:600; margin-top:1rem; cursor:pointer; transition:background .15s; }
        .lessons-today__play:hover { background:#228b33; }
        .lessons-today__play svg { fill:#fff; width:16px; height:16px; }
        .lessons-section { max-width:800px; margin:1.5rem auto; padding:0 1rem; }
        .lessons-section__title { color:#7acc8a; font-size:0.9rem; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:1rem; padding-left:0.25rem; }
        .complex-card { background:#111a14; border:1px solid #1e2e22; border-radius:10px; margin-bottom:1rem; overflow:hidden; }
        .complex-card__header { padding:1rem 1.2rem; cursor:pointer; display:flex; align-items:center; gap:0.75rem; }
        .complex-card__header:hover { background:#1a2a1e; }
        .complex-card__icon { font-size:1.5rem; }
        .complex-card__info { flex:1; }
        .complex-card__name { color:#fff; font-weight:600; font-size:1rem; }
        .complex-card__count { color:#5a7a60; font-size:0.8rem; }
        .complex-card__arrow { color:#5a7a60; transition:transform .2s; font-size:0.8rem; }
        .complex-card.open .complex-card__arrow { transform:rotate(90deg); }
        .complex-card__lessons { display:none; border-top:1px solid #1e2e22; }
        .complex-card.open .complex-card__lessons { display:block; }
        .complex-lesson { display:flex; align-items:center; gap:0.75rem; padding:0.75rem 1.2rem; border-bottom:1px solid #151f18; text-decoration:none; color:#ccc; transition:background .1s; }
        .complex-lesson:last-child { border-bottom:none; }
        .complex-lesson:hover { background:#1a2a1e; }
        .complex-lesson__num { color:#5a7a60; font-weight:600; font-size:0.85rem; min-width:1.5rem; }
        .complex-lesson__title { flex:1; font-size:0.9rem; }
        .complex-lesson__duration { color:#5a7a60; font-size:0.8rem; }
        .complex-lesson__play { color:#1a5e2a; font-size:1.1rem; }
        .all-lessons { max-width:800px; margin:1.5rem auto; padding:0 1rem 3rem; }
        .all-lessons__title { color:#7acc8a; font-size:0.9rem; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:1rem; padding-left:0.25rem; }
        .lesson-row { display:flex; align-items:center; gap:0.75rem; padding:0.75rem 1rem; background:#111a14; border:1px solid #1e2e22; border-radius:8px; margin-bottom:0.5rem; text-decoration:none; color:#ccc; transition:all .1s; }
        .lesson-row:hover { background:#1a2a1e; border-color:#2a5a30; }
        .lesson-row__num { color:#5a7a60; font-weight:600; min-width:1.8rem; text-align:center; }
        .lesson-row__info { flex:1; }
        .lesson-row__name { color:#fff; font-size:0.95rem; }
        .lesson-row__meta { color:#5a7a60; font-size:0.8rem; }
        .lesson-row__play { color:#1a5e2a; font-size:1.1rem; }
        .lessons-empty { text-align:center; padding:3rem 1rem; color:#5a7a60; }
        .lessons-empty__icon { font-size:2rem; margin-bottom:0.5rem; }
        @media (max-width:768px) {
            .lessons-hero { padding:1.5rem 1rem; }
            .lessons-hero__title { font-size:1.2rem; }
        }
    </style>
</head>
<body>
    <noscript><div style="padding:2rem;text-align:center;color:#e0e0e0;background:#0a0f0c;min-height:100vh;font-family:sans-serif;"><h1>Цигун</h1><p>Для работы приложения необходим JavaScript.</p><a href="/" style="color:#7acc8a;">На главную</a></div></noscript>
    <div class="lessons-page" id="lessons-root"></div>
    <script>
    (function() {
        const root = document.getElementById('lessons-root');
        function esc(s) { if (s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
        function localDateStr(d) { const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return y+'-'+m+'-'+day; }

        async function api(path) {
            const token = localStorage.getItem('user_token') || localStorage.getItem('admin_token');
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = 'Bearer ' + token;
            const res = await fetch(path, { headers });
            if (!res.ok) throw new Error('API error ' + res.status);
            return res.json();
        }

        const complexIcons = { 'Основной комплекс': '🧘', 'Утренняя разминка': '🌅', 'Здоровая шея': '💆', 'Крепкая спина': '🦴', 'Суставы и гибкость': '🤸' };

        async function load() {
            const token = localStorage.getItem('user_token');
            if (!token) {
                root.innerHTML = renderHeader() + '<div class="lessons-empty"><div class="lessons-empty__icon">🧘</div><p>Войдите, чтобы начать занятия</p><p style="color:#5a7a60;margin:0.3rem 0 1rem;">Бесплатно — 7 занятий без карты</p><a href="login.html" class="btn btn--primary" style="margin-top:0.5rem;display:inline-block;">Войти</a></div>';
                return;
            }
            try {
                const meRes = await fetch('/api/user/me', { headers: { 'Authorization': 'Bearer ' + token } });
                if (meRes.ok) {
                    const me = await meRes.json();
                    if (me.plan === 'trial' && (me.free_sessions_used || 0) >= 7) {
                        root.innerHTML = renderHeader() + '<div class="lessons-empty"><div class="lessons-empty__icon">⏰</div><p>Пробный период завершён</p><p style="color:#5a7a60;margin:0.5rem 0 1rem;">Вы просмотрели все 7 бесплатных занятий</p><a href="plans.html" class="btn btn--primary" style="margin-top:0.5rem;display:inline-block;">Выбрать план</a></div>';
                        return;
                    }
                }
            } catch(e) {}
            try {
                const [lessons, complexes, schedule] = await Promise.all([
                    api('/api/lessons'),
                    api('/api/complexes'),
                    api('/api/schedule'),
                ]);

                const today = new Date();
                const todayStr = localDateStr(today);
                let todayLesson = null;
                let todaySchedule = schedule.find(s => s.date === todayStr);
                if (todaySchedule && todaySchedule.lesson_id) {
                    todayLesson = lessons.find(l => l.id == todaySchedule.lesson_id);
                }
                if (!todayLesson && lessons.length) todayLesson = lessons[0];

                const groupedLessons = {};
                complexes.forEach(c => { groupedLessons[c.id] = { complex: c, lessons: [] }; });
                lessons.forEach(l => {
                    if (l.complex_id && groupedLessons[l.complex_id]) {
                        groupedLessons[l.complex_id].lessons.push(l);
                    }
                });
                const orphans = lessons.filter(l => !l.complex_id || !groupedLessons[l.complex_id]);

                let html = renderHeader();
                html += renderHero();
                if (todayLesson) html += renderToday(todayLesson);
                html += renderComplexes(groupedLessons);
                if (orphans.length) html += renderOrphans(orphans, complexes);
                html += renderAllLessons(lessons, complexes);

                root.innerHTML = html;
                bindEvents();
            } catch(err) {
                root.innerHTML = renderHeader() + '<div class="lessons-empty"><div class="lessons-empty__icon">⚠️</div><p>Ошибка загрузки: ' + esc(err.message) + '</p><a href="/" style="color:#7acc8a;">На главную</a></div>';
            }
        }

        function renderHeader() {
            var token = localStorage.getItem('user_token');
            var profileLink = token ? '<a href="profile.html" style="color:#7acc8a;text-decoration:none;font-size:.85rem;margin-left:0.75rem">👤</a>' : '';
            return '<div class="lessons-header">' +
                '<a href="/" class="lessons-header__back">← На главную</a>' +
                '<div class="lessons-header__title">Занятия</div>' +
                '<a href="calendar.html" style="color:#7acc8a;text-decoration:none;font-size:.85rem;margin-left:auto">📅 Календарь</a>' +
                '<a href="picker.html" style="color:#7acc8a;text-decoration:none;font-size:.85rem;margin-left:0.75rem">🔍 Подобрать</a>' +
                profileLink +
                '</div>';
        }

        function renderHero() {
            return '<div class="lessons-hero">' +
                '<div class="lessons-hero__icon">🧘</div>' +
                '<div class="lessons-hero__title">Все занятия</div>' +
                '<div class="lessons-hero__sub">Выберите занятие или начните сегодняшнее</div>' +
                '</div>';
        }

        function renderToday(lesson) {
            const today = new Date();
            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            const dayName = today.toLocaleDateString('ru-RU', options);
            return '<div class="lessons-today">' +
                '<div class="lessons-today__card" onclick="window.location.href=\'player.html?id=' + lesson.id + '\'">' +
                '<div class="lessons-today__label">Сегодня — ' + esc(dayName) + '</div>' +
                '<div class="lessons-today__name">' + esc(lesson.title) + '</div>' +
                '<div class="lessons-today__meta">' +
                (lesson.duration ? '<span>⏱ ' + esc(lesson.duration) + '</span>' : '') +
                '<span>📅 По расписанию</span>' +
                '</div>' +
                '<button class="lessons-today__play"><svg viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg> Начать занятие</button>' +
                '</div></div>';
        }

        function renderComplexes(grouped) {
            let html = '<div class="lessons-section"><div class="lessons-section__title">Комплексы</div>';
            let hasComplexes = false;
            Object.values(grouped).forEach(g => {
                if (!g.lessons.length) return;
                hasComplexes = true;
                const icon = complexIcons[g.complex.name] || '🏋️';
                html += '<div class="complex-card" data-complex>' +
                    '<div class="complex-card__header" data-complex-toggle>' +
                    '<div class="complex-card__icon">' + icon + '</div>' +
                    '<div class="complex-card__info"><div class="complex-card__name">' + esc(g.complex.name) + '</div>' +
                    '<div class="complex-card__count">' + g.lessons.length + ' занятий</div></div>' +
                    '<div class="complex-card__arrow">▶</div>' +
                    '</div><div class="complex-card__lessons">';
                g.lessons.forEach((l, i) => {
                    html += '<a href="player.html?id=' + l.id + '" class="complex-lesson">' +
                        '<span class="complex-lesson__num">' + (i+1) + '</span>' +
                        '<span class="complex-lesson__title">' + esc(l.title) + '</span>' +
                        (l.duration ? '<span class="complex-lesson__duration">' + esc(l.duration) + '</span>' : '') +
                        '<span class="complex-lesson__play">▶</span>' +
                        '</a>';
                });
                html += '</div></div>';
            });
            if (!hasComplexes) html += '<p style="color:#5a7a60;padding:0.5rem;">Комплексы пока не созданы</p>';
            html += '</div>';
            return html;
        }

        function renderOrphans(orphans, complexes) {
            let html = '<div class="all-lessons"><div class="all-lessons__title">Другие занятия</div>';
            orphans.forEach((l, i) => {
                const complex = complexes.find(c => c.id == l.complex_id);
                html += '<a href="player.html?id=' + l.id + '" class="lesson-row">' +
                    '<span class="lesson-row__num">' + (i+1) + '</span>' +
                    '<div class="lesson-row__info"><div class="lesson-row__name">' + esc(l.title) + '</div>' +
                    '<div class="lesson-row__meta">' + (complex ? esc(complex.name) : '') + (l.duration ? ' · ' + esc(l.duration) : '') + '</div></div>' +
                    '<span class="lesson-row__play">▶</span></a>';
            });
            html += '</div>';
            return html;
        }

        function renderAllLessons(lessons, complexes) {
            let html = '<div class="all-lessons"><div class="all-lessons__title">Все занятия (' + lessons.length + ')</div>';
            lessons.forEach((l, i) => {
                const complex = complexes.find(c => c.id == l.complex_id);
                html += '<a href="player.html?id=' + l.id + '" class="lesson-row">' +
                    '<span class="lesson-row__num">' + (i+1) + '</span>' +
                    '<div class="lesson-row__info"><div class="lesson-row__name">' + esc(l.title) + '</div>' +
                    '<div class="lesson-row__meta">' + (complex ? esc(complex.name) : 'Без комплекса') + (l.duration ? ' · ' + esc(l.duration) : '') + '</div></div>' +
                    '<span class="lesson-row__play">▶</span></a>';
            });
            html += '</div>';
            return html;
        }

        function bindEvents() {
            document.querySelectorAll('[data-complex-toggle]').forEach(el => {
                el.addEventListener('click', function() {
                    this.closest('[data-complex]').classList.toggle('open');
                });
            });
        }

        load();
    })();
    </script>
</body>
</html>
