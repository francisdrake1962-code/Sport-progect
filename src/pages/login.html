<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <title>Вход — Цигун и суставная разминка</title>
    <link rel="stylesheet" href="styles/main.css">
    <style>
        .auth-page { min-height:100vh; background:linear-gradient(135deg,#0a0f0c 0%,#1a3a20 100%); display:flex; align-items:center; justify-content:center; padding:1rem; }
        .auth-card { background:#111a14; border:1px solid #2a3a2e; border-radius:16px; padding:2.5rem; width:100%; max-width:420px; }
        .auth-card__logo { text-align:center; margin-bottom:1.5rem; }
        .auth-card__logo img { width:80px; height:auto; }
        .auth-card__title { color:#fff; font-size:1.4rem; font-weight:700; text-align:center; margin-bottom:0.3rem; }
        .auth-card__sub { color:#7a9a80; text-align:center; font-size:0.9rem; margin-bottom:1.5rem; }
        .auth-tabs { display:flex; gap:0; margin-bottom:1.5rem; background:#0d1a10; border-radius:8px; overflow:hidden; }
        .auth-tab { flex:1; padding:0.6rem; text-align:center; cursor:pointer; color:#7a9a80; font-size:0.9rem; font-weight:500; border:none; background:none; transition:all .15s; }
        .auth-tab.active { background:#1a5e2a; color:#fff; }
        .form-group { margin-bottom:1rem; }
        .form-group label { display:block; color:#9fc5a8; font-size:0.85rem; margin-bottom:0.3rem; }
        .form-group input { width:100%; padding:0.7rem 0.9rem; background:#0d1a10; border:1px solid #2a3a2e; border-radius:8px; color:#fff; font-size:0.95rem; outline:none; transition:border-color .15s; }
        .form-group input:focus { border-color:#1a5e2a; }
        .auth-btn { width:100%; padding:0.8rem; background:#1a5e2a; color:#fff; border:none; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .15s; margin-top:0.5rem; }
        .auth-btn:hover { background:#228b33; }
        .auth-btn:disabled { opacity:0.5; cursor:not-allowed; }
        .auth-error { color:#e55; font-size:0.85rem; margin-top:0.5rem; text-align:center; display:none; }
        .auth-success { color:#5a5; font-size:0.85rem; margin-top:0.5rem; text-align:center; display:none; }
        .auth-link { text-align:center; margin-top:1rem; }
        .auth-link a { color:#7acc8a; text-decoration:none; font-size:0.85rem; }
        .auth-link a:hover { color:#fff; }
        .auth-back { text-align:center; margin-top:1.5rem; }
        .auth-back a { color:#5a7a60; text-decoration:none; font-size:0.85rem; }
        .auth-back a:hover { color:#9fc5a8; }
        .auth-divider { text-align:center; color:#5a7a60; font-size:0.8rem; margin:1rem 0; }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-card__logo"><img src="images/logo.svg" alt="Логотип"></div>
            <div class="auth-card__title" id="card-title">Вход</div>
            <div class="auth-card__sub" id="card-sub">Войдите, чтобы начать занятия</div>

            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Вход</button>
                <button class="auth-tab" data-tab="register">Регистрация</button>
            </div>

            <form id="login-form">
                <div class="form-group"><label for="login-email">Email</label><input type="email" id="login-email" required autocomplete="email"></div>
                <div class="form-group"><label for="login-password">Пароль</label><input type="password" id="login-password" required autocomplete="current-password"></div>
                <div class="auth-error" id="login-error"></div>
                <button type="submit" class="auth-btn" id="login-btn">Войти</button>
            </form>

            <form id="register-form" style="display:none;">
                <div class="form-group"><label for="reg-name">Имя</label><input type="text" id="reg-name" required autocomplete="name"></div>
                <div class="form-group"><label for="reg-email">Email</label><input type="email" id="reg-email" required autocomplete="email"></div>
                <div class="form-group"><label for="reg-password">Пароль (минимум 8 символов)</label><input type="password" id="reg-password" required minlength="8" autocomplete="new-password"></div>
                <div class="form-group"><label for="reg-password2">Повторите пароль</label><input type="password" id="reg-password2" required minlength="8" autocomplete="new-password"></div>
                <div class="auth-error" id="reg-error"></div>
                <div class="auth-success" id="reg-success"></div>
                <button type="submit" class="auth-btn" id="reg-btn">Зарегистрироваться</button>
            </form>

            <div class="auth-back"><a href="/">← На главную</a></div>
        </div>
    </div>
    <script>
    (function() {
        function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        const tabs = document.querySelectorAll('[data-tab]');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const loginError = document.getElementById('login-error');
        const regError = document.getElementById('reg-error');
        const regSuccess = document.getElementById('reg-success');

        const urlTab = new URLSearchParams(window.location.search).get('tab');
        if (urlTab === 'register') {
            document.querySelector('[data-tab="register"]').click();
        }

        tabs.forEach(tab => {
            tab.addEventListener('click', function() {
                tabs.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                const isLogin = this.dataset.tab === 'login';
                loginForm.style.display = isLogin ? 'block' : 'none';
                registerForm.style.display = isLogin ? 'none' : 'block';
                loginError.style.display = 'none';
                regError.style.display = 'none';
                regSuccess.style.display = 'none';
            });
        });

        function generateFingerprint() {
            var components = [
                navigator.userAgent,
                screen.width + 'x' + screen.height,
                screen.colorDepth,
                new Date().getTimezoneOffset(),
                navigator.language,
                navigator.platform,
                navigator.hardwareConcurrency || '',
                navigator.maxTouchPoints || 0
            ];
            var hash = 5381;
            var str = components.join('|||');
            for (var i = 0; i < str.length; i++) {
                hash = ((hash << 5) + hash) + str.charCodeAt(i);
                hash |= 0;
            }
            return 'fp_' + Math.abs(hash).toString(36);
        }

        function sendFingerprint(token) {
            var fp = generateFingerprint();
            fetch('/api/user/fingerprint', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ fingerprint: fp })
            }).then(function(r) { return r.json(); }).then(function(d) {
                if (d.accountsFromThisDevice > 1) {
                    console.warn('[anti-abuse] Multiple accounts on this device:', d.accountsFromThisDevice);
                }
            }).catch(function() {});
        }

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            loginError.style.display = 'none';
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');
            btn.disabled = true; btn.textContent = 'Вход...';
            let responseData = null;
            try {
                const res = await fetch('/api/user/login', {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ email, password })
                });
                responseData = await res.json();
                if (!res.ok) throw new Error(responseData.error && responseData.error.code ? responseData.error.code : (responseData.error || 'Login failed'));
                localStorage.setItem('user_token', responseData.token);
                localStorage.setItem('user_data', JSON.stringify(responseData.user));
                sendFingerprint(responseData.token);
                try {
                    const obRes = await fetch('/api/user/onboarding', { headers: { 'Authorization': 'Bearer ' + responseData.token } });
                    const obData = await obRes.json();
                    if (!obData.completed) { window.location.href = 'onboarding.html'; return; }
                } catch(_) {}
                window.location.href = 'dashboard.html';
            } catch(err) {
                if (err.message === 'EMAIL_CONFIRMATION_REQUIRED' || err.message === 'EMAIL_NOT_CONFIRMED') {
                    let html = 'Email не подтверждён. Проверьте почту. <button id="resend-btn" style="background:none;border:none;color:#7acc8a;cursor:pointer;text-decoration:underline;font-size:0.85rem;">Отправить письмо повторно</button>';
                    loginError.innerHTML = html;
                    loginError.style.display = 'block';
                    document.getElementById('resend-btn').addEventListener('click', async function() {
                        this.disabled = true; this.textContent = 'Отправка...';
                        try {
                            await fetch('/api/user/confirm/resend', {
                                method: 'POST', headers: {'Content-Type':'application/json'},
                                body: JSON.stringify({ email: email })
                            });
                            this.textContent = 'Письмо отправлено!';
                        } catch(_) { this.textContent = 'Ошибка отправки'; }
                    });
                } else {
                    loginError.textContent = err.message;
                    loginError.style.display = 'block';
                }
            } finally {
                btn.disabled = false; btn.textContent = 'Войти';
            }
        });

        registerForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            regError.style.display = 'none';
            regSuccess.style.display = 'none';
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const password2 = document.getElementById('reg-password2').value;
            if (password !== password2) {
                regError.textContent = 'Пароли не совпадают';
                regError.style.display = 'block';
                return;
            }
            const btn = document.getElementById('reg-btn');
            btn.disabled = true; btn.textContent = 'Регистрация...';
            try {
                var fpAtReg = generateFingerprint();
                const res = await fetch('/api/user/register', {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ name, email, password, fingerprint: fpAtReg })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Registration failed');
                regSuccess.innerHTML = 'Письмо отправлено! Проверьте почту <b>' + escHtml(email) + '</b> и перейдите по ссылке для подтверждения.';
                if (data.confirmation_token && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
                    regSuccess.innerHTML += '<br><a href="/confirm/' + escHtml(data.confirmation_token) + '" style="color:#7acc8a;display:inline-block;margin-top:0.5rem;">Подтвердить email (dev)</a>';
                }
                if (data.deviceWarning) {
                    regSuccess.innerHTML += '<div style="margin-top:0.5rem;padding:0.5rem;background:#2a2a1a;border:1px solid #5a5a2e;border-radius:6px;color:#e0d070;font-size:0.85rem;">' + escHtml(data.deviceWarning) + '</div>';
                }
                regSuccess.style.display = 'block';
                registerForm.reset();
            } catch(err) {
                regError.textContent = err.message;
                regError.style.display = 'block';
            } finally {
                btn.disabled = false; btn.textContent = 'Зарегистрироваться';
            }
        });
    })();
    </script>
</body>
</html>
