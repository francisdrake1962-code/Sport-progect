<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <title>Статус оплаты — Цигун</title>
    
    <style>
        .payment{min-height:100vh;background:#faf7f2;color:#2b2721;padding:2rem 1rem;display:flex;align-items:center;justify-content:center}
        .payment-card{background:#ffffff;border:1px solid #e3d8c3;border-radius:16px;padding:2.5rem;max-width:440px;width:100%;text-align:center}
        .payment-card__icon{font-size:3rem;margin-bottom:1rem}
        .payment-card__title{color:#2b2721;font-size:1.3rem;font-weight:700;margin-bottom:.5rem}
        .payment-card__desc{color:#8f8578;font-size:.9rem;margin-bottom:1.5rem;line-height:1.5}
        .payment-card__details{background:#f1ece2;border:1px solid #f1ece2;border-radius:8px;padding:1rem;margin-bottom:1.5rem;text-align:left}
        .payment-card__row{display:flex;justify-content:space-between;padding:.35rem 0;border-bottom:1px solid #f1ece2}
        .payment-card__row:last-child{border-bottom:none}
        .payment-card__label{color:#7c6f5d;font-size:.8rem}
        .payment-card__value{color:#2b2721;font-size:.85rem}
        .payment-card__value--success{color:#8a6f52}
        .payment-card__value--pending{color:#b09350}
        .payment-card__value--error{color:#a9763a}
        .payment-btn{display:inline-block;padding:.7rem 2rem;border-radius:8px;text-decoration:none;font-size:.9rem;font-weight:600;cursor:pointer;border:none;transition:background .15s}
        .payment-btn--primary{background:#8a6f52;color:#f5efe4}
        .payment-btn--primary:hover{background:#a07f58}
        .payment-btn--outline{background:transparent;color:#8a6f52;border:1px solid #d8cbb2}
        .payment-btn--outline:hover{background:#f1ece2}
        .spinner{display:inline-block;width:24px;height:24px;border:3px solid #e3d8c3;border-top-color:#8a6f52;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:1rem}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <noscript><div style="padding:2rem;text-align:center;color:#2b2721;background:#faf7f2;min-height:100vh;font-family:sans-serif;"><h1>Цигун</h1><p>Для работы необходим JavaScript.</p><a href="/" style="color:#8a6f52;">На главную</a></div></noscript>
    <div class="payment" id="app">
        <div class="payment-card" id="card">
            <div class="spinner"></div>
            <div class="payment-card__title">Проверяем статус оплаты...</div>
            <div class="payment-card__desc">Пожалуйста, подождите.</div>
        </div>
    </div>
    <script>
    (function() {
        var token = localStorage.getItem('user_token');
        if (!token) { window.location.href = 'login.html'; return; }

        var params = new URLSearchParams(window.location.search);
        var sessionId = params.get('session_id');
        var card = document.getElementById('card');

        function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        function fmtDate(d) {
            if (!d) return '—';
            var dt = new Date(d);
            return dt.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        function showError(msg) {
            card.innerHTML = '<div class="payment-card__icon">\u26A0\uFE0F</div>' +
                '<div class="payment-card__title">Ошибка</div>' +
                '<div class="payment-card__desc">' + esc(msg) + '</div>' +
                '<a href="/dashboard" class="payment-btn payment-btn--primary" style="margin-top:1rem;">На главную</a>';
        }

        function showPending() {
            card.innerHTML = '<div class="payment-card__icon">\u23F3</div>' +
                '<div class="payment-card__title">Платёж обрабатывается</div>' +
                '<div class="payment-card__desc">Ваш платёж ещё не подтверждён. Это может занять несколько минут. Мы проверим статус автоматически.</div>' +
                '<div class="payment-card__details">' +
                (sessionId ? '<div class="payment-card__row"><span class="payment-card__label">ID сессии</span><span class="payment-card__value">' + esc(sessionId.substring(0, 20)) + '...</span></div>' : '') +
                '</div>' +
                '<button class="payment-btn payment-btn--primary" onclick="checkStatus()" style="margin-right:.5rem;">Проверить снова</button>' +
                '<a href="/dashboard" class="payment-btn payment-btn--outline">На главную</a>';
        }

        function showActive(sub) {
            card.innerHTML = '<div class="payment-card__icon">\u2705</div>' +
                '<div class="payment-card__title">Подписка активна!</div>' +
                '<div class="payment-card__desc">Оплата прошла успешно. Теперь у вас полный доступ ко всем занятиям.</div>' +
                '<div class="payment-card__details">' +
                '<div class="payment-card__row"><span class="payment-card__label">План</span><span class="payment-card__value">' + esc(sub.plan === 'annual' ? 'Годовая' : 'Ежемесячная') + '</span></div>' +
                '<div class="payment-card__row"><span class="payment-card__label">Действует до</span><span class="payment-card__value payment-card__value--success">' + fmtDate(sub.expires_at) + '</span></div>' +
                '</div>' +
                '<a href="/lessons" class="payment-btn payment-btn--primary">Начать заниматься</a>';
        }

        function showAlreadyActive(sub) {
            card.innerHTML = '<div class="payment-card__icon">\u2705</div>' +
                '<div class="payment-card__title">Подписка уже активна</div>' +
                '<div class="payment-card__desc">Ваша подписка уже активна и действует.</div>' +
                '<div class="payment-card__details">' +
                '<div class="payment-card__row"><span class="payment-card__label">План</span><span class="payment-card__value">' + esc(sub.plan === 'annual' ? 'Годовая' : 'Ежемесячная') + '</span></div>' +
                '<div class="payment-card__row"><span class="payment-card__label">Действует до</span><span class="payment-card__value payment-card__value--success">' + fmtDate(sub.expires_at) + '</span></div>' +
                '</div>' +
                '<a href="/lessons" class="payment-btn payment-btn--primary">Начать заниматься</a>';
        }

        function checkStatus() {
            card.innerHTML = '<div class="spinner"></div><div class="payment-card__title">Проверяем...</div>';
            fetch('/api/payment/subscription', { headers: { 'Authorization': 'Bearer ' + token } })
                .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(function(sub) {
                    if (sub.active && (sub.plan === 'annual' || sub.plan === 'monthly')) {
                        if (sessionId) {
                            showActive(sub);
                        } else {
                            showAlreadyActive(sub);
                        }
                    } else {
                        if (sessionId) {
                            showPending();
                        } else {
                            showError('Подписка не активна. Оформите подписку на странице тарифов.');
                        }
                    }
                })
                .catch(function() {
                    if (sessionId) {
                        showPending();
                    } else {
                        showError('Не удалось загрузить статус подписки. Попробуйте позже.');
                    }
                });
        }

        checkStatus();
    })();
    </script>
</body>
</html>
