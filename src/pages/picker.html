<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <title>Подобрать занятие — Цигун</title>
    
    <style>
        .filter-page { min-height:100vh; background:#faf7f2; color:#2b2721; padding:1rem; }
        .filter-header { display:flex; align-items:center; gap:1rem; margin-bottom:1.5rem; flex-wrap:wrap; }
        .filter-header__back { color:#8a6f52; text-decoration:none; font-size:0.95rem; }
        .filter-header__back:hover { color:#2b2721; }
        .filter-header h1 { color:#2b2721; font-size:1.4rem; font-weight:700; margin:0; }
        .filter-section { margin-bottom:1.5rem; }
        .filter-section__title { color:#8a6f52; font-size:0.85rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:0.75rem; }
        .filter-section__hint { color:#a2937f; font-size:0.8rem; margin:-0.5rem 0 0.75rem; }
        .filter-chips { display:flex; flex-wrap:wrap; gap:0.5rem; }
        .filter-chip { padding:0.5rem 1rem; border-radius:20px; border:1px solid #e3d8c3; background:#ffffff; color:#8a6f52; font-size:0.85rem; cursor:pointer; transition:all .15s; }
        .filter-chip:hover { border-color:#8a6f52; color:#2b2721; }
        .filter-chip--active { background:#8a6f52;color:#f5efe4; border-color:#8a6f52; }
        .lessons-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1rem; }
        .lesson-card { background:#ffffff; border:1px solid #e3d8c3; border-radius:12px; padding:1.25rem; transition:transform .15s, box-shadow .15s; cursor:pointer; }
        .lesson-card:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(138,111,82,0.15); }
        .lesson-card__title { color:#2b2721; font-size:1rem; font-weight:600; margin-bottom:0.5rem; }
        .lesson-card__meta { color:#7c6f5d; font-size:0.8rem; margin-bottom:0.75rem; }
        .lesson-card__tags { display:flex; flex-wrap:wrap; gap:0.35rem; margin-bottom:0.75rem; }
        .lesson-card__tag { padding:0.2rem 0.6rem; border-radius:12px; background:#f1ece2; color:#8a6f52; font-size:0.7rem; }
        .lesson-card__tag--zone { background:#ede6d8; color:#6b5a43; }
        .lesson-card__tag--mood { background:#e2e7d8; color:#4f5f3a; }
        .lesson-card__feats { display:flex; flex-wrap:wrap; gap:0.35rem; align-items:center; margin-bottom:0.6rem; }
        .lesson-card__feat-label { color:#a2937f; font-size:0.7rem; }
        .lesson-card__btn { display:inline-block; padding:0.5rem 1.2rem; border-radius:6px; font-size:0.85rem; font-weight:600; text-decoration:none; border:none; cursor:pointer; }
        .lesson-card__btn--play { background:#8a6f52;color:#f5efe4; }
        .lesson-card__btn--play:hover { background:#a07f58; }
        .lesson-card__btn--locked { background:#ece4d4; color:#8a8072; cursor:default; }
        .lesson-card__free { display:inline-block; padding:0.15rem 0.5rem; border-radius:4px; background:#8a6f52;color:#f5efe4; font-size:0.7rem; font-weight:600; margin-left:0.5rem; }
        .empty-state { text-align:center; padding:3rem 1rem; color:#7c6f5d; }
        .empty-state__icon { font-size:2rem; margin-bottom:0.5rem; }
        .duration-slider { width:100%; accent-color:#8a6f52; }
        .duration-label { color:#8a6f52; font-size:0.85rem; }
        @media (max-width:768px) { .lessons-grid { grid-template-columns:1fr; } }
    </style>
</head>
<body>
    <noscript><div style="padding:2rem;text-align:center;color:#2b2721;background:#faf7f2;min-height:100vh;font-family:sans-serif;"><h1>Цигун</h1><p>Для подбора занятий необходим JavaScript.</p><a href="/" style="color:#8a6f52;">На главную</a></div></noscript>
    <div class="filter-page" id="app">
        <div class="filter-header">
            <a href="lessons.html" class="filter-header__back">← Назад</a>
            <h1>Подобрать занятие</h1>
            <a href="profile.html" id="profile-link" style="color:#8a6f52;text-decoration:none;display:flex;align-items:center;gap:0.35rem;margin-left:auto"><span style="font-size:1.5rem;line-height:1;">👤</span></a>
        </div>
        <div class="filter-section">
            <div class="filter-section__title">Зона тела</div>
            <div class="filter-section__hint">Выберите, с какой зоной тела хотите поработать</div>
            <div class="filter-chips" id="zone-chips"></div>
        </div>
        <div class="filter-section">
            <div class="filter-section__title">Самочувствие после занятия</div>
            <div class="filter-section__hint">Каким хотите себя чувствовать по завершении — бодрым, спокойным, в балансе</div>
            <div class="filter-chips" id="mood-chips"></div>
        </div>
        <div class="filter-section">
            <div class="filter-section__title">Длительность: до <span id="dur-val">60</span> мин</div>
            <input type="range" class="duration-slider" id="dur-slider" min="10" max="60" value="60" step="5">
        </div>
        <div id="lessons-container"></div>
    </div>
    <script>
    (function() {
        try {
            var ud = JSON.parse(localStorage.getItem('user_data'));
            if (ud && ud.name) {
                var pl = document.getElementById('profile-link');
                if (pl) pl.innerHTML = '<span style="font-size:1.5rem;line-height:1;">👤</span><span style="font-size:0.8rem;font-weight:600;">' + esc(ud.name.split(' ')[0]) + '</span>';
            }
        } catch(e) {}
        var ZONES = [
            { id: 'шея', label: 'Шея' },
            { id: 'плечи_руки', label: 'Плечи / Руки' },
            { id: 'грудной_отдел', label: 'Грудной отдел' },
            { id: 'поясница', label: 'Поясница' },
            { id: 'спина_осанка', label: 'Спина / Осанка' },
            { id: 'колени', label: 'Колени' },
            { id: 'ноги_таз', label: 'Ноги / Таз' },
            { id: 'баланс_общее', label: 'Баланс / Общее' },
        ];
        var MOODS = [
            { id: 'энергия', label: 'Взбодриться' },
            { id: 'снятие стресса', label: 'Успокоиться' },
            { id: 'баланс', label: 'Баланс' },
            { id: 'поток', label: 'Поток / Ощущения' },
        ];
        var token = localStorage.getItem('user_token');
        var activeZones = {};
        var activeMoods = {};
        var urlParams = new URLSearchParams(window.location.search);
        (urlParams.get('zone') || '').split(',').map(function(s){return s.trim();}).filter(Boolean).forEach(function(z){ activeZones[z] = true; });
        (urlParams.get('mood') || '').split(',').map(function(s){return s.trim();}).filter(Boolean).forEach(function(m){ activeMoods[m] = true; });

        function renderChips(containerId, items, activeMap) {
            var el = document.getElementById(containerId);
            el.innerHTML = items.map(function(item) {
                var active = activeMap[item.id] ? ' filter-chip--active' : '';
                return '<button class="filter-chip' + active + '" data-id="' + item.id + '">' + item.label + '</button>';
            }).join('');
            el.querySelectorAll('.filter-chip').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var id = btn.getAttribute('data-id');
                    if (activeMap[id]) delete activeMap[id]; else activeMap[id] = true;
                    renderChips(containerId, items, activeMap);
                    applyFilters();
                });
            });
        }

        function renderLessons(lessons) {
            var container = document.getElementById('lessons-container');
            if (!lessons.length) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state__icon">🔍</div><div>Нет занятий по выбранным фильтрам</div></div>';
                return;
            }
            container.innerHTML = '<div class="lessons-grid">' + lessons.map(function(l) {
                var tagsHtml = (l.tags || []).map(function(t) { return '<span class="lesson-card__tag">' + esc(t) + '</span>'; }).join('');
                var zoneLabels = (l.zones || []).map(function(z) {
                    var found = ZONES.find(function(x) { return x.id === z; });
                    return '<span class="lesson-card__tag lesson-card__tag--zone">' + esc(found ? found.label : z) + '</span>';
                }).join('');
                var moodLabels = (l.moods || []).map(function(m) {
                    var found = MOODS.find(function(x) { return x.id === m; });
                    return '<span class="lesson-card__tag lesson-card__tag--mood">' + esc(found ? found.label : m) + '</span>';
                }).join('');
                var featsHtml = (zoneLabels || moodLabels)
                    ? '<div class="lesson-card__feats">' + (zoneLabels ? '<span class="lesson-card__feat-label">Зона:</span> ' + zoneLabels : '') + (moodLabels ? '<span class="lesson-card__feat-label" style="margin-left:.4rem">Эффект:</span> ' + moodLabels : '') + '</div>'
                    : '';
                var btnClass = l.accessible ? 'lesson-card__btn lesson-card__btn--play' : 'lesson-card__btn lesson-card__btn--locked';
                var btnText = l.accessible ? 'Смотреть' : 'Подписка';
                var freeBadge = l.is_free ? '<span class="lesson-card__free">Бесплатно</span>' : '';
                return '<div class="lesson-card" data-id="' + l.id + '">' +
                    '<div class="lesson-card__title">' + esc(l.title) + freeBadge + '</div>' +
                    '<div class="lesson-card__meta">' + l.duration + ' мин</div>' +
                    featsHtml +
                    '<div class="lesson-card__tags">' + tagsHtml + '</div>' +
                    '<button class="' + btnClass + '" data-lid="' + l.id + '">' + btnText + '</button>' +
                '</div>';
            }).join('') + '</div>';
            container.querySelectorAll('.lesson-card__btn--play').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    window.location.href = 'player.html?id=' + btn.getAttribute('data-lid');
                });
            });
        }

        function applyFilters() {
            var params = [];
            var zoneKeys = Object.keys(activeZones);
            if (zoneKeys.length) params.push('zone=' + encodeURIComponent(zoneKeys.join(',')));
            var moodKeys = Object.keys(activeMoods);
            if (moodKeys.length) params.push('mood=' + encodeURIComponent(moodKeys.join(',')));
            var maxDur = parseInt(document.getElementById('dur-slider').value, 10);
            if (maxDur < 60) params.push('duration=' + maxDur);
            var url = '/api/user/lessons-filter' + (params.length ? '?' + params.join('&') : '');
            fetch(url, { headers: { 'Authorization': 'Bearer ' + token } })
                .then(function(r) { if (!r.ok) throw new Error('Auth'); return r.json(); })
                .then(function(data) { renderLessons(data); })
                .catch(function() {});
        }

        function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

        if (!token) { window.location.href = 'login.html'; return; }
        fetch('/api/lesson-features')
            .then(function(r) { return r.ok ? r.json() : null; })
            .then(function(f) {
                if (f && Array.isArray(f.zones) && f.zones.length) ZONES = f.zones;
                if (f && Array.isArray(f.moods) && f.moods.length) MOODS = f.moods;
                renderChips('zone-chips', ZONES, activeZones);
                renderChips('mood-chips', MOODS, activeMoods);
            })
            .catch(function() {
                renderChips('zone-chips', ZONES, activeZones);
                renderChips('mood-chips', MOODS, activeMoods);
            });

        document.getElementById('dur-slider').addEventListener('input', function() {
            document.getElementById('dur-val').textContent = this.value;
            applyFilters();
        });

        applyFilters();
    })();
    </script>
</body>
</html>
