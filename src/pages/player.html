<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <title>Занятие — Цигун и суставная разминка</title>
    
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.16"></script>
    <style>
        .player-page { min-height:100vh; background:#faf7f2; color:#2b2721; display:flex; flex-direction:column; }
        .player-header { background:#ffffff; padding:0.75rem 1.5rem; display:flex; align-items:center; gap:1rem; border-bottom:1px solid #e3d8c3; }
        .player-header__back { color:#8a6f52; text-decoration:none; font-size:0.95rem; display:flex; align-items:center; gap:0.4rem; }
        .player-header__back:hover { color:#2b2721; }
        .player-header__title { color:#2b2721; font-size:1rem; font-weight:500; flex:1; text-align:center; }
        .player-header__badge { background:#8a6f52;color:#f5efe4; padding:0.2rem 0.6rem; border-radius:999px; font-size:0.75rem; font-weight:600; }
        .player-wrap { position:relative; width:100%; max-width:960px; margin:0 auto; background:#000; aspect-ratio:16/9; flex-shrink:0; }
        .player-wrap video { width:100%; height:100%; display:block; }
        .player-wrap__overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.4); cursor:pointer; transition:opacity .2s; }
        .player-wrap__overlay.hidden { opacity:0; pointer-events:none; }
        .player-wrap__play-btn { width:80px; height:80px; background:rgba(138,111,82,0.95); border:none; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .15s; box-shadow:0 4px 24px rgba(0,0,0,0.5); }
        .player-wrap__play-btn:hover { transform:scale(1.1); }
        .player-wrap__play-btn svg { fill:#f5efe4; width:32px; height:32px; margin-left:4px; }
        .player-controls { background:#ffffff; padding:0.5rem 1.5rem; display:flex; align-items:center; gap:0.75rem; border-bottom:1px solid #e8dcc4; }
        .player-controls button { background:none; border:none; color:#8a6f52; cursor:pointer; padding:0.3rem; display:flex; align-items:center; }
        .player-controls button:hover { color:#2b2721; }
        .player-controls button svg { width:22px; height:22px; fill:currentColor; }
        .player-volume { display:flex; align-items:center; gap:0.4rem; margin-left:0.25rem; }
        .player-volume input[type="range"] { width:80px; height:4px; -webkit-appearance:none; appearance:none; background:#e3d8c3; border-radius:2px; outline:none; cursor:pointer; }
        .player-volume input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; background:#8a6f52; border-radius:50%; cursor:pointer; }
        .player-volume input[type="range"]::-moz-range-thumb { width:14px; height:14px; background:#8a6f52; border-radius:50%; border:none; cursor:pointer; }
        .player-volume input[type="range"]::-moz-range-track { background:#e3d8c3; height:4px; border-radius:2px; }
        .player-progress { flex:1; height:4px; background:#e3d8c3; border-radius:2px; cursor:pointer; position:relative; }
        .player-progress__fill { height:100%; background:#8a6f52; border-radius:2px; width:0%; transition:width .1s linear; position:relative; }
        .player-progress__fill::after { content:''; position:absolute; right:-6px; top:-4px; width:12px; height:12px; background:#8a6f52; border-radius:50%; opacity:0; transition:opacity .15s; }
        .player-progress:hover .player-progress__fill::after { opacity:1; }
        .player-progress:hover { height:6px; }
        .player-progress__buffered { position:absolute; top:0; left:0; height:100%; background:#d8cbb2; border-radius:2px; pointer-events:none; }
        .player-progress__hover { position:absolute; bottom:100%; transform:translateX(-50%); background:#f1ece2; color:#8a6f52; padding:0.2rem 0.5rem; border-radius:4px; font-size:0.75rem; pointer-events:none; white-space:nowrap; display:none; margin-bottom:6px; }
        .player-progress:hover .player-progress__hover { display:block; }
        .player-time { color:#8f8578; font-size:0.8rem; min-width:90px; text-align:right; font-variant-numeric:tabular-nums; }
        .player-info { max-width:960px; margin:0 auto; width:100%; padding:1.5rem; flex:1; overflow-y:auto; }
        .player-info__meta { display:flex; align-items:center; gap:0.75rem; margin-bottom:1rem; flex-wrap:wrap; }
        .player-info__meta .badge { background:#f1ece2; color:#8a6f52; padding:0.2rem 0.6rem; border-radius:4px; font-size:0.75rem; }
        .player-info__title { font-size:1.5rem; font-weight:700; color:#2b2721; margin-bottom:0.5rem; }
        .player-info__desc { color:#8a6f52; line-height:1.6; margin-bottom:1.5rem; }
        .player-info__exercises { margin-bottom:1.5rem; }
        .player-info__exercises h3 { font-size:1rem; color:#8a6f52; margin-bottom:0.75rem; }
        .exercise-list { list-style:none; padding:0; }
        .exercise-list li { padding:0.6rem 0.8rem; border-bottom:1px solid #e8dcc4; display:flex; align-items:center; gap:0.6rem; color:#6f675c; font-size:0.9rem; }
        .exercise-list li .ex-num { color:#7c6f5d; font-weight:600; min-width:1.5rem; }
        .exercise-list li .ex-zone { color:#8f8578; font-size:0.8rem; margin-left:auto; }
        .player-nav { display:flex; gap:0.75rem; margin-top:1.5rem; padding-top:1rem; border-top:1px solid #e8dcc4; }
        .player-nav a { flex:1; text-align:center; padding:0.7rem 1rem; border-radius:8px; text-decoration:none; font-weight:500; transition:all .15s; }
        .player-nav__prev { background:#f1ece2; color:#8a6f52; }
        .player-nav__prev:hover { background:#e3d8c3; color:#2b2721; }
        .player-nav__next { background:#8a6f52;color:#f5efe4; }
        .player-nav__next:hover { background:#a07f58; }
        .player-nav__list { background:#f1ece2; color:#8a6f52; flex:0.4; }
        .player-nav__list:hover { background:#e3d8c3; color:#2b2721; }
        .player-empty { text-align:center; padding:4rem 1rem; }
        .player-empty__icon { font-size:3rem; margin-bottom:1rem; }
        .player-empty__title { font-size:1.3rem; color:#2b2721; margin-bottom:0.5rem; }
        .player-empty__text { color:#8f8578; margin-bottom:1.5rem; }
        .player-loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.6); z-index:5; }
        .player-loading__spinner { width:40px; height:40px; border:3px solid #e3d8c3; border-top-color:#8a6f52; border-radius:50%; animation:spin 1s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .player-error { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,0.8); z-index:6; color:#f5efe4; text-align:center; padding:2rem; }
        .player-error__icon { font-size:2.5rem; margin-bottom:1rem; }
        .player-error__msg { color:#c96a54; font-size:0.9rem; margin-bottom:1rem; }
        .player-resume { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,0.85); z-index:7; color:#f5efe4; text-align:center; padding:2rem; }
        .player-resume__icon { font-size:2.5rem; margin-bottom:1rem; }
        .player-resume__title { font-size:1.2rem; font-weight:600; margin-bottom:0.5rem; }
        .player-resume__text { color:#d3c0a4; font-size:0.9rem; margin-bottom:1.5rem; }
        .player-resume__btns { display:flex; gap:0.75rem; }
        .player-resume__btns button { padding:0.6rem 1.5rem; border:none; border-radius:8px; font-size:0.9rem; font-weight:500; cursor:pointer; transition:all .15s; }
        .player-resume__btns .btn-resume { background:#8a6f52;color:#f5efe4; }
        .player-resume__btns .btn-resume:hover { background:#a07f58; }
        .player-resume__btns .btn-start { background:#e3d8c3; color:#8a6f52; }
        .player-resume__btns .btn-start:hover { background:#d8cbb2; color:#2b2721; }
        .player-complete { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,0.85); z-index:7; color:#f5efe4; text-align:center; padding:2rem; }
        .player-complete__icon { font-size:3rem; margin-bottom:1rem; }
        .player-complete__title { font-size:1.3rem; font-weight:700; margin-bottom:0.5rem; }
        .player-complete__text { color:#d3c0a4; margin-bottom:1.5rem; }
        .player-complete__btns { display:flex; gap:0.75rem; }
        .player-complete__btns button { padding:0.6rem 1.5rem; border:none; border-radius:8px; font-size:0.9rem; font-weight:500; cursor:pointer; transition:all .15s; }
        .player-complete__btns .btn-next { background:#8a6f52;color:#f5efe4; }
        .player-complete__btns .btn-next:hover { background:#a07f58; }
        .player-complete__btns .btn-list { background:#e3d8c3; color:#8a6f52; }
        .player-complete__btns .btn-list:hover { background:#d8cbb2; color:#2b2721; }
        .player-feedback { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,0.9); z-index:8; color:#f5efe4; text-align:center; padding:2rem; }
        .player-feedback__icon { font-size:2.5rem; margin-bottom:0.75rem; }
        .player-feedback__title { font-size:1.2rem; font-weight:600; margin-bottom:0.5rem; }
        .player-feedback__text { color:#d3c0a4; font-size:0.9rem; margin-bottom:1.5rem; }
        .player-feedback__emojis { display:flex; gap:0.75rem; flex-wrap:wrap; justify-content:center; margin-bottom:1.5rem; }
        .player-feedback__emojis button { width:64px; height:64px; border:2px solid #e3d8c3; border-radius:12px; background:#ffffff; font-size:1.8rem; cursor:pointer; transition:all .15s; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.2rem; }
        .player-feedback__emojis button span { font-size:0.6rem; color:#8a6f52; }
        .player-feedback__emojis button:hover { border-color:#8a6f52; transform:scale(1.1); background:#f1ece2; }
        .player-feedback__emojis button.selected { border-color:#8a6f52; background:#f1ece2; }
        .player-feedback__skip { background:none; border:none; color:#8f8578; cursor:pointer; font-size:0.85rem; text-decoration:underline; }
        .player-feedback__skip:hover { color:#2b2721; }
        .player-cast { position:relative; }
        .player-cast__menu { position:absolute; bottom:100%; right:0; background:#f1ece2; border:1px solid #e3d8c3; border-radius:8px; padding:0.5rem; min-width:200px; display:none; z-index:10; margin-bottom:0.5rem; }
        .player-cast__menu.open { display:block; }
        .player-cast__menu button { display:block; width:100%; text-align:left; padding:0.5rem 0.75rem; background:none; border:none; color:#2b2721; font-size:0.85rem; cursor:pointer; border-radius:4px; }
        .player-cast__menu button:hover { background:#e3d8c3; }
        .player-cast__menu button .cast-icon { margin-right:0.5rem; }
        @media (max-width:768px) {
            .player-header { padding:0.5rem 1rem; }
            .player-controls { padding:0.5rem 1rem; }
            .player-info { padding:1rem; }
            .player-info__title { font-size:1.2rem; }
            .player-volume { display:none; }
            .player-feedback__emojis button { width:56px; height:56px; font-size:1.5rem; }
        }
    </style>
</head>
<body>
    <noscript><div style="padding:2rem;text-align:center;color:#2b2721;background:#faf7f2;min-height:100vh;font-family:sans-serif;"><h1>Цигун</h1><p>Для просмотра видео необходим JavaScript.</p><a href="/" style="color:#8a6f52;">На главную</a></div></noscript>
    <div class="player-page" id="player-root"></div>
    <script>
    (function() {
        var root = document.getElementById('player-root');

        /* ── IndexedDB Progress Store ── */
        var DB_NAME = 'QigongProgress';
        var DB_STORE = 'watchProgress';
        var dbInstance = null;

        function openDB() {
            if (dbInstance) return Promise.resolve(dbInstance);
            return new Promise(function(resolve) {
                var req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = function(e) {
                    var db = e.target.result;
                    if (!db.objectStoreNames.contains(DB_STORE)) {
                        db.createObjectStore(DB_STORE, { keyPath: 'lessonId' });
                    }
                };
                req.onsuccess = function(e) { dbInstance = e.target.result; resolve(dbInstance); };
                req.onerror = function() { resolve(null); };
            });
        }

        function saveLocalProgress(lessonId, position, duration, completed) {
            openDB().then(function(db) {
                if (!db) return;
                try {
                    var tx = db.transaction(DB_STORE, 'readwrite');
                    tx.objectStore(DB_STORE).put({
                        lessonId: lessonId,
                        position: position,
                        duration: duration,
                        completed: !!completed,
                        updatedAt: Date.now()
                    });
                } catch(_) {}
            });
        }

        function getLocalProgress(lessonId) {
            return openDB().then(function(db) {
                if (!db) return null;
                return new Promise(function(resolve) {
                    try {
                        var tx = db.transaction(DB_STORE, 'readonly');
                        var req = tx.objectStore(DB_STORE).get(lessonId);
                        req.onsuccess = function() { resolve(req.result || null); };
                        req.onerror = function() { resolve(null); };
                    } catch(_) { resolve(null); }
                });
            });
        }

        /* ── Helpers ── */
        function getParam(name) { return new URLSearchParams(window.location.search).get(name); }
        function esc(s) { if (s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
        function fmt(s) { if (!s && s!==0) return '0:00'; var m=Math.floor(s/60), sec=Math.floor(s%60); return m+':'+(sec<10?'0':'')+sec; }
        function localDateStr(d) { var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return y+'-'+m+'-'+day; }

        var lessonId = getParam('id');
        var complexId = getParam('complex');
        var dayParam = getParam('day');

        function api(path) {
            var token = localStorage.getItem('user_token');
            var headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = 'Bearer ' + token;
            return fetch(path, { headers: headers }).then(function(res) {
                if (!res.ok) {
                    return res.text().then(function(body) {
                        var err = new Error('API error ' + res.status + ' ' + path + (body ? ' — ' + body.substring(0, 200) : ''));
                        err.status = res.status;
                        try {
                            var parsed = JSON.parse(body);
                            if (parsed && parsed.error && parsed.error.code) err.code = parsed.error.code;
                        } catch(_) {}
                        throw err;
                    });
                }
                return res.json();
            }).then(function(json) {
                if (json && Array.isArray(json.data) && json.pagination) return json.data;
                return json;
            });
        }

        /* ── Media Session API (MWH pattern: lock screen + notification controls) ── */
        function setupMediaSession(lesson, video) {
            if (!('mediaSession' in navigator)) return;
            var posterUrl = lesson.poster_url || 'images/hero-poster.jpg';
            navigator.mediaSession.metadata = new MediaMetadata({
                title: lesson.title || 'Занятие',
                artist: 'Цигун и суставная разминка',
                album: lesson.complex_name || '',
                artwork: [{ src: posterUrl, sizes: '512x512', type: 'image/jpeg' }]
            });
            navigator.mediaSession.setActionHandler('play', function() { video.play(); });
            navigator.mediaSession.setActionHandler('pause', function() { video.pause(); });
            navigator.mediaSession.setActionHandler('seekbackward', function() { video.currentTime = Math.max(0, video.currentTime - 10); });
            navigator.mediaSession.setActionHandler('seekforward', function() { video.currentTime = Math.min(video.duration || 0, video.currentTime + 10); });
            navigator.mediaSession.setActionHandler('previoustrack', function() { var prev = getPrevLesson(); if (prev) window.location.href = 'player.html?id=' + prev.id; });
            navigator.mediaSession.setActionHandler('nexttrack', function() { var next = getNextLesson(); if (next) window.location.href = 'player.html?id=' + next.id; });
            video.addEventListener('play', function() { navigator.mediaSession.playbackState = 'playing'; });
            video.addEventListener('pause', function() { navigator.mediaSession.playbackState = 'paused'; });
        }

        /* ── Heartbeat (MWH pattern: periodic position save to server) ── */
        var heartbeatInterval = null;
        function startHeartbeat(lessonId, video) {
            stopHeartbeat();
            heartbeatInterval = setInterval(function() {
                if (video.paused || video.ended || !video.duration) return;
                var token = localStorage.getItem('user_token');
                if (!token) return;
                var pos = Math.floor(video.currentTime);
                var dur = Math.floor(video.duration);
                var pct = Math.floor((pos / dur) * 100);
                /* Save to server */
                fetch('/api/user/watch-progress', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ lesson_id: lessonId, position_seconds: pos, completed: pct >= 90 })
                }).catch(function() {});
                /* Save to IndexedDB */
                saveLocalProgress(lessonId, pos, dur, pct >= 90);
                /* Update Media Session position */
                if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession) {
                    try {
                        navigator.mediaSession.setPositionState({ duration: dur, playbackRate: video.playbackRate, position: pos });
                    } catch(_) {}
                }
            }, 10000);
        }
        function stopHeartbeat() { if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; } }

        /* ── State for prev/next navigation ── */
        var currentAllLessons = [];
        var currentLessonIndex = -1;
        function getPrevLesson() { return currentLessonIndex > 0 ? currentAllLessons[currentLessonIndex - 1] : null; }
        function getNextLesson() { return currentLessonIndex < currentAllLessons.length - 1 ? currentAllLessons[currentLessonIndex + 1] : null; }

        /* ── Main Load ── */
        async function load() {
            try {
                var lesson = null;
                var allLessons = [];
                var currentIndex = -1;
                var userToken = localStorage.getItem('user_token');
                var userData = null;
                if (userToken) {
                    try { userData = JSON.parse(localStorage.getItem('user_data')); } catch(e) {}
                }

                if (lessonId) {
                    lesson = await api('/api/lessons/' + lessonId);
                    allLessons = await api('/api/lessons');
                    currentIndex = allLessons.findIndex(function(l) { return l.id == lessonId; });
                } else if (complexId) {
                    var complex = await api('/api/complexes/' + complexId);
                    if (complex && complex.lessons && complex.lessons.length) {
                        allLessons = complex.lessons;
                        lesson = allLessons[0] || null;
                        currentIndex = 0;
                    }
                } else {
                    var schedule = await api('/api/schedule');
                    var today = new Date();
                    var todayStr = localDateStr(today);
                    var schedItem = schedule.find(function(s) { return s.date === todayStr; });
                    if (!schedItem && schedule.length) schedItem = schedule[0];
                    if (schedItem && schedItem.lesson_id) {
                        lesson = await api('/api/lessons/' + schedItem.lesson_id);
                    }
                    allLessons = await api('/api/lessons');
                    if (lesson) currentIndex = allLessons.findIndex(function(l) { return l.id === lesson.id; });
                }

                if (!lesson) {
                    root.innerHTML = renderHeader() + renderEmpty();
                    return;
                }

                currentAllLessons = allLessons;
                currentLessonIndex = currentIndex;

                var complexName = '';
                try {
                    var c = await api('/api/lessons/' + lesson.id + '/complex');
                    if (c) {
                        complexName = c.name;
                        lesson.complex_name = complexName;
                    }
                } catch(e) {}

                var FREE_LIMIT = 7;
                if (!userData) {
                    root.innerHTML = renderHeader(lesson, complexName) +
                        '<div class="player-empty"><div class="player-empty__icon">🔒</div>' +
                        '<div class="player-empty__title">Войдите, чтобы смотреть</div>' +
                        '<div class="player-empty__text">Бесплатно — 7 занятий без карты</div>' +
                        '<a href="login.html" class="btn btn--primary" style="margin-right:0.5rem;">Войти</a>' +
                        '<a href="login.html" class="btn btn--secondary">Регистрация</a></div>';
                    return;
                }

                try {
                    var access = await api('/api/user/can-watch/' + lesson.id);
                    if (!access.allowed) {
                        root.innerHTML = renderDenied(lesson, complexName, access.code, access.freeUsed, access.freeLimit);
                        return;
                    }
                } catch(e) {
                    var errStatus = e.status ? e.status : (e.message ? e.message.match(/\d+/) : null);
                    if (errStatus && (parseInt(errStatus) === 403 || parseInt(errStatus[0]) === 403)) {
                        root.innerHTML = renderHeader(lesson, complexName) +
                            '<div class="player-empty"><div class="player-empty__icon">📧</div>' +
                            '<div class="player-empty__title">Подтвердите email</div>' +
                            '<div class="player-empty__text">Проверьте почту и перейдите по ссылке для подтверждения.</div>' +
                            '<a href="login.html" class="btn btn--primary">На главную</a></div>';
                        return;
                    }
                }

                var streamUrl = null;
                var videoAccessToken = null;
                var videoLanguage = 'ru';
                var isOriginal = true;
                try {
                    var tokenData = await api('/api/user/stream-token/' + lesson.id);
                    if (tokenData && tokenData.streamUrl) streamUrl = tokenData.streamUrl;
                    if (tokenData) {
                        videoAccessToken = tokenData.videoAccessToken || null;
                        videoLanguage = tokenData.videoLanguage || 'ru';
                        isOriginal = tokenData.isOriginal !== undefined ? tokenData.isOriginal : true;
                    }
                } catch(e) {
                    var stStatus = e.status ? e.status : (e.message ? e.message.match(/\d+/) : null);
                    var stStatusNum = typeof stStatus === 'number' ? stStatus : (stStatus ? parseInt(Array.isArray(stStatus) ? stStatus[0] : stStatus) : 0);
                    var stCode = e.code || '';
                    if (stStatusNum === 403 && stCode === 'EMAIL_CONFIRMATION_REQUIRED') {
                        root.innerHTML = renderHeader(lesson, complexName) +
                            '<div class="player-empty"><div class="player-empty__icon">📧</div>' +
                            '<div class="player-empty__title">Подтвердите email</div>' +
                            '<div class="player-empty__text">Проверьте почту и перейдите по ссылке для подтверждения.</div>' +
                            '<a href="login.html" class="btn btn--primary">На главную</a></div>';
                        return;
                    }
                    if (stStatusNum === 403 && (stCode === 'PAYMENT_PAST_DUE' || stCode === 'SUBSCRIPTION_EXPIRED' || stCode === 'SUBSCRIPTION_REQUIRED' || stCode === 'FREE_LIMIT_REACHED')) {
                        root.innerHTML = renderDenied(lesson, complexName, stCode);
                        return;
                    }
                    if (stStatusNum === 503 && stCode === 'STREAMING_NOT_CONFIGURED') {
                        root.innerHTML = renderHeader(lesson, complexName) +
                            '<div class="player-empty"><div class="player-empty__icon">📡</div>' +
                            '<div class="player-empty__title">Видео временно недоступно</div>' +
                            '<div class="player-empty__text">Стриминг ещё не настроен. Пожалуйста, попробуйте позже.</div>' +
                            '<a href="lessons.html" class="btn btn--primary">Все занятия</a></div>';
                        return;
                    }
                }

                var directVideoUrl = (function() {
                    var vUrl = lesson.video_url || lesson.video || '';
                    if (!vUrl) return '';
                    var t = videoAccessToken || '';
                    return vUrl + (vUrl.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(t);
                })();

                var langNote = '';
                var userLang = localStorage.getItem('preferred_language') || 'ru';
                if (isOriginal && userLang !== 'ru') {
                    langNote = '<div style="background:#ece4d4;border:1px solid #5c5238;border-radius:8px;padding:0.75rem 1rem;margin-bottom:1rem;color:#cbb98a;font-size:0.85rem;">⚠️ <span data-i18n="player.lang_note">Доступно на русском. Сейчас показывается оригинал с русской озвучкой.</span></div>';
                }

                root.innerHTML = renderHeader(lesson, complexName) + '<div id="lang-note-slot"></div>' + renderPlayer(lesson) + renderInfo(lesson, [], complexName, allLessons, currentIndex);
                var noteSlot = document.getElementById('lang-note-slot');
                if (noteSlot && langNote) noteSlot.innerHTML = langNote;
                bindControls(lesson, allLessons, currentIndex, streamUrl, directVideoUrl);
            } catch(err) {
                root.innerHTML = renderHeader() + '<div class="player-empty"><div class="player-empty__icon">⚠️</div><div class="player-empty__title">Ошибка загрузки</div><div class="player-empty__text">' + esc(err.message) + '</div><a href="/" class="btn btn--primary">На главную</a></div>';
            }
        }

        /* API-003: per-code action screen for access denials (shared by can-watch and stream-token). */
        function renderDenied(lesson, complexName, code, freeUsed, freeLimit) {
            var deniedTitle = 'Бесплатный период окончен';
            var deniedText = 'Оформите подписку для полного доступа.';
            if (freeUsed != null && freeLimit != null) {
                deniedText = 'Вы просмотрели ' + freeUsed + ' из ' + freeLimit + ' бесплатных занятий. Оформите подписку для полного доступа.';
            }
            if (code === 'SUBSCRIPTION_EXPIRED') {
                deniedTitle = 'Подписка истекла';
                deniedText = 'Ваш доступ к подписке завершился. Продлите подписку, чтобы продолжить.';
            } else if (code === 'PAYMENT_PAST_DUE') {
                deniedTitle = 'Оплата не прошла';
                deniedText = 'Последний платёж не удался. Обновите способ оплаты, чтобы восстановить доступ.';
            } else if (code === 'SUBSCRIPTION_REQUIRED') {
                deniedTitle = 'Подписка требуется';
                deniedText = 'Это занятие доступно только по подписке.';
            }
            return renderHeader(lesson, complexName) +
                '<div class="player-empty"><div class="player-empty__icon">⏰</div>' +
                '<div class="player-empty__title">' + deniedTitle + '</div>' +
                '<div class="player-empty__text">' + deniedText + '</div>' +
                '<a href="plans.html" class="btn btn--primary">Выбрать план</a></div>';
        }

        /* ── Resume Prompt (MWH pattern: check saved position, show resume dialog) ── */
        function showResumePrompt(video, savedPosition, duration, onResume, onStart) {
            var overlay = document.getElementById('overlay');
            if (overlay) overlay.classList.add('hidden');
            var existing = document.getElementById('resume-dialog');
            if (existing) existing.remove();
            var pct = Math.floor((savedPosition / duration) * 100);
            var div = document.createElement('div');
            div.className = 'player-resume';
            div.id = 'resume-dialog';
            div.innerHTML = '<div class="player-resume__icon">▶️</div>' +
                '<div class="player-resume__title">Продолжить с места остановки?</div>' +
                '<div class="player-resume__text">Вы просмотрели ' + pct + '% — ' + fmt(savedPosition) + ' из ' + fmt(duration) + '</div>' +
                '<div class="player-resume__btns">' +
                '<button class="btn-resume" id="btn-resume-yes">Продолжить</button>' +
                '<button class="btn-start" id="btn-resume-no">Сначала</button>' +
                '</div>';
            document.getElementById('player-wrap').appendChild(div);
            document.getElementById('btn-resume-yes').addEventListener('click', function() { div.remove(); onResume(); });
            document.getElementById('btn-resume-no').addEventListener('click', function() { div.remove(); onStart(); });
        }

        window.submitFeedback = function(btn, lessonId) {
            var mood = btn.getAttribute('data-mood');
            var token = localStorage.getItem('user_token');
            if (!token) return;
            document.querySelectorAll('.player-feedback__emojis button').forEach(function(b) { b.classList.remove('selected'); });
            btn.classList.add('selected');
            fetch('/api/user/workout-feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ lesson_id: Number(lessonId), mood: mood })
            }).then(function() {
                var section = document.getElementById('feedback-section');
                if (section) section.innerHTML = '<div style="font-size:2rem;margin-bottom:0.5rem;">✓</div><div style="color:#8a6f52;font-size:0.9rem;">Спасибо за оценку!</div>';
            }).catch(function() {});
        };

        window.skipFeedback = function() {
            var section = document.getElementById('feedback-section');
            if (section) section.style.display = 'none';
        };

        function bindControls(lesson, allLessons, currentIndex, streamUrl, directVideoUrl) {
            var video = document.getElementById('video');
            var overlay = document.getElementById('overlay');
            var btnPlay = document.getElementById('btn-play');
            var progress = document.getElementById('progress');
            var progressFill = document.getElementById('progress-fill');
            var progressBuffered = document.getElementById('progress-buffered');
            var progressHover = document.getElementById('progress-hover');
            var timeDisplay = document.getElementById('time');
            var btnFullscreen = document.getElementById('btn-fullscreen');
            var btnMute = document.getElementById('btn-mute');
            var volumeSlider = document.getElementById('volume-slider');
            var playerLoading = document.getElementById('player-loading');
            var playerError = document.getElementById('player-error');
            var btnRetry = document.getElementById('btn-retry');

            if (!video) return;

            /* Loading/error states */
            video.addEventListener('waiting', function() { if (playerLoading) playerLoading.style.display = 'flex'; });
            video.addEventListener('canplay', function() { if (playerLoading) playerLoading.style.display = 'none'; });
            video.addEventListener('playing', function() { if (playerLoading) playerLoading.style.display = 'none'; });
            video.addEventListener('error', function() {
                if (playerLoading) playerLoading.style.display = 'none';
                if (playerError) playerError.style.display = 'flex';
            });
            if (btnRetry) btnRetry.addEventListener('click', function() {
                if (playerError) playerError.style.display = 'none';
                if (overlay) overlay.classList.remove('hidden');
                video.load();
            });

            /* Volume — attach listeners first so initial state sync fires into them */
            var unmutedSvg = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0012 8.5v7a4.5 4.5 0 004.5-3.5zM12 1v2a8 8 0 010 16v2a10 10 0 000-20z"/></svg>';
            var mutedSvg = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0012 8.5v7a4.5 4.5 0 004.5-3.5z"/><line x1="18" y1="9" x2="22" y2="15" stroke="currentColor" stroke-width="2"/><line x1="22" y1="9" x2="18" y2="15" stroke="currentColor" stroke-width="2"/></svg>';

            function updateMuteIcon() {
                btnMute.innerHTML = video.muted || video.volume === 0 ? mutedSvg : unmutedSvg;
            }

            btnMute.addEventListener('click', function() {
                video.muted = !video.muted;
                updateMuteIcon();
            });

            volumeSlider.addEventListener('input', function() {
                video.volume = parseFloat(volumeSlider.value);
                video.muted = video.volume === 0;
                updateMuteIcon();
            });

            video.addEventListener('volumechange', function() {
                volumeSlider.value = video.muted ? 0 : video.volume;
                updateMuteIcon();
            });

            /* Init volume UI to match default state */
            volumeSlider.value = video.muted ? 0 : video.volume;
            updateMuteIcon();

            /* Play/pause */
            var playIcon = '<svg viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>';
            var pauseIcon = '<svg viewBox="0 0 24 24"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>';

            function togglePlay() {
                if (video.paused) {
                    video.muted = false;
                    video.volume = video.volume || 1;
                    video.play().catch(function() {
                        video.play().catch(function() {});
                    });
                    btnPlay.innerHTML = pauseIcon;
                    overlay.classList.add('hidden');
                }
                else { video.pause(); btnPlay.innerHTML = playIcon; overlay.classList.remove('hidden'); }
            }

            overlay.addEventListener('click', togglePlay);
            btnPlay.addEventListener('click', togglePlay);

            /* Resume prompt on loadedmetadata */
            video.addEventListener('loadedmetadata', function() {
                if (!video.duration || video.duration < 5) return;
                getLocalProgress(lesson.id).then(function(saved) {
                    if (saved && !saved.completed && saved.position > 10 && saved.position < video.duration * 0.9) {
                        showResumePrompt(video, saved.position, video.duration,
                            function() { video.currentTime = saved.position; video.muted = false; video.volume = video.volume || 1; video.play().catch(function() { video.play().catch(function() {}); }); btnPlay.innerHTML = pauseIcon; overlay.classList.add('hidden'); },
                            function() { video.muted = false; video.volume = video.volume || 1; video.play().catch(function() { video.play().catch(function() {}); }); btnPlay.innerHTML = pauseIcon; overlay.classList.add('hidden'); }
                        );
                    }
                });
            });

            /* Time update + progress bar */
            video.addEventListener('timeupdate', function() {
                console.log('TIMEUPDATE: duration=' + video.duration + ' currentTime=' + video.currentTime);
                if (video.currentTime > 0.5) video._sawProgress = true;
                if (video.duration) {
                    progressFill.style.width = (video.currentTime / video.duration * 100) + '%';
                    timeDisplay.textContent = fmt(video.currentTime) + ' / ' + fmt(video.duration);
                }
            });

            /* Buffered progress */
            video.addEventListener('progress', function() {
                if (video.duration && video.buffered.length) {
                    var end = video.buffered.end(video.buffered.length - 1);
                    progressBuffered.style.width = (end / video.duration * 100) + '%';
                }
            });

            /* Progress bar click */
            progress.addEventListener('click', function(e) {
                if (video.duration) {
                    var rect = progress.getBoundingClientRect();
                    video.currentTime = ((e.clientX - rect.left) / rect.width) * video.duration;
                }
            });

            /* Progress bar hover preview */
            progress.addEventListener('mousemove', function(e) {
                if (!video.duration) return;
                var rect = progress.getBoundingClientRect();
                var pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                var hoverTime = pct * video.duration;
                progressHover.textContent = fmt(hoverTime);
                progressHover.style.left = (pct * 100) + '%';
            });

            /* Video ended → completion overlay */
            video.addEventListener('ended', function() {
                console.log('VIDEO ENDED: duration=' + video.duration + ' currentTime=' + video.currentTime + ' paused=' + video.paused + ' ended=' + video.ended);
                if (!video.duration || video.currentTime <= 0) return;
                if (video.duration > 5 && !video._sawProgress) return;
                stopHeartbeat();
                if (video._progressSent) return;
                video._progressSent = true;
                btnPlay.innerHTML = playIcon;
                saveLocalProgress(lesson.id, Math.floor(video.duration || 0), Math.floor(video.duration || 0), true);
                var userToken = localStorage.getItem('user_token');
                if (userToken && lesson) {
                    fetch('/api/user/watch-progress', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + userToken },
                        body: JSON.stringify({ lesson_id: lesson.id, position_seconds: Math.floor(video.duration || 0), completed: true })
                    }).then(function() {
                        return fetch('/api/user/me', { headers: { 'Authorization': 'Bearer ' + userToken } });
                    }).then(function(r) { return r.json(); })
                    .then(function(data) {
                        if (data.free_sessions_used !== undefined) {
                            try {
                                var ud = JSON.parse(localStorage.getItem('user_data'));
                                if (ud) { ud.free_sessions_used = data.free_sessions_used; localStorage.setItem('user_data', JSON.stringify(ud)); }
                            } catch(e) {}
                        }
                    }).catch(function() {});
                }
                showCompleteOverlay(lesson, allLessons, currentIndex, userToken);
            });

            /* Heartbeat: save position every 10s */
            video.addEventListener('play', function() { console.log('VIDEO PLAY: duration=' + video.duration + ' currentTime=' + video.currentTime); startHeartbeat(lesson.id, video); });
            video.addEventListener('pause', function() { stopHeartbeat(); });
            video.addEventListener('seeked', function() {
                if (!video.paused) startHeartbeat(lesson.id, video);
            });

            /* Save final position on page unload */
            window.addEventListener('beforeunload', function() {
                stopHeartbeat();
                if (video.duration) {
                    saveLocalProgress(lesson.id, Math.floor(video.currentTime), Math.floor(video.duration), false);
                }
            });

            /* HLS / direct source — attach AFTER all event listeners */
            video.volume = 1;
            video.addEventListener('loadedmetadata', function() {
                video.volume = 1;
            }, { once: true });
            if (streamUrl) {
                if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = streamUrl;
                } else if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                    var hls = new Hls();
                    hls.loadSource(streamUrl);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.ERROR, function(event, data) {
                        if (data.fatal) {
                            if (playerLoading) playerLoading.style.display = 'none';
                            if (playerError) playerError.style.display = 'flex';
                        }
                    });
                } else {
                    video.src = streamUrl;
                }
                } else if (directVideoUrl) {
                    video.src = directVideoUrl;
                }

            /* Fullscreen */
            btnFullscreen.addEventListener('click', function() {
                var wrap = document.getElementById('player-wrap');
                if (document.fullscreenElement) document.exitFullscreen();
                else if (wrap.requestFullscreen) wrap.requestFullscreen();
                else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
            });

            /* Cast to TV */
            var btnCast = document.getElementById('btn-cast');
            var castMenu = document.getElementById('cast-menu');
            var castPresentation = document.getElementById('cast-presentation');
            if (btnCast && castMenu) {
                btnCast.addEventListener('click', function(e) {
                    e.stopPropagation();
                    castMenu.classList.toggle('open');
                });
                document.addEventListener('click', function() { castMenu.classList.remove('open'); });
            }
            if (castPresentation) {
                castPresentation.addEventListener('click', function() {
                    castMenu.classList.remove('open');
                    if ('presentation' in navigator) {
                        var presentationUrl = window.location.href;
                        try {
                            var request = new PresentationRequest(presentationUrl);
                            request.start().then(function(connection) {
                                connection.connection.then(function() {
                                    console.log('Cast: connected');
                                });
                            }).catch(function(err) {
                                console.log('Cast: cancelled or error', err);
                                window.castFallback();
                            });
                        } catch(e) {
                            window.castFallback();
                        }
                    } else {
                        window.castFallback();
                    }
                });
            }
            window.castFallback = function() {
                if (video.src) {
                    window.open(video.src, '_blank');
                } else {
                    alert('Для трансляции на ТВ используйте зеркалирование экрана в настройках вашего телефона/планшета.');
                }
            };
            window.castToScreen = function() {
                castMenu.classList.remove('open');
                if (navigator.share && navigator.canShare) {
                    var shareData = { title: lesson.title || 'Занятие', url: window.location.href };
                    navigator.share(shareData).catch(function() {});
                } else {
                    alert('Откройте настройки вашего устройства и включите "Зеркалирование экрана" или "Screen Mirroring".');
                }
            };

            /* Keyboard shortcuts */
            document.addEventListener('keydown', function(e) {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
                if (e.code === 'ArrowLeft') { video.currentTime = Math.max(0, video.currentTime - 10); }
                if (e.code === 'ArrowRight') { video.currentTime = Math.min(video.duration, video.currentTime + 10); }
                if (e.code === 'KeyF') { btnFullscreen.click(); }
                if (e.code === 'KeyM') { btnMute.click(); }
            });

            /* Media Session (MWH pattern: OS-level controls) */
            setupMediaSession(lesson, video);
        }

        load();
    })();
    </script>
</body>
</html>
