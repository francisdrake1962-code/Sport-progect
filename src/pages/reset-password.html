<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <title>Сброс пароля — Цигун и суставная разминка</title>
    
    <style>
        .auth-page { min-height:100vh; background:linear-gradient(135deg,#faf7f2 0%,#f1ece2 100%); display:flex; align-items:center; justify-content:center; padding:1rem; }
        .auth-card { background:#ffffff; border:1px solid #e3d8c3; border-radius:16px; padding:2.5rem; width:100%; max-width:420px; }
        .auth-card__logo { text-align:center; margin-bottom:1.5rem; }
        .auth-card__logo img { width:80px; height:auto; }
        .auth-card__title { color:#2b2721; font-size:1.4rem; font-weight:700; text-align:center; margin-bottom:0.3rem; }
        .auth-card__sub { color:#8f8578; text-align:center; font-size:0.9rem; margin-bottom:1.5rem; }
        .form-group { margin-bottom:1rem; }
        .form-group label { display:block; color:#8a6f52; font-size:0.85rem; margin-bottom:0.3rem; }
        .form-group input { width:100%; padding:0.7rem 0.9rem; background:#f1ece2; border:1px solid #e3d8c3; border-radius:8px; color:#2b2721; font-size:0.95rem; outline:none; transition:border-color .15s; box-sizing:border-box; }
        .form-group input:focus { border-color:#8a6f52; }
        .auth-btn { width:100%; padding:0.8rem; background:#8a6f52;color:#f5efe4; border:none; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .15s; margin-top:0.5rem; }
        .auth-btn:hover { background:#a07f58; }
        .auth-btn:disabled { opacity:0.5; cursor:not-allowed; }
        .auth-error { color:#c96a54; font-size:0.85rem; margin-top:0.5rem; text-align:center; display:none; }
        .auth-success { color:#9aa87f; font-size:0.85rem; margin-top:0.5rem; text-align:center; display:none; }
        .auth-back { text-align:center; margin-top:1.5rem; }
        .auth-back a { color:#7c6f5d; text-decoration:none; font-size:0.85rem; }
        .auth-back a:hover { color:#8a6f52; }
    </style>
</head>
<body>
    <noscript><div style="padding:2rem;text-align:center;font-family:sans-serif;background:#faf7f2;color:#2b2721;min-height:100vh;"><h1>Сайт требует JavaScript</h1><p>Включите JavaScript, чтобы пользоваться сайтом.</p></div></noscript>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-card__logo"><img src="images/logo.svg" alt="Логотип"></div>
            <div class="auth-card__title" id="card-title">Сброс пароля</div>
            <div class="auth-card__sub" id="card-sub">Укажите email — мы отправим ссылку для сброса</div>

            <form id="request-form">
                <div class="form-group"><label for="req-email">Email</label><input type="email" id="req-email" required autocomplete="email"></div>
                <div class="auth-error" id="req-error"></div>
                <div class="auth-success" id="req-success"></div>
                <button type="submit" class="auth-btn" id="req-btn">Отправить ссылку</button>
            </form>

            <form id="reset-form" style="display:none;">
                <div class="form-group"><label for="new-password">Новый пароль (минимум 8 символов)</label><input type="password" id="new-password" required minlength="8" autocomplete="new-password"></div>
                <div class="form-group"><label for="new-password2">Повторите пароль</label><input type="password" id="new-password2" required minlength="8" autocomplete="new-password"></div>
                <div class="auth-error" id="reset-error"></div>
                <div class="auth-success" id="reset-success"></div>
                <button type="submit" class="auth-btn" id="reset-btn">Сохранить новый пароль</button>
            </form>

            <div class="auth-back"><a href="login.html">← Войти</a></div>
        </div>
    </div>
    <script>
    (function() {
        function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function errText(d) {
            if (d && d.error && typeof d.error === 'object') return d.error.message || '';
            if (d && d.error) return d.error;
            if (d && d.message) return d.message;
            return '';
        }
        var token = new URLSearchParams(window.location.search).get('token');
        var requestForm = document.getElementById('request-form');
        var resetForm = document.getElementById('reset-form');
        var cardSub = document.getElementById('card-sub');
        var reqError = document.getElementById('req-error');
        var reqSuccess = document.getElementById('req-success');
        var resetError = document.getElementById('reset-error');
        var resetSuccess = document.getElementById('reset-success');

        if (token) {
            requestForm.style.display = 'none';
            resetForm.style.display = 'block';
            cardSub.textContent = 'Придумайте новый пароль';
        }

        requestForm.addEventListener('submit', function(e) {
            e.preventDefault();
            reqError.style.display = 'none';
            reqSuccess.style.display = 'none';
            var email = document.getElementById('req-email').value.trim();
            fetch('/api/user/request-reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            }).then(function(r) { return r.json(); }).then(function(d) {
                if (d.success) {
                    reqSuccess.textContent = 'Если указанный email зарегистрирован, мы отправили на него ссылку для сброса пароля.';
                    reqSuccess.style.display = 'block';
                } else {
                    reqError.textContent = errText(d) || 'Не удалось отправить запрос. Попробуйте позже.';
                    reqError.style.display = 'block';
                }
            }).catch(function() {
                reqError.textContent = 'Ошибка сети. Попробуйте позже.';
                reqError.style.display = 'block';
            });
        });

        resetForm.addEventListener('submit', function(e) {
            e.preventDefault();
            resetError.style.display = 'none';
            resetSuccess.style.display = 'none';
            var newPassword = document.getElementById('new-password').value;
            var newPassword2 = document.getElementById('new-password2').value;
            if (newPassword !== newPassword2) {
                resetError.textContent = 'Пароли не совпадают.';
                resetError.style.display = 'block';
                return;
            }
            fetch('/api/user/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token, newPassword: newPassword })
            }).then(function(r) { return r.json(); }).then(function(d) {
                if (d.success) {
                    resetSuccess.textContent = 'Пароль изменён. Теперь вы можете войти с новым паролем.';
                    resetSuccess.style.display = 'block';
                    setTimeout(function() { window.location.href = '/login'; }, 1500);
                } else {
                    resetError.textContent = errText(d) || 'Не удалось сбросить пароль. Ссылка могла устареть.';
                    resetError.style.display = 'block';
                }
            }).catch(function() {
                resetError.textContent = 'Ошибка сети. Попробуйте позже.';
                resetError.style.display = 'block';
            });
        });
    })();
    </script>
</body>
</html>
